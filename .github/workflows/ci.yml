name: CI

on:
  push:
  pull_request:
  # by hand (Actions → CI → Run workflow): the gallery is made only this way
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --output-format=github .

  # fedtail-sync faces the internet: its tests, every line of it covered, and a static
  # check (bandit, and ruff's bandit rules over the sync code) must pass — on the oldest
  # Python the server promises too
  security:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      # the server, a project of its own: its main, beside fedtail's code, one version
      - uses: actions/checkout@v5
        with:
          repository: eugene-vereshchagin/fedtail-syncserver
          path: fedtail-syncserver
      - run: python fedtail-syncserver/tools/same_version.py fedtail/__init__.py
      - run: pip install bandit ruff requests cryptography
      - run: bandit -r fedtail/core/sync -ll
      - run: ruff check --select S --output-format=github fedtail/core/sync
      # the client against the real server (the server's own tests: in its repository)
      - run: python -m unittest -v tests.test_sync

  # known vulnerabilities in what fedtail runs on (requests, urllib3, PySide6, textual):
  # reported as warnings, never holding a release — a new CVE upstream is news, not a
  # broken build
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pip-audit && pip install ".[qt]" textual
      - run: pip-audit --skip-editable --progress-spinner off

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install requests PySide6-Essentials textual cryptography
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          # a hang ends in a stack dump (faulthandler on SIGABRT), not in the job's 6 h;
          # the whole run takes some 13 min on a hosted runner: room for twice that
          timeout -s ABRT 1800 python -X faulthandler -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        run: python .github/annotate.py test-output.txt
      - name: Installs as a package (pip), the command works
        run: |
          cd /tmp && pip install "$GITHUB_WORKSPACE[qt]" && fedtail --version
          python -c "import fedtail, importlib.resources as r; assert r.files('fedtail').joinpath('data/config.example.ru.toml').is_file(); assert r.files('fedtail').joinpath('data/config.example.en.toml').is_file(); assert r.files('fedtail').joinpath('data/help/ru/index.md').is_file(); assert r.files('fedtail').joinpath('data/themes/system.toml').is_file()"

  # lightness held (docs/en/dev/memory.md, step 8): the bench with ceilings of memory and
  # time — the core alone and the Qt window; over one, the release waits
  budgets:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      FEDTAIL_BUDGETS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install requests PySide6-Essentials cryptography
      - run: python -m unittest -v tests.test_budgets

  # the web page in a real browser: what app.js does (tests only reach the server) — the
  # lanes, menus, the editor, holding the opening card, a column's reading
  web-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests cryptography playwright
      - run: python -m playwright install --with-deps chromium
      - run: python tools/web_check.py web-check
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: web-check-${{ github.run_number }}
          path: web-check/

  # the port: Windows with Qt from pip
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests PySide6-Essentials textual cryptography
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -X faulthandler -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        shell: bash
        run: python .github/annotate.py test-output.txt

  # one file with everything inside, no Python to install: fedtail.exe for Windows…
  windows-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: windows-latest
    env:  # the code-signing certificate, when there is one (signs the program and the installer)
      CERT: ${{ secrets.WINDOWS_CERT_PFX }}
      CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      # Qt's wheels from 6.10 on are built for x86-64-v2 (SSE4.2, POPCNT): as the Linux
      # binary, the exe died on old processors. 6.9 is the last for every x86-64.
      - run: pip install requests "PySide6-Essentials<6.10" "textual>=0.86" pyinstaller cryptography
      - run: python -c "from PySide6 import QtCore; v = QtCore.qVersion(); print(v); assert tuple(map(int, v.split('.')[:2])) < (6, 10), v"
      - run: python packaging/build.py
      - name: Starts
        shell: bash
        run: ./dist/fedtail.exe --version
      # signed when the certificate is there (a .pfx, base64, and its password); without
      # it the files go unsigned, as before — Windows then asks "run anyway?"
      - name: Sign the program
        if: env.CERT != ''
        shell: pwsh
        run: |
          [IO.File]::WriteAllBytes("cert.pfx", [Convert]::FromBase64String($env:CERT))
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\fedtail.exe
      # the installer (Inno Setup, on the runner already): the user's programs folder, the
      # Start menu, an uninstaller — packaging/windows/fedtail.iss
      - name: The installer
        shell: bash
        run: |
          set -x
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [ -f "$ISCC" ] || choco install innosetup -y --no-progress
          [ -f "$ISCC" ] || ISCC=$(ls /c/Program\ Files*/Inno\ Setup*/ISCC.exe | head -1)
          ls -la dist build/fedtail.ico
          VER=$(python -c "import fedtail; print(fedtail.__version__)")
          HOME_URL=$(python -c "from fedtail import version; print(version.HOMEPAGE)")
          MSYS_NO_PATHCONV=1 "$ISCC" /DVersion="$VER" /DHomepage="$HOME_URL" packaging\\windows\\fedtail.iss
          test -f dist/fedtail-setup.exe
      - name: Sign the installer
        if: env.CERT != ''
        shell: pwsh
        run: |
          $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin\*\x64\signtool.exe" | Select-Object -Last 1
          & $signtool.FullName sign /f cert.pfx /p $env:CERT_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 dist\fedtail-setup.exe
          Remove-Item cert.pfx
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-windows
          path: |
            dist/fedtail.exe
            dist/fedtail-setup.exe

  # …and fedtail for Linux, built on Debian 12 so it runs on older systems too
  linux-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, debian]
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-venv python3-pip libpython3.11 binutils git ca-certificates libglib2.0-0 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 qemu-user
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv /tmp/venv
          {
            # Qt's wheels from 6.10 on are built for x86-64-v2 (SSE4.2, POPCNT): the binary
            # died with SIGILL on a Phenom II. 6.9 is the last for every x86-64.
            # textual: the terminal interface goes in too (--ui tui; 11.11: "No module 'rich'")
            /tmp/venv/bin/pip install requests 'PySide6-Essentials<6.10' 'textual>=0.86' pyinstaller cryptography &&
            /tmp/venv/bin/python packaging/build.py &&
            ./dist/fedtail --version
          } 2>&1 | tee build.log
          # fonts and keyboard come from the system it runs on, never from this one
          /tmp/venv/bin/pyi-archive_viewer -l dist/fedtail > contents.txt || true
          if grep -iE 'libfontconfig|libfreetype' contents.txt; then
            echo "::error::fontconfig/freetype got into the one-file build"; exit 1
          fi
          if ! grep -q 'libqwayland' contents.txt; then
            echo "::warning::no Wayland platform plugin in the one-file build"
          fi
          echo "Qt plugin files: $(grep -c 'plugins' contents.txt || true)"
      - name: Runs on an old processor (no SSSE3, SSE4.1/4.2)
        shell: bash
        run: |
          # Opteron_G3 is a Phenom-era CPU; qemu refuses the instructions it lacks
          qemu-x86_64 -cpu Opteron_G3 ./dist/fedtail --version
          QT_QPA_PLATFORM=offscreen qemu-x86_64 -cpu Opteron_G3 /tmp/venv/bin/python -c \
            "from PySide6 import QtCore, QtGui, QtWidgets; app = QtWidgets.QApplication([]); print(QtCore.qVersion())"
      - name: What went wrong
        if: failure()
        run: grep -iE 'error|traceback|no matching|not found|denied|requires' build.log | tail -n 9 | sed 's/^/::warning::/'
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-linux
          path: dist/fedtail

  # the real target: Debian 13 with Qt from apt, no pip at all
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-requests python3-pyside6.qtwidgets python3-pyside6.qtdbus
      - name: GTK 4 and a display for the GTK tests (docs/en/dev/gtk.md)
        # xdotool: tests/test_gtk_by_hand.py drags and types with the real pointer and keys
        run: apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 xvfb xauth xdotool
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          timeout -s ABRT 1800 xvfb-run -a python3 -X faulthandler -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Qt by hand (the real pointer and keys, Qt on X11)
        # tests/test_qt_by_hand.py: a process of its own — the run above made its Qt
        # offscreen; FEDTAIL_BY_HAND turns its skip into a failure
        shell: bash
        env:
          QT_QPA_PLATFORM: xcb
          FEDTAIL_BY_HAND: "1"
        run: |
          set -o pipefail
          timeout -s ABRT 600 xvfb-run -a python3 -X faulthandler -m unittest -v tests.test_qt_by_hand 2>&1 | tee -a test-output.txt
      - name: Failures as annotations
        if: failure()
        run: python3 .github/annotate.py test-output.txt

  # the .debs for Debian 13 (one per interface, packaging/deb.py): built, each way of
  # installing them tried in a clean Debian of its own with apt (so the dependencies
  # resolve) and started; attached to a release next to the one-file builds
  deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends python3 dpkg-dev
      - run: python3 packaging/deb.py
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-deb
          path: dist/fedtail*_all.deb

  # each package alone in a clean Debian: what it pulls in, and that fedtail starts the
  # window it brought (ui.frontend = "auto") — GTK's never pulls Qt, the program alone
  # no toolkit at all
  deb-install:
    needs: deb
    runs-on: ubuntu-latest
    container: debian:trixie
    strategy:
      fail-fast: false
      matrix:
        way: [usual, gtk, tui, bare]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fedtail-deb
          path: dist
      - name: Installs with apt, starts
        run: |
          apt-get update
          cd dist
          case "${{ matrix.way }}" in
            usual) apt-get install -y ./fedtail_*_all.deb ./fedtail-common_*_all.deb ./fedtail-qt_*_all.deb; want=qt ;;
            gtk)   apt-get install -y ./fedtail-common_*_all.deb ./fedtail-gtk_*_all.deb; want=gtk ;;
            tui)   apt-get install -y --no-install-recommends ./fedtail-common_*_all.deb ./fedtail-tui_*_all.deb; want=web ;;
            bare)  apt-get install -y --no-install-recommends ./fedtail-common_*_all.deb; want=web ;;
          esac
          cd /tmp
          fedtail --version
          test -f /usr/share/applications/online.dmesg.fedtail.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/fedtail.png
          python3 -c "import fedtail.frontends.web.server"
          got=$(python3 -c "from fedtail import deps; print(deps.auto_frontend(terminal=False))")
          echo "auto: $got"; test "$got" = "$want"
          case "${{ matrix.way }}" in
            usual) python3 -c "import fedtail.frontends.qt" ;;
            gtk)   ! dpkg -l 'python3-pyside6*' 2>/dev/null | grep -q '^ii' ;;
            tui)   python3 -c "import fedtail.frontends.tui.app" ;;
            bare)  ! dpkg -l 'python3-pyside6*' 'python3-gi' 'python3-textual' 2>/dev/null | grep -q '^ii' ;;
          esac

  # the Python package for PyPI (`pip install fedtail`): the sdist and the wheel, checked
  # as PyPI will (twine), installed into a clean venv and started. Published by
  # `pypi-publish` after a release
  pypi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install build twine
      - run: python -m build
      - run: python -m twine check --strict dist/*
      - name: Installs from the wheel, starts
        run: |
          python -m venv /tmp/v && /tmp/v/bin/pip install dist/*.whl
          cd /tmp && /tmp/v/bin/fedtail --version
          /tmp/v/bin/python -c "import fedtail, importlib.resources as r; assert r.files('fedtail').joinpath('data/icons/lanes/rss.svg').is_file()"
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-pypi
          path: dist/*

  # the Arch Linux package (packaging/arch.py): makepkg from the source archive in a clean
  # Arch, namcap, installed with pacman and started; the release carries it and the AUR's
  # PKGBUILD
  arch:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git namcap python python-build python-installer python-setuptools python-wheel python-requests pyside6 hicolor-icon-theme
      - uses: actions/checkout@v5
      - name: makepkg, namcap, pacman, starts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python packaging/source.py build/arch
          python packaging/arch.py build/arch --local build/arch/fedtail-*.tar.gz
          useradd -m builder && chown -R builder build/arch
          su builder -c "cd build/arch && makepkg --nodeps --force"
          namcap build/arch/PKGBUILD build/arch/fedtail-*.pkg.tar.zst
          pacman -U --noconfirm build/arch/fedtail-*.pkg.tar.zst
          cd /tmp && fedtail --version
          python -c "import fedtail.frontends.qt.window, fedtail.frontends.web.server"
          fedtail --check | tee check.txt; grep -q "pacman -S" check.txt
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-arch
          path: build/arch/fedtail-*.pkg.tar.zst

  # the RPM for Fedora (packaging/rpm.py): rpmbuild in a clean Fedora with its pyproject
  # macros, rpmlint, installed with dnf, its menu entry and AppStream file validated,
  # started
  rpm:
    runs-on: ubuntu-latest
    container: fedora:latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - run: dnf -y install git rpm-build rpmlint python3-devel pyproject-rpm-macros dnf-plugins-core appstream desktop-file-utils
      - uses: actions/checkout@v5
      - name: rpmbuild, rpmlint, dnf, starts
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 packaging/source.py build/rpm
          python3 packaging/rpm.py build/rpm --local build/rpm/fedtail-*.tar.gz
          cd build/rpm
          D=(--define "_sourcedir $PWD" --define "_srcrpmdir $PWD" --define "_rpmdir $PWD")
          # the build's own requirements come from pyproject.toml (%generate_buildrequires)
          for i in 1 2 3; do
            rpmbuild -br "${D[@]}" fedtail.spec && break
            dnf -y builddep ./fedtail-*.buildreqs.nosrc.rpm
          done
          rpmbuild -ba "${D[@]}" fedtail.spec
          rpmlint noarch/fedtail-*.rpm || true  # said, not held to (its Fedora rules change)
          dnf -y install ./noarch/fedtail-*.noarch.rpm
          appstreamcli validate --no-net /usr/share/metainfo/online.dmesg.fedtail.metainfo.xml
          desktop-file-validate /usr/share/applications/online.dmesg.fedtail.desktop
          cd /tmp && fedtail --version
          python3 -c "import fedtail.frontends.qt.window, fedtail.frontends.web.server"
          fedtail --check | tee check.txt; grep -q "dnf install" check.txt
        shell: bash
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-rpm
          path: build/rpm/noarch/fedtail-*.noarch.rpm

  # the AppImage (packaging/appimage.py): the PyInstaller folder built on Debian 12 as
  # the one-file build, appimagetool (pinned, its sha256 checked) makes the image and its
  # .zsync for delta updates; started from the image
  appimage:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, debian]
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-venv python3-pip libpython3.11 binutils git ca-certificates curl file libglib2.0-0 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install requests 'PySide6-Essentials<6.10' 'textual>=0.86' pyinstaller cryptography
          /tmp/venv/bin/python packaging/build.py --onedir
          curl -sSLo /tmp/appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.1/appimagetool-x86_64.AppImage
          echo "ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0  /tmp/appimagetool" | sha256sum -c
          chmod +x /tmp/appimagetool
          /tmp/venv/bin/python packaging/appimage.py /tmp/appimagetool
          APPIMAGE_EXTRACT_AND_RUN=1 ./dist/fedtail-*-x86_64.AppImage --version
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-appimage
          path: dist/fedtail-*-x86_64.AppImage*

  # the Flatpak (packaging/flatpak/): KDE's runtime with PySide6's BaseApp, built into a
  # bundle (`flatpak install --user fedtail-….flatpak`); Flathub builds from the same
  # manifest once it is submitted there
  flatpak:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, debian]
    runs-on: ubuntu-latest
    container:
      # not the kde-6.11 image: updating the SDK it holds fails inside the container
      # ("Invalid cross-device link"); here KDE's SDK is installed fresh
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-25.08
      options: --privileged
    steps:
      - uses: actions/checkout@v5
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: fedtail.flatpak
          manifest-path: packaging/flatpak/online.dmesg.fedtail.yml
          cache-key: flatpak-builder-${{ github.sha }}
          upload-artifact: true

  # the Nix flake (flake.nix, packaging/nix/package.nix): built from nixpkgs as locked,
  # started
  nix:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [test, debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v31
      - run: nix build -L .#default
      - run: ./result/bin/fedtail --version

  # the web interface's image (packaging/docker/): built, started, the page answers
  # (403 without the key); published to ghcr.io by `docker-publish` after a release
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker build -f packaging/docker/Dockerfile -t fedtail:ci .
      - name: Starts, the page answers, the link is printed
        run: |
          docker run -d --name ft -p 127.0.0.1:8765:8765 fedtail:ci
          for i in $(seq 30); do docker logs ft 2>&1 | grep -q "http://" && break; sleep 1; done
          docker logs ft 2>&1 | grep -q "http://127.0.0.1:8765/"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8765/)" = 403
          docker rm -f ft

  # real screenshots of the window with made-up data, published to the
  # `screenshots` branch so the look can be reviewed without running the app.
  # Only when run by hand on main: the README's pictures live there and change seldom
  screenshots:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - name: Qt, fonts, icons
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-requests \
            python3-pyside6.qtwidgets git ca-certificates
          for p in qt6-svg-plugins libqt6svg6 fonts-noto-core fonts-noto-color-emoji \
                   fonts-dejavu-core breeze-icon-theme; do
            apt-get install -y --no-install-recommends "$p" || echo "::warning::no package $p"
          done
      - run: python3 tools/screenshots.py out
      - name: The GTK window too
        run: |
          apt-get install -y --no-install-recommends python3-gi gir1.2-gtk-4.0 xvfb xauth \
            || echo "::warning::no GTK 4 packages"
          xvfb-run -a python3 tools/gtk_screenshots.py out system point terminal \
            || echo "::warning::GTK screenshots failed"
      - name: Publish to the screenshots branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          cat > README.md <<EOF
          Screenshots of ${GITHUB_SHA} (made-up data, offscreen Qt, Fusion style).
          EOF
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

  # the phone's APK for a release: built and signed only when fedtail/__init__.py says a
  # release version (the dev builds, signed with the dev key, are android.yml's). Without
  # the release key in the secrets the release goes out without the APK, with a warning
  apk:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # the build number: commits since the tag (android/app/build.gradle.kts)
      - name: A release version, a key?
        id: want
        env:
          KEY: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('fedtail/__init__.py').read()).group(1))")
          case "$VER" in *dev*) echo "development version $VER: no release APK"; exit 0;; esac
          if git rev-parse "v$VER" >/dev/null 2>&1; then echo "v$VER already tagged"; exit 0; fi
          if [ -z "$KEY" ]; then echo "::warning::no ANDROID_KEYSTORE secret: fedtail $VER goes out without the APK"; exit 0; fi
          echo "build=true" >> "$GITHUB_OUTPUT"
      - if: steps.want.outputs.build == 'true'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - if: steps.want.outputs.build == 'true'
        uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
      - if: steps.want.outputs.build == 'true'
        uses: gradle/actions/setup-gradle@v4
      - name: Build the release APK
        if: steps.want.outputs.build == 'true'
        working-directory: android
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE }}
          FEDTAIL_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          FEDTAIL_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          FEDTAIL_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -o pipefail
          export FEDTAIL_KEYSTORE="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_B64" | base64 -d > "$FEDTAIL_KEYSTORE"
          ./gradlew --no-daemon assembleRelease 2>&1 | tee ../gradle.log
          rm -f "$FEDTAIL_KEYSTORE"
          ls app/build/outputs/apk/release/
      - name: Why it failed
        if: failure() && steps.want.outputs.build == 'true'
        run: python3 .github/android_why.py gradle.log
      - if: steps.want.outputs.build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fedtail-android
          path: android/app/build/outputs/apk/release/*.apk

  # a release version in fedtail/__init__.py (no ".dev") that has no tag yet:
  # once everything is green, tag the commit vX.Y.Z and publish a GitHub release
  # with that version's CHANGELOG section as the notes
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, security, test, budgets, web-check, debian, windows-build, linux-build, deb,
            deb-install, apk, pypi, arch, rpm, appimage, flatpak, nix, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Tag and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('fedtail/__init__.py').read()).group(1))")
          case "$VER" in *dev*) echo "development version $VER: nothing to release"; exit 0;; esac
          if git rev-parse "v$VER" >/dev/null 2>&1; then echo "v$VER already tagged"; exit 0; fi
          python3 - "$VER" > notes.md <<'PY'
          import re, sys
          ver = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## {re.escape(ver)}\b.*?$\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else f"fedtail {ver}")
          PY
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -a "v$VER" -m "fedtail $VER"
          git push origin "v$VER"
          cp built/fedtail-windows/fedtail.exe "fedtail-$VER-windows.exe"
          cp built/fedtail-windows/fedtail-setup.exe "fedtail-$VER-windows-setup.exe"
          cp built/fedtail-linux/fedtail "fedtail-$VER-linux-x86_64"
          cp built/fedtail-deb/fedtail*_all.deb .
          cp built/fedtail-appimage/fedtail-*-x86_64.AppImage* .
          cp built/fedtail-x86_64.flatpak/fedtail.flatpak "fedtail-$VER-x86_64.flatpak"
          cp built/fedtail-arch/fedtail-*.pkg.tar.zst built/fedtail-rpm/fedtail-*.noarch.rpm .
          cp built/fedtail-pypi/fedtail-*.whl .
          # the distributions' source: this commit's archive, the AUR's PKGBUILD and the
          # spec naming it (packaging/source.py, arch.py, rpm.py)
          python3 packaging/source.py .
          python3 packaging/arch.py . --archive "fedtail-$VER.tar.gz"
          python3 packaging/rpm.py .
          files=("fedtail-$VER-windows.exe" "fedtail-$VER-windows-setup.exe"
                 "fedtail-$VER-linux-x86_64" fedtail*_all.deb
                 fedtail-*-x86_64.AppImage fedtail-*-x86_64.AppImage.zsync
                 "fedtail-$VER-x86_64.flatpak" fedtail-*.pkg.tar.zst fedtail-*.noarch.rpm
                 fedtail-*.whl "fedtail-$VER.tar.gz" PKGBUILD fedtail.spec)
          # the phone's, when the release key was there to sign it (the apk job)
          apk=$(ls built/fedtail-android/*.apk 2>/dev/null | head -1)
          if [ -n "$apk" ]; then cp "$apk" "fedtail-$VER-android.apk"; files+=("fedtail-$VER-android.apk"); fi
          # what was built, to check a download against (sha256sum -c SHA256SUMS)
          sha256sum "${files[@]}" > SHA256SUMS
          files+=(SHA256SUMS)
          gh release create "v$VER" --title "fedtail $VER" --notes-file notes.md --verify-tag \
            "${files[@]}"
          echo "released=true" >> "$GITHUB_OUTPUT"
          echo "version=$VER" >> "$GITHUB_OUTPUT"

  # the release on PyPI (`pip install fedtail`): trusted publishing — PyPI knows this
  # workflow (pypi.org → the project → Publishing: owner, repo, ci.yml, environment
  # `pypi`); until the repository's variable PYPI_PUBLISH is "true" — a warning, nothing
  # sent
  pypi-publish:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - name: Not set up — not published
        if: vars.PYPI_PUBLISH != 'true'
        run: 'echo "::warning::PYPI_PUBLISH is not true — the release was not sent to PyPI"'
      - uses: actions/download-artifact@v4
        if: vars.PYPI_PUBLISH == 'true'
        with:
          name: fedtail-pypi
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        if: vars.PYPI_PUBLISH == 'true'

  # the web interface's image on ghcr.io/eugene-vereshchagin/fedtail: the release's
  # version and `latest` (the repository's own token: no secret)
  docker-publish:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VER: ${{ needs.release.outputs.version }}
      IMAGE: ghcr.io/${{ github.repository_owner }}/fedtail
    steps:
      - uses: actions/checkout@v5
        with:
          ref: v${{ needs.release.outputs.version }}
      - run: echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - run: |
          docker build -f packaging/docker/Dockerfile -t "$IMAGE:$VER" -t "$IMAGE:latest" .
          docker push "$IMAGE:$VER"
          docker push "$IMAGE:latest"

  # the website (a repo of its own) takes the docs and the download links from the latest
  # release tag: rebuilt now and checked that it really went live (site.yml; a site that
  # stays on the old version turns this job red). After `apt`, so the site's Debian tab
  # finds the repository; `apt` skipped or failed doesn't hold the site back.
  site:
    needs: [release, apt]
    if: ${{ !cancelled() && needs.release.outputs.released == 'true' }}
    uses: ./.github/workflows/site.yml
    with:
      version: ${{ needs.release.outputs.version }}
    secrets: inherit

  # the apt repository: the release's .deb added to the `apt` branch (GitHub Pages serves
  # it), the indexes made anew and signed with the repository's key (secret
  # APT_GPG_KEY: an armored private key without a passphrase, made for this alone).
  # Without the key nothing is published — said once in the run.
  apt:
    needs: [release]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      KEY: ${{ secrets.APT_GPG_KEY }}
      VER: ${{ needs.release.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: No key — no repository
        if: env.KEY == ''
        run: 'echo "::warning::no APT_GPG_KEY secret — the apt repository was not updated"'
      - uses: actions/checkout@v5
        if: env.KEY != ''
        with:
          fetch-depth: 0
      - name: The packages and the signed indexes
        if: env.KEY != ''
        run: |
          # apt-ftparchive: not on every runner image (0.20.0's apt job failed without it)
          command -v apt-ftparchive >/dev/null || sudo apt-get install -y --no-install-recommends apt-utils
          python3 packaging/apt_repo.py "$VER"
