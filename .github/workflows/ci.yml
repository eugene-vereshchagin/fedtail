name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install requests PySide6-Essentials
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        run: python .github/annotate.py test-output.txt

  # the port: Windows with Qt from pip
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests PySide6-Essentials
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        shell: bash
        run: python .github/annotate.py test-output.txt

  # a folder with fedtail.exe and everything it needs, zipped: no Python to install
  windows-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests PySide6-Essentials pyinstaller
      - name: Icon
        run: python packaging/windows/make_icon.py fedtail/data/icons/fedtail.svg fedtail.ico
      - name: Build
        shell: bash
        run: |
          VER=$(python -c "import fedtail.version as v; print(v.full())")
          echo "building fedtail $VER"
          python -m PyInstaller --noconfirm --windowed --name fedtail --icon fedtail.ico \
            --add-data "fedtail/data:fedtail/data" --collect-submodules fedtail \
            packaging/windows/fedtail_main.py
          ./dist/fedtail/fedtail.exe --version
          cd dist && 7z a -tzip ../fedtail-windows.zip fedtail > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-windows
          path: fedtail-windows.zip

  # the real target: Debian 13 with Qt from apt, no pip at all
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-requests python3-pyside6.qtwidgets python3-pyside6.qtdbus
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        run: python3 .github/annotate.py test-output.txt

  # real screenshots of the window with made-up data, published to the
  # `screenshots` branch so the look can be reviewed without running the app
  screenshots:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - name: Qt, fonts, icons
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-requests \
            python3-pyside6.qtwidgets git ca-certificates
          for p in qt6-svg-plugins libqt6svg6 fonts-noto-core fonts-noto-color-emoji \
                   fonts-dejavu-core breeze-icon-theme; do
            apt-get install -y --no-install-recommends "$p" || echo "::warning::no package $p"
          done
      - run: python3 tools/screenshots.py out
      - name: Publish to the screenshots branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          cat > README.md <<EOF
          Screenshots of ${GITHUB_SHA} (made-up data, offscreen Qt, Fusion style).
          EOF
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

  # a release version in fedtail/__init__.py (no ".dev") that has no tag yet:
  # once everything is green, tag the commit vX.Y.Z and publish a GitHub release
  # with that version's CHANGELOG section as the notes
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, debian, windows-build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: fedtail-windows
      - name: Tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('fedtail/__init__.py').read()).group(1))")
          case "$VER" in *dev*) echo "development version $VER: nothing to release"; exit 0;; esac
          if git rev-parse "v$VER" >/dev/null 2>&1; then echo "v$VER already tagged"; exit 0; fi
          python3 - "$VER" > notes.md <<'PY'
          import re, sys
          ver = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## {re.escape(ver)}\b.*?$\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else f"fedtail {ver}")
          PY
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -a "v$VER" -m "fedtail $VER"
          git push origin "v$VER"
          cp fedtail-windows.zip "fedtail-$VER-windows.zip"
          gh release create "v$VER" --title "fedtail $VER" --notes-file notes.md --verify-tag \
            "fedtail-$VER-windows.zip"
