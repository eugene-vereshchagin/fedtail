name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --output-format=github .

  # known vulnerabilities in what fedtail runs on (requests, urllib3, PySide6, textual):
  # reported as warnings, never holding a release — a new CVE upstream is news, not a
  # broken build
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install pip-audit && pip install ".[qt]" textual
      - run: pip-audit --skip-editable --progress-spinner off

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install requests PySide6-Essentials textual
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          timeout -s ABRT 900 python -X faulthandler -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        run: python .github/annotate.py test-output.txt
      - name: Installs as a package (pip), the command works
        run: |
          cd /tmp && pip install "$GITHUB_WORKSPACE[qt]" && fedtail --version
          python -c "import fedtail, importlib.resources as r; assert r.files('fedtail').joinpath('data/config.example.ru.toml').is_file(); assert r.files('fedtail').joinpath('data/config.example.en.toml').is_file(); assert r.files('fedtail').joinpath('data/help/ru/index.md').is_file(); assert r.files('fedtail').joinpath('data/themes/system.toml').is_file()"

  # the port: Windows with Qt from pip
  windows:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests PySide6-Essentials textual
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -X faulthandler -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        shell: bash
        run: python .github/annotate.py test-output.txt

  # one file with everything inside, no Python to install: fedtail.exe for Windows…
  windows-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [windows]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install requests PySide6-Essentials pyinstaller
      - run: python packaging/build.py
      - name: Starts
        shell: bash
        run: ./dist/fedtail.exe --version
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-windows
          path: dist/fedtail.exe

  # …and fedtail for Linux, built on Debian 12 so it runs on older systems too
  linux-build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [test, debian]
    runs-on: ubuntu-latest
    container: debian:bookworm
    steps:
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-venv python3-pip libpython3.11 binutils git ca-certificates libglib2.0-0 libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Build
        shell: bash
        run: |
          set -o pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          python3 -m venv /tmp/venv
          {
            /tmp/venv/bin/pip install requests PySide6-Essentials pyinstaller &&
            /tmp/venv/bin/python packaging/build.py &&
            ./dist/fedtail --version
          } 2>&1 | tee build.log
          # fonts and keyboard come from the system it runs on, never from this one
          /tmp/venv/bin/pyi-archive_viewer -l dist/fedtail > contents.txt || true
          if grep -iE 'libfontconfig|libfreetype' contents.txt; then
            echo "::error::fontconfig/freetype got into the one-file build"; exit 1
          fi
          if ! grep -q 'libqwayland' contents.txt; then
            echo "::warning::no Wayland platform plugin in the one-file build"
          fi
          echo "Qt plugin files: $(grep -c 'plugins' contents.txt || true)"
      - name: What went wrong
        if: failure()
        run: grep -iE 'error|traceback|no matching|not found|denied|requires' build.log | tail -n 9 | sed 's/^/::warning::/'
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-linux
          path: dist/fedtail

  # the real target: Debian 13 with Qt from apt, no pip at all
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-requests python3-pyside6.qtwidgets python3-pyside6.qtdbus
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          timeout -s ABRT 900 python3 -X faulthandler -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        run: python3 .github/annotate.py test-output.txt

  # the .deb for Debian 13: built, installed with apt (so its dependencies resolve),
  # started; attached to a release next to the one-file builds
  deb:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends python3 dpkg-dev
      - run: python3 packaging/deb.py
      - name: Installs with apt, starts
        run: |
          apt-get install -y ./dist/fedtail_*_all.deb
          cd /tmp
          fedtail --version
          python3 -c "import fedtail.frontends.qt, fedtail.frontends.web.server"
          test -f /usr/share/applications/fedtail.desktop
          test -f /usr/share/icons/hicolor/512x512/apps/fedtail.png
          apt-get install -y python3-textual && python3 -c "import fedtail.frontends.tui.app" || echo "::warning::no python3-textual in this Debian"
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-deb
          path: dist/fedtail_*_all.deb

  # real screenshots of the window with made-up data, published to the
  # `screenshots` branch so the look can be reviewed without running the app
  screenshots:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - name: Qt, fonts, icons
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 python3-requests \
            python3-pyside6.qtwidgets git ca-certificates
          for p in qt6-svg-plugins libqt6svg6 fonts-noto-core fonts-noto-color-emoji \
                   fonts-dejavu-core breeze-icon-theme; do
            apt-get install -y --no-install-recommends "$p" || echo "::warning::no package $p"
          done
      - run: python3 tools/screenshots.py out
      - name: Publish to the screenshots branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          cat > README.md <<EOF
          Screenshots of ${GITHUB_SHA} (made-up data, offscreen Qt, Fusion style).
          EOF
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots

  # a release version in fedtail/__init__.py (no ".dev") that has no tag yet:
  # once everything is green, tag the commit vX.Y.Z and publish a GitHub release
  # with that version's CHANGELOG section as the notes
  release:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [lint, test, debian, windows-build, linux-build, deb]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: built
      - name: Tag and release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(python3 -c "import re;print(re.search(r'__version__ = \"([^\"]+)\"', open('fedtail/__init__.py').read()).group(1))")
          case "$VER" in *dev*) echo "development version $VER: nothing to release"; exit 0;; esac
          if git rev-parse "v$VER" >/dev/null 2>&1; then echo "v$VER already tagged"; exit 0; fi
          python3 - "$VER" > notes.md <<'PY'
          import re, sys
          ver = sys.argv[1]
          text = open("CHANGELOG.md").read()
          m = re.search(rf"^## {re.escape(ver)}\b.*?$\n(.*?)(?=^## |\Z)", text, re.M | re.S)
          print(m.group(1).strip() if m else f"fedtail {ver}")
          PY
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -a "v$VER" -m "fedtail $VER"
          git push origin "v$VER"
          cp built/fedtail-windows/fedtail.exe "fedtail-$VER-windows.exe"
          cp built/fedtail-linux/fedtail "fedtail-$VER-linux-x86_64"
          cp built/fedtail-deb/fedtail_*_all.deb .
          gh release create "v$VER" --title "fedtail $VER" --notes-file notes.md --verify-tag \
            "fedtail-$VER-windows.exe" "fedtail-$VER-linux-x86_64" fedtail_*_all.deb
          echo "released=true" >> "$GITHUB_OUTPUT"
      # the site (a repo of its own) takes the docs and the download links from the
      # latest release tag: rebuild it now. The secret is the Cloudflare Workers Builds
      # deploy hook URL; without it nothing happens (the site rebuilds nightly anyway).
      - name: Rebuild the site
        if: steps.release.outputs.released == 'true'
        env:
          HOOK: ${{ secrets.SITE_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then echo "no SITE_DEPLOY_HOOK secret: site not rebuilt"; exit 0; fi
          curl -fsS -X POST "$HOOK" || echo "::warning::the site's deploy hook failed"
