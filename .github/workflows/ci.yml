name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - run: pip install ruff
      - run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install requests PySide6-Essentials
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        run: python .github/annotate.py test-output.txt

  # the real target: Debian 13 with Qt from apt, no pip at all
  debian:
    runs-on: ubuntu-latest
    container: debian:trixie
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - run: apt-get update && apt-get install -y --no-install-recommends python3 python3-requests python3-pyside6.qtwidgets
      - name: Tests
        shell: bash
        run: |
          set -o pipefail
          python3 -m unittest discover -s tests -t . -v 2>&1 | tee test-output.txt
      - name: Failures as annotations
        if: failure()
        run: python3 .github/annotate.py test-output.txt

  # real screenshots of the window with made-up data, published to the
  # `screenshots` branch so the look can be reviewed without running the app
  screenshots:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    container: debian:trixie
    permissions:
      contents: write
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - run: >
          apt-get update && apt-get install -y --no-install-recommends
          python3 python3-requests python3-pyside6.qtwidgets git ca-certificates
          fonts-noto-core fonts-noto-color-emoji fonts-ibm-plex breeze-icon-theme
      - run: python3 tools/screenshots.py out
      - name: Publish to the screenshots branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd out
          cat > README.md <<EOF
          Screenshots of ${GITHUB_SHA} (made-up data, offscreen Qt, Fusion style).
          EOF
          git init -q
          git checkout -q -b screenshots
          git add .
          git -c user.name=ci -c user.email=ci@localhost commit -qm "screenshots for ${GITHUB_SHA}"
          git push -qf "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" screenshots
