name: Android

# The phone's APK, on the android branch only (ci.yml leaves that branch alone): one
# build per push — push changes in batches. Also by hand (Actions → Android → Run).
on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - "fedtail/**"
      - "tests/test_android_bridge.py"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# a newer push makes the older build pointless
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      # the Python Chaquopy builds with must be the version it puts in the app
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: The Python door, on the desk first
        run: pip install requests cryptography && python -m unittest tests.test_android_bridge -v
      - name: Build the dev APK
        working-directory: android
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: ./gradlew --no-daemon --stacktrace assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-android-dev-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
