name: Android

# The phone's APK, on the android branch only (ci.yml leaves that branch alone): one
# build per push — push changes in batches. Also by hand (Actions → Android → Run).
on:
  push:
    branches: [android]
    paths:
      - "android/**"
      - "fedtail/**"
      - "tests/fakes.py"
      - "tests/test_android_bridge.py"
      - "tools/showcase.py"
      - ".github/android_*"
      - ".github/workflows/android.yml"
  workflow_dispatch:

# a newer push makes the older build pointless
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # the screenshots go to the android-shots branch
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      # the Python Chaquopy builds with must be the version it puts in the app
      - uses: actions/setup-python@v6
        id: py
        with:
          python-version: "3.12"
      - uses: gradle/actions/setup-gradle@v4
      - name: The Python door, on the desk first
        run: pip install requests cryptography && python -m unittest tests.test_android_bridge -v
      - name: Build the dev APK
        working-directory: android
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        run: |
          set -o pipefail
          ./gradlew --no-daemon assembleDebug assembleDebugAndroidTest 2>&1 | tee ../gradle.log
      # the reason as annotations: readable through the API where the log isn't
      - name: Why it failed
        if: failure()
        run: python3 .github/android_why.py gradle.log
      - uses: actions/upload-artifact@v4
        with:
          name: fedtail-android-dev-${{ github.run_number }}
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- the app on an emulator: two screenshots and what it said ----------------------
      - name: KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # one emulator for both: the screenshots, then the UI tests (androidTest: Compose
      # tests on the demo world — they tap and check, where the screenshots only look)
      - name: Screenshots and UI tests on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          CHAQUOPY_BUILD_PYTHON: ${{ steps.py.outputs.python-path }}
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: |
            bash .github/android_shots.sh
            bash .github/android_uitests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fedtail-android-shots-${{ github.run_number }}
          path: shots/
          if-no-files-found: ignore
      # where git can read them too (one commit, rewritten every run: the repo doesn't grow)
      - name: Screenshots to the android-shots branch
        if: always() && hashFiles('shots/*') != ''
        run: |
          cd shots
          git init -q -b android-shots
          git add -A
          git -c user.name="fedtail CI" -c user.email="ci@users.noreply.github.com" \
            commit -q -m "Android screenshots, run ${{ github.run_number }} (${{ github.sha }})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" \
            android-shots
