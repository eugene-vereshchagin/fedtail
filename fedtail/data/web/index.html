<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>fedtail</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div id="app">
  <nav id="nav">
    <div id="who"></div>
    <button id="write" type="button" class="primary wide"></button>
    <div id="lanes"></div>
  </nav>
  <div id="scrim" hidden></div>
  <main id="main">
    <header id="bar">
      <button id="menu" type="button" class="icon" aria-label="lanes">☰</button>
      <h1 id="title">fedtail</h1>
      <span id="count"></span>
      <button id="refresh" type="button" class="tool" aria-label="refresh">⟳</button>
      <button id="allread" type="button" class="tool"></button>
      <button id="write2" type="button" class="icon" aria-label="write">✎</button>
      <button id="more" type="button" class="tool big" aria-haspopup="menu">≡</button>
    </header>
    <div id="lanebar" hidden></div>
    <div id="posts" tabindex="0"></div>
    <form id="cmdline" autocomplete="off">
      <input id="cmd" type="text" spellcheck="false" enterkeyhint="send">
    </form>
  </main>
  <aside id="side" hidden>
    <header class="side-head">
      <button id="back" type="button" class="tool"></button>
      <h2 id="side-title"></h2>
    </header>
    <div id="side-body"></div>
  </aside>
</div>

<dialog id="compose">
  <form id="compose-form" method="dialog" autocomplete="off">
    <header class="dlg-head">
      <h2 id="compose-title"></h2>
      <button id="compose-close" type="button" class="tool" aria-label="close">✕</button>
    </header>
    <div id="reply-line" hidden></div>
    <button id="quote-sel" type="button" class="tool" hidden></button>
    <input id="cw" type="text" hidden>
    <textarea id="text" rows="6"></textarea>
    <div id="attached" hidden></div>
    <div id="pollbox" hidden></div>
    <div id="schedbox" hidden><label><span id="sched-label"></span>
      <input id="sched-at" type="datetime-local"></label></div>
    <div class="dlg-foot">
      <button id="cw-toggle" type="button" class="tool"></button>
      <button id="attach" type="button" class="tool">📎</button>
      <input id="files" type="file" multiple hidden>
      <button id="poll-toggle" type="button" class="tool">📊</button>
      <button id="sensitive" type="button" class="tool" hidden>⚠🖼</button>
      <button id="sched-toggle" type="button" class="tool">🕒</button>
      <select id="vis"></select>
      <select id="lang"></select>
      <span id="chars"></span>
      <button id="send" type="submit" class="primary"></button>
    </div>
  </form>
</dialog>

<div id="viewer" hidden>
  <button id="viewer-prev" type="button" class="nav-btn" hidden>‹</button>
  <button id="viewer-next" type="button" class="nav-btn" hidden>›</button>
  <img id="viewer-img" alt="">
  <div id="viewer-bar"><span id="viewer-alt"></span> <a id="viewer-open" target="_blank" rel="noopener noreferrer"></a></div>
</div>
<div id="toast" role="status" hidden></div>
<div id="pop" class="pop" role="menu" hidden></div>
<dialog id="info"><form method="dialog"><pre id="info-text"></pre><div id="info-links"></div>
  <button id="info-close" class="primary"></button></form></dialog>
<script src="/app.js"></script>
</body>
</html>
