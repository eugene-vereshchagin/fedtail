# fedtail theme: system
#
# Follows the KDE colour scheme (light or dark): every colour set to "auto"
# is taken from the desktop palette. This file is also the reference: it lists
# every key a theme may set. A theme of your own can start with
#     inherit = "system"
# and change only what it needs.
#
# Colours: "auto" (system theme only), "#rrggbb", "#rrggbbaa" or "rgba(r,g,b,a)".
# sidebar_text, sidebar_muted and panel left at "auto" in any theme follow text,
# muted and window — set them only when the sidebar is darker than the posts (bnw).

name = "System (KDE)"
inherit = ""
# the window layouts the theme is made for: ["single", "split"] (both — what a theme
# that doesn't say gets), ["split"] (the messengers'); ui.themes_by_layout offers only
# those of the layout on (the configured and the current theme always)
layouts = ["single", "split"]

[font]
family = ""          # "" = the desktop font; otherwise e.g. "Noto Sans"
mono = ""            # for #ids and /N numbers; "" = the desktop's fixed font
post_scale = 1.1     # post text size relative to the interface font
files = []           # font files that come with the theme, next to its .toml (e.g.
                     # ["fonts/Inter.ttf"]): used without installing them

[colors]
window = "auto"          # around everything
sidebar = "auto"         # left panel
sidebar_border = "auto"
sidebar_text = "auto"    # lane names, your name in the left panel ("auto": = text)
sidebar_muted = "auto"   # section titles, @address in the left panel ("auto": = muted)
panel = "auto"           # the post panel, dialogs, the find bar ("auto": = window)
selected = "auto"        # the chosen lane
selected_text = "auto"
view = "auto"            # behind the posts
header_border = "auto"   # line under the lane header
card = "auto"
card_border = "auto"
card_border_unread = "auto"
text = "auto"
muted = "auto"           # names' @addresses, times, button labels
link = "auto"
accent = "auto"          # Write button, ordinary badges, segmented control
on_accent = "auto"
hot = "#c4501b"          # badge of replies to you
on_hot = "#ffffff"
quiet = "auto"           # badge of lanes that can wait (bots)
on_quiet = "auto"
new_pill = "auto"        # "12 new" next to the lane title
on_new_pill = "auto"
ctx = "auto"             # the "in reply to" quote
ctx_bar = "auto"
focus = "auto"           # the post you came to, in a thread
focus_border = "auto"
myreply = "auto"         # "you replied" strip
on_myreply = "auto"
active = "#fff4d6"       # a pressed star / boost
on_active = "#7a5300"
separator = "auto"       # "new below" line
rail = "auto"            # thread depth lines
button = "auto"
button_border = "auto"
field = "auto"           # a field to type in ("auto": = view)
field_border = "auto"    # its frame ("auto": view a good way towards text — plainly
                         # there: a frame as pale as a card's read as switched off)
dot = "auto"             # unread dot
primary = "auto"         # Send / Create and other main buttons ("auto": = accent)
on_primary = "auto"      # their text ("auto": = on_accent)
header = "auto"          # behind the lane's title strip ("auto": the view tinted with accent)
header_bar = "auto"      # the band above it (shape.header_bar); "auto": accent
name = "auto"            # people's names on posts ("auto": = text)
chat_me = "auto"         # card_header = "chat": my name ("auto": = link)
chat_them = "auto"       # … everyone else's ("auto": = hot)
view_end = "auto"        # behind the posts and the input line, the lower-left end of a
                         # gradient from colors.view (QIP Infium); "auto": = view, flat
window_end = "auto"      # the bottom of a gradient from colors.window down (the roster's
                         # and the windows' glossy frames in the Agent); "auto": flat
button_end = "auto"      # … from colors.button (glossy buttons)
header_end = "auto"      # … from colors.header (the bars over the posts and the input line)
tab_mark = "auto"        # the line over the tab in front (Windows XP: orange); "auto": accent

[shape]
radius = 12              # card corners
button_radius = 8
card_style = "card"      # "card" (framed boxes) or "rule" (posts divided by lines)
rule = "solid"           # the line between posts in "rule": "solid" or "dashed"
header_stripes = false   # a hatched band behind the lane's and the post window's title
                         # (point.im), in colors.header
header_bar = 3           # px of a band in colors.header_bar above that title (0: none; point.im: 8)
card_avatars = true
avatar = 40
avatar_shape = "circle"  # "circle", "square" (point.im) or "rounded"
sidebar_avatar = true
icon_size = 18           # px of the pictures by the lanes and on the sidebar's top buttons
icons = "desktop"        # the pictures on the buttons and by the lanes: "desktop" — the
                         # desktop's icon theme (Breeze…), as here; "own" — the theme's
                         # own set, a folder next to its file: themes/mine.toml →
                         # themes/mine/icons/reply.svg (or .png), a file a picture
                         # (their names: builtin/PICTURES.txt); "words" — none, words and
                         # glyphs (≡ ↔ ❯). ui.icons in config.toml may choose otherwise.
card_header = "rich"     # "rich": avatar, name, @address · time · icon
                         # "compact": @user host · 13.10 17:22 · priv
                         # "chat": Name (15:25:43 23/06/2007) bold in colors.chat_me /
                         #   chat_them, the text under it — as in ICQ clients
                         # "stacked": the name bold, @address · time under it (point.im)
short_id = "header"      # where #a3f goes: "header" (right of the name) or "footer" (under
                         # the post, left, with the number of replies: #a3f | 4)
actions_align = "left"   # the buttons under a post: "left" or "right" (point.im)
hover = false            # the post under the mouse lit: its buttons brighter and, on my
                         # own posts, ✎ and ✕ at the top right (point.im)
unread_mark = "dot"      # "dot" or "star" (an asterisk before the name)
debug = false            # loud marks for testing: unread, the j/k cursor, the post found,
                         # "glimpsed, not yet counted read", keyboard focus, hover (debug.toml)
faces = "qip"            # the split layout's faces: "qip" — over a lane the author of the
                         # post under the cursor, by the input line whom I write to;
                         # "agent" (the Mail.ru Agent) — a column on the right, theirs by
                         # the posts, mine by the input line; "none"
roster_rows = "lines"    # the roster's items: "lines" — the name, a line of the newest post,
                         # a small face on the right; "faces" — a big face on the left and
                         # three lines beside it (the Agent, Psi)
roster_face = 40         # px of that face ("faces")
tab_rows = "wrap"        # the messages window's tabs: "wrap" — into more rows when they
                         # don't fit (the Agent); "one" — one row, scrolled
posts_only = "segmented" # the choices over a lane (All | Posts | New, Feed | Conversations): "segmented" — buttons stuck together, "check" — round marks

[pictures]
# The theme's own set ([shape] icons = "own"): what its folder lacks comes from the
# themes it inherits, then from the theme named here, then from fedtail's fallback set.
from = ""                # a theme whose set this one borrows: "mra" (mra-blue does)
color = ""               # every picture's colour, "" — colors.accent (point: one grey-blue)
style = "silhouette"     # how an SVG's blank colours ({c} {l} {d}) are filled:
                         # "silhouette" (plain colour, no rim, the inner lines cut out —
                         # the default), "flat" (plain colour, a darker rim), "gloss" (a
                         # gradient and a shine), "agent" (brighter, a softer outline: mra),
                         # "qip" (a strong shine, a thick dark outline), "none" (filled,
                         # nothing else touched)
# In a development version a picture the theme's set lacks (and the desktop's icon theme
# has not) comes from the fallback set in bright red — what to draw is seen at once.
# FEDTAIL_MARK_MISSING=0 in the environment: in its usual colour.

[pictures.colors]
# a picture of its own colour whatever the theme (the rest take colors.accent)
nobody = "#8a96a6"
status = "#36b02c"
warning = "#f2a400"
emoji = "#f5c400"
send = "#3aa63a"
star_full = "#f2b705"

[sound]
# The sounds: what plays when news comes (sound.* in config.toml says when).
source = "desktop"       # "desktop" — the desktop's sound theme (KDE, GNOME; needs
                         # canberra-gtk-play, else fedtail's own quiet set); "own" — the
                         # theme's set: themes/mine/sounds/message.wav, reply.wav…; "bell" —
                         # the beep; "none" — silence
from = ""                # a theme whose sounds this one borrows: "qip-retro" (qip-modern does)

[words]
# {text} is the interface's own wording in the current language
compose = "✎  {text}"
lane = "{text}"
lane_selected = "{text}"
lane_title = "{text}"
lowercase = false
separator = "{text} · {n}"
account_title = "{display_name}"
account_subtitle = "@{acct}"
date = "{day} {mon} {time}"        # also: "{dd}.{mm} {time}"; {yyyy} {yy} {clock} {secs} too
chat = "{name} ({when})"           # card_header = "chat": the line over a post
chat_date = "{secs} {dd}/{mm}/{yyyy}"  # … its {when}
roster_group = "{arrow} {title} ({lit}/{n})"  # a roster group's title: {lit} of its {n}
                                   # items have something new
roster_group_quiet = "{arrow} {title} ({n})"  # … when none has

[icon]
# The window, tray and notification icon in this theme's colours.
# "auto" takes it from colors.accent / colors.hot, so your own theme gets a matching icon.
style = "bubble"         # "bubble" (a talk bubble with a thread inside) or "terminal" (>_)
bg_top = "#3b8fd0"       # background gradient, top left …
bg_bottom = "#174a78"    # … to bottom right
bubble = "#ffffff"
ink = "#1d4f7a"          # the thread lines (the prompt, in "terminal")
accent = "#e8702a"       # the "new" dot (the cursor, in "terminal")
