# fedtail theme: point — point.im as it looks today: a white page, posts divided
# by thin lines, a square avatar, the name bold in dark blue with @address · date under
# it, the post's #id under the text on the left (with the number of replies: #a3f | 4)
# and quiet word buttons on the right, a grey strip with the lane's title, a dark
# "Create" button, a hatched band behind the titles (the lane's, the new post's). Open
# Sans.
name = "Point"
inherit = "system"

[font]
family = "Open Sans, Noto Sans, DejaVu Sans, sans-serif"
mono = "DejaVu Sans Mono, monospace"
post_scale = 1.0

[colors]
window = "#ffffff"
sidebar = "#ffffff"
sidebar_border = "#e6e8eb"
selected = "#e4e8ee"
selected_text = "#2c3e5c"
view = "#ffffff"
header_border = "#e6e8eb"
card = "#ffffff"
card_border = "#c9ced5"
card_border_unread = "#c9ced5"
text = "#222222"
muted = "#a3aab4"
link = "#3c5a8a"
accent = "#3c5a8a"
on_accent = "#ffffff"
hot = "#c4501b"
on_hot = "#ffffff"
quiet = "#eef0f3"
on_quiet = "#6d7684"
new_pill = "#eef1f6"
on_new_pill = "#3c5a8a"
ctx = "#f6f7f9"
ctx_bar = "#d5dae1"
focus = "#f3f6fa"
focus_border = "#c7d2e2"
myreply = "#f6f7f9"
on_myreply = "#6d7684"
active = "#eef1f6"
on_active = "#2c3e5c"
separator = "#3c5a8a"
rail = "#e1e4e8"
button = "#ffffff"
button_border = "#e1e4e8"
dot = "#3c5a8a"
name = "#2c4a6e"
primary = "#3c3c3c"
on_primary = "#ffffff"
header = "#efefef"

[shape]
radius = 0
button_radius = 3
card_style = "rule"
rule = "solid"
header_stripes = true
card_avatars = true
avatar = 40
avatar_shape = "square"
sidebar_avatar = true
lane_icons = true
icons = false
card_header = "stacked"
short_id = "footer"
actions_align = "right"
unread_mark = "dot"
posts_only = "segmented"

[words]
compose = "{text}"
date = "{day} {mon} {time}"

[icon]
bg_top = "#5a5a5a"
bg_bottom = "#2f2f2f"
bubble = "#ffffff"
ink = "#3c5a8a"
accent = "#c4501b"
