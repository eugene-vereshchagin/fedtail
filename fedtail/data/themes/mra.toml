# fedtail theme: mra — in the spirit of the Mail.ru Agent (2008–2011), the orange skin:
# glossy orange frames and buttons with a white highlight, white panes with square
# corners, "Name (14.02.26 18:23) :" bold over every message — mine in blue, everyone
# else's in red; the faces in a column on the right, the roster's items three lines
# beside a big face. Best with ui.layout = "split". Own icons and colours only: a theme
# in the spirit, not a copy of anyone's skin.
name = "Agent (orange)"
inherit = "system"
# made for the split layout (a roster and a messages window); ui.themes_by_layout
layouts = ["split"]

[font]
family = "Tahoma, Arial, Arimo, DejaVu Sans, sans-serif"
mono = "DejaVu Sans Mono, monospace"
post_scale = 1.05
# Arimo (Arial's metrics) comes with fedtail (SIL OFL 1.1): where Tahoma and Arial are missing
files = ["fonts/Arimo-Variable.ttf", "fonts/Arimo-Italic-Variable.ttf"]

[colors]
window = "#fde9c9"
sidebar = "#fff4e2"
sidebar_border = "#e3a55a"
panel = "#fff4e2"
selected = "#fbd9a6"
selected_text = "#1a1a1a"
view = "#ffffff"
header_border = "#e3a55a"
card = "#ffffff"
card_border = "#e3a55a"
card_border_unread = "#ee8a17"
text = "#111111"
muted = "#6b6b6b"
link = "#1b3fae"
accent = "#ee8a17"
on_accent = "#ffffff"
hot = "#e0201b"
on_hot = "#ffffff"
quiet = "#fff4e2"
on_quiet = "#555555"
new_pill = "#ffffff"
on_new_pill = "#b25e05"
ctx = "#fff4e2"
ctx_bar = "#e3a55a"
focus = "#fff4e2"
focus_border = "#ee8a17"
myreply = "#fff4e2"
on_myreply = "#333333"
separator = "#ee8a17"
rail = "#e3a55a"
button = "#fff8ec"
button_border = "#e3a55a"
dot = "#2e9a2e"
header = "#fff2dc"
header_bar = "#ee8a17"
chat_me = "#1d34c8"
chat_them = "#e0201b"
tab_mark = "#ee8a17"
view_end = "#fdf0dc"
header_end = "#f8ca86"
button_end = "#f9d29a"
window_end = "#f6c27c"

[shape]
icons = "own"
radius = 0
button_radius = 4
card_style = "rule"
rule = "solid"
header_bar = 0
card_avatars = false
card_header = "chat"
faces = "agent"
roster_rows = "faces"
roster_face = 44
tab_rows = "wrap"

[pictures]
style = "agent"

[pictures.colors]
status = "#3aa63a"

[words]
date = "{dd}.{mm} {clock}"
chat = "{name} ({when}) :"
chat_date = "{dd}.{mm}.{yy} {clock}"
roster_group = "{arrow} {title} ({lit}/{n})"

[icon]
bg_top = "#ffc35c"
bg_bottom = "#ee8a17"
bubble = "#ffffff"
ink = "#b25e05"
accent = "#3fae3a"

[sound]
source = "own"          # its own set: mra/sounds/ (made by tools/make_sounds.py)
