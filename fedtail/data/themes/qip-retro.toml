# fedtail theme: qip-retro — in the spirit of early QIP and ICQ under Windows XP: beige
# windows, white panes in thin grey-blue frames, square corners, XP tabs with an orange
# line over the one in front, "Name (15:25:43 23/06/2007)" bold over every message — mine
# in blue, everyone else's in red. Best with ui.layout = "split". Own icons and colours
# only: a theme in the spirit, not a copy of anyone's skin.
name = "QIP retro"
inherit = "system"

[font]
family = "Tahoma, PT Sans, DejaVu Sans, sans-serif"
mono = "PT Mono, DejaVu Sans Mono, monospace"
post_scale = 1.0
# PT Sans and PT Mono (ParaType) come with fedtail (SIL OFL 1.1): where Tahoma is missing
files = ["fonts/PT_Sans-Web-Regular.ttf", "fonts/PT_Sans-Web-Bold.ttf",
         "fonts/PT_Mono-Regular.ttf"]

[colors]
window = "#ece9d8"
sidebar = "#ffffff"
sidebar_border = "#7f9db9"
panel = "#ece9d8"
selected = "#316ac5"
selected_text = "#ffffff"
view = "#ffffff"
header_border = "#7f9db9"
card = "#ffffff"
card_border = "#c7c4b4"
card_border_unread = "#316ac5"
text = "#000000"
muted = "#6f6b5b"
link = "#0b3fbf"
accent = "#316ac5"
on_accent = "#ffffff"
hot = "#d0221b"
on_hot = "#ffffff"
quiet = "#e3e0cf"
on_quiet = "#55513f"
new_pill = "#ffffff"
on_new_pill = "#0b3fbf"
ctx = "#f5f4ec"
ctx_bar = "#7f9db9"
focus = "#fffbe0"
focus_border = "#e5a32a"
myreply = "#f1efe4"
on_myreply = "#3b3a30"
separator = "#316ac5"
rail = "#c7c4b4"
button = "#f6f5f0"
button_border = "#003c74"
dot = "#3fb53a"
header = "#f3f1e6"
header_bar = "#316ac5"
chat_me = "#1d2fd0"
chat_them = "#d0221b"
tab_mark = "#f2a227"
sidebar_muted = "#2b4f8c"

[shape]
radius = 0
button_radius = 3
card_style = "rule"
rule = "solid"
header_bar = 0
card_avatars = false
avatar_shape = "square"
card_header = "chat"
faces = "qip"
roster_rows = "lines"
tab_rows = "wrap"

[words]
date = "{dd}/{mm} {clock}"
chat = "{name} ({when})"
chat_date = "{secs} {dd}/{mm}/{yyyy}"
roster_group = "{arrow} {title} - {lit}/{n}"

[icon]
bg_top = "#7fb2ec"
bg_bottom = "#2c62b3"
bubble = "#ffffff"
ink = "#2c62b3"
accent = "#3fb53a"
