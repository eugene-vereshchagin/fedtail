# fedtail theme: night — dark and quiet for late reading, on any desktop:
# its own colours, not the system's, and words instead of (dark) icons.
name = "Night"
inherit = "system"

[font]
family = "Source Sans 3, Noto Sans, sans-serif"
mono = "Source Code Pro, DejaVu Sans Mono, monospace"
# Source Sans 3 and Source Code Pro (Adobe) come with fedtail (SIL OFL 1.1): nothing to install
files = ["fonts/SourceSans3-Variable.ttf", "fonts/SourceSans3-Italic-Variable.ttf",
         "fonts/SourceCodePro-Variable.ttf"]

[colors]
window = "#14171c"
sidebar = "#101317"
sidebar_border = "#232a33"
selected = "#243142"
selected_text = "#e8eef5"
view = "#171b21"
header_border = "#232a33"
card = "#1d222a"
card_border = "#2a313b"
card_border_unread = "#4c8dde"
text = "#d8dee6"
muted = "#8792a2"
link = "#7fb4ff"
accent = "#4c8dde"
on_accent = "#ffffff"
hot = "#e0703a"
on_hot = "#ffffff"
quiet = "#232a33"
on_quiet = "#8792a2"
new_pill = "#243142"
on_new_pill = "#a9c8f0"
ctx = "#20262f"
ctx_bar = "#3a4656"
focus = "#1f2a38"
focus_border = "#4c8dde"
myreply = "#1c2a22"
on_myreply = "#9fd3a9"
active = "#3a3220"
on_active = "#ffcf6b"
separator = "#4c8dde"
rail = "#2f3845"
button = "#1d222a"
button_border = "#323a46"
dot = "#4c8dde"

[shape]
icons = "own"
radius = 10
button_radius = 7

[icon]
bg_top = "#2b3a50"
bg_bottom = "#0d1014"
bubble = "#d8dee6"
ink = "#243142"
accent = "#4c8dde"
