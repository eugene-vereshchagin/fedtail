# fedtail theme: psi — in the spirit of Psi+ on KDE: the desktop's own look, flat and
# light, the chosen contact in Breeze blue across the whole row, wide tabs, the roster's
# items with a face, "[14:26:03] <nick>" over each message, the nick coloured. Best with
# ui.layout = "split". Own icons and colours only.
name = "Psi"
inherit = "system"

[font]
family = ""
mono = ""
post_scale = 1.0

[colors]
window = "#eff0f1"
sidebar = "#fcfcfc"
sidebar_border = "#bdc3c7"
panel = "#eff0f1"
selected = "#cde8f7"
selected_text = "#232627"
view = "#fcfcfc"
header_border = "#bdc3c7"
card = "#fcfcfc"
card_border = "#dcdfe1"
card_border_unread = "#3daee9"
text = "#232627"
muted = "#7f8c8d"
link = "#2980b9"
accent = "#3daee9"
on_accent = "#ffffff"
hot = "#b0207a"
on_hot = "#ffffff"
quiet = "#e3e5e7"
on_quiet = "#555a5c"
new_pill = "#ffffff"
on_new_pill = "#2980b9"
ctx = "#f2f4f5"
ctx_bar = "#bdc3c7"
focus = "#e8f4fb"
focus_border = "#3daee9"
myreply = "#eef6ec"
on_myreply = "#2f6b2a"
separator = "#3daee9"
rail = "#dcdfe1"
button = "#fcfcfc"
button_border = "#bdc3c7"
dot = "#27ae60"
header = "#f4f5f6"
header_bar = "#3daee9"
chat_me = "#2e6fc4"
chat_them = "#b0207a"
tab_mark = "#3daee9"

[shape]
radius = 3
button_radius = 3
card_style = "rule"
rule = "solid"
header_bar = 0
card_avatars = false
card_header = "chat"
faces = "qip"
roster_rows = "faces"
roster_face = 32
tab_rows = "one"
icon_set = "psi"

[words]
date = "{dd}.{mm} {clock}"
chat = "[{when}] <{name}>"
chat_date = "{secs}"
roster_group = "{arrow} {title} ({lit}/{n})"

[icon]
bg_top = "#86b1ec"
bg_bottom = "#2a6fc9"
bubble = "#ffffff"
ink = "#2a6fc9"
accent = "#f2c037"
