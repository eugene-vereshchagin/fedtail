# fedtail theme: juick — juick.com around 2013: a light warm-grey page, white
# posts without frames, blue links, "@nick:" up front, Arial.
name = "Juick"
inherit = "system"

[font]
family = "Arial, Liberation Sans, Arimo, DejaVu Sans, sans-serif"
mono = "DejaVu Sans Mono, monospace"
post_scale = 1.05

[colors]
window = "#eeede6"
sidebar = "#eeede6"
sidebar_border = "#e0dfd6"
selected = "#ffffff"
selected_text = "#111111"
view = "#eeede6"
header_border = "#e0dfd6"
card = "#ffffff"
card_border = "#ffffff"
card_border_unread = "#9cc3e0"
text = "#111111"
muted = "#999999"
link = "#1b6aa5"
accent = "#1b6aa5"
on_accent = "#ffffff"
hot = "#d1492b"
on_hot = "#ffffff"
quiet = "#dedcd2"
on_quiet = "#555555"
new_pill = "#dcebf6"
on_new_pill = "#1b6aa5"
ctx = "#f5f4ef"
ctx_bar = "#d6d4c8"
focus = "#f2f8fc"
focus_border = "#9cc3e0"
myreply = "#f5f4ef"
on_myreply = "#777777"
active = "#fff3c4"
on_active = "#6b5400"
separator = "#1b6aa5"
rail = "#dedcd2"
button = "#ffffff"
button_border = "#dedcd2"
dot = "#1b6aa5"

[shape]
radius = 0
button_radius = 2
card_style = "card"
card_avatars = true
avatar = 40
sidebar_avatar = true
lane_icons = false
icons = false
card_header = "compact"
unread_mark = "star"
posts_only = "check"

[words]
compose = "{text}"
account_title = "@{username}"
account_subtitle = "{acct}"
separator = "{text} ({n})"
date = "{dd}.{mm} {time}"
