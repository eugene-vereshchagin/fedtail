# fedtail theme: juick — in the spirit of the old juick.com: a white page, plain
# lines between posts, "@nick" up front, small Verdana, nothing shiny.
name = "Juick"
inherit = "system"

[font]
family = "Verdana, DejaVu Sans, Tahoma, sans-serif"
mono = "DejaVu Sans Mono, monospace"
post_scale = 1.0

[colors]
window = "#e9e9e6"
sidebar = "#f2f2ef"
sidebar_border = "#d6d6d0"
selected = "#ffffff"
selected_text = "#000000"
view = "#ffffff"
header_border = "#e2e2dc"
card = "#ffffff"
card_border = "#e4e4de"
card_border_unread = "#e4e4de"
text = "#222222"
muted = "#8a8a84"
link = "#2a6496"
accent = "#3d7ab3"
on_accent = "#ffffff"
hot = "#d9531e"
on_hot = "#ffffff"
quiet = "#e4e4de"
on_quiet = "#5c5c58"
new_pill = "#fff3c4"
on_new_pill = "#6b5400"
ctx = "#f6f6f2"
ctx_bar = "#cfcfc7"
focus = "#fffbe6"
focus_border = "#e8d27a"
myreply = "#f1f7ec"
on_myreply = "#3d6b2a"
active = "#fff3c4"
on_active = "#6b5400"
separator = "#d9531e"
rail = "#dcdcd5"
button = "#ffffff"
button_border = "#d6d6d0"
dot = "#d9531e"

[shape]
radius = 0
button_radius = 3
card_style = "rule"
card_avatars = true
avatar = 32
sidebar_avatar = true
lane_icons = false
icons = false
card_header = "compact"
unread_mark = "star"
posts_only = "check"

[words]
compose = "{text}"
lane = "{text}"
lane_selected = "{text}"
lane_title = "{text}"
lowercase = false
separator = "*** {text} ({n}) ***"
account_title = "@{username}"
account_subtitle = "{acct}"
date = "{dd}.{mm} {time}"
