# ══════════════════════════════════════════════════════════════════════════════════════
# Lanes no set shows by default but any config may turn on (lanes.enabled) or take as a
# start for its own: the ones before To me, Follow requests as a lane, My likes.

# Followed threads read as a stream of comments — fedtail's set shows "Commented
# posts" instead (a card a thread with news); any set may turn this on
[[extra]]
name = "subs"
group = "personal"
source = "subs"
sort = "post_time"
any = [{}]
none = [{ me = "reply" }]

# "Commented posts", as on Point — fedtail's set has it; any other may turn it on
[[extra]]
name = "commented"
group = "personal"
source = ["subs", "mentions"]  # the comments, and the replies to me among them
view = "threads"
open_at = "first_unread"  # a click: the thread at its first new comment
icon = "commented"
any = [{ state = "subscribed" }]
none = [{ author = "me" }, { visibility = "direct", apart = "direct" }]

[[extra]]
name = "replies"
group = "personal"
source = "mentions"
sort = "post_time"
any = [{ me = "reply" }]
none = [{ visibility = "direct", apart = "direct" }]

[[extra]]
name = "mentions"
group = "personal"
source = "mentions"
sort = "post_time"
any = [{}]
none = [{ me = "reply" }, { author = "me" }, { visibility = "direct", apart = "direct" }]

[[extra]]
name = "my_likes"
group = "personal"
source = "favourites"
read = "browse"
any = [{}]
none = [{ state = "unliked" }]

[[extra]]
name = "requests"
group = "personal"
any = [{ event = "follow_request" }]

# "The network": Federated without my own server's people — what other servers bring
[[extra]]
name = "network"
group = "standard"
icon = "federated"
source = "federated"
read = "browse"
any = [{ author = "remote" }]

# Mentions from strangers (people who neither follow me nor I them): where spam comes
# from — a lane to look at it apart, or (in none of To me) to keep it away
[[extra]]
name = "stranger_mentions"
group = "personal"
icon = "mentions"
source = "mentions"
sort = "post_time"
any = [{ me = "mention", author = ["stranger", "not_follower"] }]
none = [{ author = ["followed", "follower", "me"] }]
