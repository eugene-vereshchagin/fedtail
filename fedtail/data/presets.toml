# The sets of lanes fedtail comes with (lanes.preset), all in one file. Every lane is a rule —
# the same keys as [[lanes.custom]] in config.toml (docs/en/dev/feeds.md); a lane of the
# config with the same name takes the set's one's place, and `fedtail --lanes-to-config`
# writes the chosen set into config.toml to be read and changed there.
# No title: the interface's word for the name (lane_<name>). Conditions of `event` take
# likes, follows, follow requests… (Activity and Requests are lanes of events only, and any
# lane may take them among its posts). slot = "lists" / "tags" — not a lane: where the
# server's lists and the saved lanes of tags stand. [[extra]] — lanes no set shows, any
# config may turn on.


# ══════════════════════════════════════════════════════════════════════════════════════
# fedtail's own set of lanes (lanes.preset = "fedtail"), in the spirit of Point: replies and
# mentions to me in one lane, followed threads, bots apart. Every lane is a rule — the same
# keys as [[lanes.custom]] (docs/en/dev/feeds.md); a lane of the config with the same name
# takes this one's place. No title: the interface's word for the name (lane_<name>).
# Activity: the events, as rules; slot = "lists" / "tags" — the server's lists and the
# saved lanes of tags stand here.

[[fedtail]]
name = "federated"
group = "standard"
source = "federated"
read = "browse"
any = [{}]

[[fedtail]]
name = "home"
start = true  # the lane opened first (ui.start_lane names none here)
group = "standard"
source = "home"
any = [
  {},
  { via = "tag", switch = "@chip_tags" },
  { kind = "boost", switch = "@chip_boosts" },
  { state = "new_replies", switch = "@chip_threads_new" },
]
none = [{ author = "hidden_home" }, { author = "bot" }]

[[fedtail]]
name = "local"
group = "standard"
source = "local"
read = "browse"
any = [{}]

[[fedtail]]
name = "bots"
group = "standard"
source = "home"
any = [{ author = "bot" }]

[[fedtail]]
name = "my_posts"
group = "personal"
source = "mine"
any = [{}]

[[fedtail]]
name = "direct"
group = "personal"
source = "mentions"
sort = "post_time"
any = [{ visibility = "direct" }]

[[fedtail]]
name = "to_me"
group = "personal"
source = "mentions"
sort = "post_time"
any = [
  {},
  { me = "reply", switch = "@chip_replies" },
  { me = ["mention", "direct"], switch = "@chip_mentions" },
]
none = [{ visibility = "direct", apart = "direct" }, { author = "me" }]

# "Commented posts", as on Point: threads with new comments, a card each
[[fedtail]]
name = "commented"
group = "personal"
source = ["subs", "mentions"]  # the comments, and the replies to me among them
view = "threads"
open_at = "first_unread"  # a click: the thread at its first new comment
icon = "commented"
any = [{ state = "subscribed" }]
none = [{ author = "me" }, { visibility = "direct", apart = "direct" }]

[[fedtail]]
name = "important"
group = "personal"
source = "watched"
any = [{}]

[[fedtail]]
name = "bookmarks"
group = "personal"
source = "bookmarks"
read = "browse"
any = [{}]
none = [{ state = "unbookmarked" }]

[[fedtail]]
name = "activity"
group = "personal"
# every event fedtail knows of, by the quick filters; follow requests stand here while
# no lane of their own ("requests") is shown
any = [
  { event = ["favourite", "reblog", "quote", "unliked"], switch = "@actf_reactions" },
  { event = ["follow", "unfollow", "unfollowed_back", "gone", "lost", "moved"], switch = "@actf_follows" },
  { event = ["follow_request", "pending"], switch = "@actf_requests" },
  { event = "i_followed", switch = "@actf_mine" },
  { event = ["poll", "update", "status", "quoted_update", "severed", "warning", "annual_report", "removed_follower"], switch = "@actf_other" },
]
none = [{ event = "follow_request", apart = "requests" }]

[[fedtail]]
name = "lists"
slot = "lists"

[[fedtail]]
name = "tags"
slot = "tags"


