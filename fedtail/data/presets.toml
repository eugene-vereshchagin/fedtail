# ══════════════════════════════════════════════════════════════════════════════════════
# Lanes no set shows by default but any config may turn on (lanes.enabled) or take as a
# start for its own: the ones before To me, Follow requests as a lane, My likes.

# Followed threads read as a stream of comments — fedtail's set shows "Commented
# posts" instead (a card a thread with news); any set may turn this on
[[extra]]
name = "subs"
switches = ["unread_only"]
group = "personal"
source = "subs"
sort = "post_time"
any = [{}]
none = [{ me = "reply" }]

# "Commented posts", as on Point — fedtail's set has it; any other may turn it on
[[extra]]
name = "commented"
switches = ["unread_only"]
group = "personal"
source = ["subs", "mentions"]  # the comments, and the replies to me among them
view = "threads"
open_at = "first_unread"  # a click: the thread at its first new comment
icon = "commented"
any = [{ state = "subscribed" }]
none = [{ author = "me" }, { visibility = "direct", apart = "direct" }]

[[extra]]
name = "replies"
switches = ["unread_only"]
badge = "hot"  # to answer
group = "personal"
source = "mentions"
sort = "post_time"
any = [{ me = "reply" }]
none = [{ visibility = "direct", apart = "direct" }]

[[extra]]
name = "mentions"
switches = ["posts_only", "unread_only"]
group = "personal"
source = "mentions"
sort = "post_time"
any = [{}]
none = [{ me = "reply" }, { author = "me" }, { visibility = "direct", apart = "direct" }]

[[extra]]
name = "my_likes"
switches = ["posts_only"]
group = "personal"
source = "favourites"
read = "browse"
any = [{}]
none = [{ state = "unliked" }]

[[extra]]
name = "requests"
switches = ["unread_only"]
group = "personal"
any = [{ event = "follow_request" }]

# "The network": Federated without my own server's people — what other servers bring
[[extra]]
name = "network"
switches = ["posts_only"]
group = "standard"
icon = "federated"
source = "federated"
read = "browse"
any = [{ author = "remote" }]

# Mentions from strangers (people who neither follow me nor I them): where spam comes
# from — a lane to look at it apart, or (in none of To me) to keep it away
[[extra]]
name = "stranger_mentions"
switches = ["unread_only"]
group = "personal"
icon = "mentions"
source = "mentions"
sort = "post_time"
any = [{ me = "mention", author = ["stranger", "not_follower"] }]
none = [{ author = ["followed", "follower", "me"] }]


# ══════════════════════════════════════════════════════════════════════════════════════
# The sidebar's sections, top to bottom, and what each is called. A lane stands in the
# section its `group` names — any word: one not here makes a section of that name, after
# these (lanes.sections in config.toml orders them your way). own = true: where a lane
# that names no section goes. "lists" and "tags" are where the server's lists and the
# saved lanes of tags stand.

[sections.standard]
title = { ru = "Стандартные", en = "Timelines" }

[sections.personal]
title = { ru = "Личные", en = "Personal" }
own = true

[sections.lists]
title = { ru = "Списки", en = "Lists" }

[sections.tags]
title = { ru = "Теги", en = "Tags" }


# ══════════════════════════════════════════════════════════════════════════════════════
# The words of the lanes above, by name: what the sidebar calls a lane (title), what its
# row says when asked (tip) and its picture (icon) — for every set at once; a lane's own
# table (here or [[lanes.custom]] in config.toml) may say any of the three itself. A lane
# without words is called by its name. "unsorted" is the lane of what no lane took
# (lanes.unsorted). marks: what a lane of this name is marked for, unless its own table
# says `marks` — the options that pick lanes mean these by "marked": a note about its
# news (notify), a sound (sound), its count on the icon (icon_count), only the languages
# read (languages), no posts of people put in a list (hide_listed).

[words.activity]
marks = ["notify"]
title = { ru = "Активность", en = "Activity" }
tip = { ru = "Кто лайкнул и продвинул твои посты, кто на тебя подписался", en = "Who liked and boosted your posts, who followed you" }
icon = "activity"

[words.bookmarks]
title = { ru = "Закладки", en = "Bookmarks" }
tip = { ru = "Посты, отложенные в закладки (меню ⋯ у поста)", en = "Posts you put aside (the ⋯ menu of a post)" }
icon = "bookmarks"

[words.bots]
marks = ["hide_listed"]
title = { ru = "Боты", en = "Bots" }
tip = { ru = "Боты из тех, кого читаешь", en = "Bots among those you follow" }
icon = "bots"

[words.commented]
marks = ["notify", "sound", "icon_count"]
title = { ru = "Комментарии", en = "Comments" }
tip = { ru = "Как на Point: твои посты, треды, на которые подписан, и те, где ты комментировал, по карточке на тред; щелчок открывает тред на первом новом", en = "As on Point: your posts, threads you follow and those you commented in, a card a thread; a click opens the thread at the first new comment" }
icon = "commented"

[words.direct]
marks = ["notify", "sound"]
title = { ru = "Личные", en = "Direct" }
tip = { ru = "Личные сообщения: посты, видные только упомянутым", en = "Private messages: posts only the mentioned can see" }
icon = "direct"

[words.federated]
marks = ["languages", "hide_listed"]
title = { ru = "Федерация", en = "Federated" }
tip = { ru = "Всё, что твоя нода знает со всех серверов. Листается, без счётчика", en = "Everything your server knows from all servers. Browse, no counter" }
icon = "federated"

[words.home]
marks = ["hide_listed"]
title = { ru = "Лента", en = "Home" }
tip = { ru = "Те, кого ты читаешь (и теги, на которые подписан), без ботов", en = "Those you follow (and tags you follow), without bots" }
icon = "home"

[words.important]
marks = ["notify", "sound", "icon_count"]
title = { ru = "Важные люди", en = "Important people" }
tip = { ru = "Посты тех, на ком колокольчик (🔔 в профиле)", en = "Posts of those you rang the bell on (🔔 in a profile)" }
icon = "important"

[words.lists]

[words.local]
marks = ["languages", "hide_listed"]
title = { ru = "Локальная", en = "Local" }
tip = { ru = "Вся твоя нода. Листается, без счётчика", en = "Your whole server. Browse, no counter" }
icon = "local"

[words.mentions]
marks = ["notify", "sound", "icon_count"]
title = { ru = "Упоминания", en = "Mentions" }
tip = { ru = "Где тебя тегнули в чужом разговоре", en = "Where you were tagged in someone else's talk" }
icon = "mentions"

[words.my_likes]
title = { ru = "Мои лайки", en = "My likes" }
tip = { ru = "Посты, которые ты лайкнул", en = "Posts you liked" }
icon = "my_likes"

[words.my_posts]
title = { ru = "Мои записи", en = "My posts" }
tip = { ru = "Твои посты и комменты", en = "Your posts and replies" }
icon = "my_posts"

[words.network]
