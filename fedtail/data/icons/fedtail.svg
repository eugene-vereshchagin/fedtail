<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- fedtail: a talk bubble with a curled tail, a thread inside -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b8fd0"/>
      <stop offset="1" stop-color="#174a78"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <!-- the tail: leaves the bubble's lower left and curls back on itself -->
  <path d="M86 176 C70 196 52 206 36 204 C22 202 18 188 28 182 C36 177 46 184 42 192
           C58 192 70 184 80 170 Z" fill="#ffffff"/>
  <rect x="40" y="48" width="180" height="132" rx="34" fill="#ffffff"/>
  <!-- a thread: a post, a reply, a reply to the reply -->
  <path d="M70 86 H186" stroke="#1d4f7a" stroke-width="13" stroke-linecap="round"/>
  <path d="M76 100 V122 H96" fill="none" stroke="#1d4f7a" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M106 122 H178" stroke="#1d4f7a" stroke-width="13" stroke-linecap="round"/>
  <path d="M112 136 V154 H130" fill="none" stroke="#1d4f7a" stroke-width="6"
        stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
  <path d="M140 154 H164" stroke="#1d4f7a" stroke-width="13" stroke-linecap="round"/>
  <circle cx="190" cy="154" r="10" fill="#e8702a"/>
</svg>
