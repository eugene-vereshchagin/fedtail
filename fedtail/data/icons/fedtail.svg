<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- fedtail: a speech bubble (talk) whose tail is the "tail" in tail -f,
       holding a terminal prompt >_ ; the cursor is the warm "replies to you" colour -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a86c4"/>
      <stop offset="1" stop-color="#0e3d61"/>
    </linearGradient>
    <linearGradient id="bubble" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3eef6"/>
    </linearGradient>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <path d="M74 52 H182 A38 38 0 0 1 220 90 V142 A38 38 0 0 1 182 180 H112 L70 214 L78 180 H74
           A38 38 0 0 1 36 142 V90 A38 38 0 0 1 74 52 Z" fill="url(#bubble)"/>
  <path d="M76 92 L112 116 L76 140" fill="none" stroke="#14537f" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M130 142 H180" fill="none" stroke="#d9601f" stroke-width="18" stroke-linecap="round"/>
</svg>
