# fedtail — конфиг профиля.
#
# Программа этот файл только читает и никогда не перезаписывает.
# Всё закомментировано = значения по умолчанию. Раскомментируй и поменяй что нужно.
# После правки перезапусти fedtail.
#
# Где лежит: ~/.config/fedtail/<профиль>/config.toml  (профиль по умолчанию — "default")

[account]
# Понимает ли сервер Markdown: "auto" (спросить у сервера), "on", "off".
# GoToSocial / Akkoma — понимают, ванильный Mastodon — нет.
#markdown = "auto"

[ui]
# Фронтенд: пока только "qt".
#frontend = "qt"
# Язык интерфейса: "auto" (из LANG), "ru", "en".
#language = "auto"
# Тема: "system" (как в KDE), "terminal" (зелёным по чёрному).
#theme = "system"
# Размер шрифта постов в пунктах, 0 = системный.
#font_size = 0
# Крестик прячет окно в трей, а не закрывает программу.
#close_to_tray = true
# Всплывающие уведомления о комментах и упоминаниях.
#notifications = true
# Тексты под предупреждением (CW) сразу развёрнуты.
#expand_cw = false
# Ширина колонки постов в пикселях, 0 = во всю ширину.
#max_width = 760

[feed]
# Порядок: "oldest_first" — старое сверху, читаешь вниз (как RSS/Point);
#          "newest_first" — свежее сверху (как у всех).
#order = "oldest_first"
# Где вставать при открытии ленты: "first_unread" или "newest".
#start_at = "first_unread"
# Что делать, когда пришло новое: "keep_position" — стоять где стоишь;
#                                  "jump_to_newest" — прыгнуть к новому (как у всех).
#on_new = "keep_position"
# Полоска «↪ в ответ на…» над ответами.
#show_reply_context = true
# Сколько постов за один запрос к серверу.
#page_size = 40
# Сколько новых постов догонять за один опрос (остальное — следующим).
#catch_up_limit = 400
# Сколько последних постов держать на экране в ленте (старые — по кнопке «раньше»).
#render_limit = 300
# При самом первом запуске считать всё загруженное прочитанным (не начинать с завала).
#first_run_mark_read = true

[read]
# Когда пост считается прочитанным:
#   "on_scroll" — когда прокрутил его целиком;
#   "on_open"   — вся лента, как только её открыл;
#   "manual"    — только кнопкой «всё прочитано».
#mark_read = "on_scroll"

[lanes]
# Какие ленты показывать и в каком порядке:
#   people    — домашняя лента без ботов
#   comments  — ответы на мои посты и комменты
#   mentions  — прочие упоминания
#   bots      — домашняя лента, только боты
#   mine      — мои записи
#   local     — локальная лента ноды
#   requests  — заявки в подписчики
#enabled = ["people", "comments", "mentions", "bots", "mine", "local", "requests"]
# Аккаунты, которые считать ботами, даже если у них нет галки «бот».
# Свой сервер — просто "ник", чужой — "ник@сервер".
#extra_bots = []

[post]
# Видимость нового поста: "public", "unlisted", "private" (подписчикам), "direct".
#default_visibility = "private"
# Ответ не бывает открытее исходного поста.
#reply_never_wider = true
# Черновики сохраняются на лету и переживают закрытие окна.
#drafts_autosave = true

[poll]
# Как часто спрашивать сервер о новом, секунд (не меньше 30).
#interval_seconds = 90
