# Подсказки режима «Что это?» (≡ → «Что это?»).
#
# Ключ — ключ строки интерфейса из fedtail/i18n.py: кнопка с подсказкой «Ответить» — это
# ключ reply. Режим находит подсказку по тексту, который у кнопки и так всплывает, так что
# в коде окна ничего помечать не нужно. text — что сказать; config — какой ключ конфига это
# меняет; help — раздел справки (страница.md#якорь). Тест следит, чтобы ключи здесь и в
# en/hints.toml совпадали и были настоящими.

# ── Левая колонка ──────────────────────────────────────────────────────────────────────

[menu]
text = "Меню: конфиг, темы, аккаунты, «Для нежных и ранимых», отладка, справка и этот режим."
help = "start.md#окно"

[write]
text = "Новый пост — панелью прямо в окне. Черновик сохраняется на лету."
config = "ui.compose"
help = "writing.md#панель-поста-и-черновики"

[full_width_tip]
text = "Посты во всю ширину окна или узкой колонкой, удобной для чтения. Помнится до следующего запуска, конфиг не трогает."
config = "ui.max_width"
help = "look.md#ширина-шрифт-кнопки-эмодзи"

[columns_tip]
text = "Несколько лент рядом, колонками. Клик по ленте слева добавит колонку, ✕ уберёт, ‹ › подвинут."
config = "ui.open_columns, ui.columns"
help = "reading.md#ленты"

[search_side_tip]
text = "Поиск на сервере: люди по имени или @ник@сервер, теги, ссылки на посты и профили. Подписаться можно прямо из результатов."
help = "search.md#люди-теги-посты"

[accounts_tip]
text = "Правый клик — другие аккаунты: переключиться, добавить, сделать главным, все в одном окне."
help = "start.md#профили-и-аккаунты"

[my_profile]
text = "Твой профиль: посты, подписчики, кнопка «Редактировать профиль»."
help = "people.md#профили"

[group_fold_tip]
text = "Свернуть группу лент: останется одна цифра непрочитанного на всю группу. Помнится между запусками."
help = "reading.md#ленты"

[footer_profile_tip]
text = "Какой это профиль и аккаунт. У каждого профиля свои конфиг, тема и база."
help = "start.md#профили-и-аккаунты"

[tip_home]
text = "Посты тех, кого читаешь, и тегов, на которые подписан. Боты — в своей ленте, люди из списков — в лентах списков."
config = "lanes.enabled"
help = "reading.md#ленты"

[tip_federated]
text = "Всё, что твой сервер знает со всех серверов. Листается, без счётчика: её не дочитывают."
config = "lanes.enabled"
help = "reading.md#ленты"

[tip_local]
text = "Все посты твоего сервера. Листается, без счётчика."
config = "lanes.enabled"
help = "reading.md#ленты"

[tip_bots]
text = "Боты из тех, кого читаешь: ретрансляторы, новости, погода. Кто бот без галки — допиши в lanes.extra_bots."
config = "lanes.extra_bots"
help = "reading.md#ленты"

[tip_my_posts]
text = "Твои посты и комменты — всегда прочитаны."
help = "reading.md#ленты"

[tip_direct]
text = "Личные сообщения: посты, которые видят только упомянутые. Пока эта лента включена, в других они не дублируются (правила наборов: apart = \"direct\")."
config = "lanes.preset"
help = "reading.md#ленты"

[tip_mentions]
text = "Где тебя тегнули в чужом разговоре. Ответы на твои посты — отдельно, в «Ответах мне» (её нет в наборах: lanes.enabled её называет)."
config = "lanes.preset"
help = "reading.md#ленты"

[tip_replies]
text = "Ответы на твои посты и комменты, даже если в них есть @ты."
help = "reading.md#ленты"

[tip_subs]
text = "Новые комменты в тредах, на которые ты подписан, — даже если тебя там не упомянули. Как на Point."
config = "subs.auto"
help = "reading.md#треды"

[tip_bookmarks]
text = "Отложенное «в закладки». Хранит сервер, так что закладки общие с другими клиентами."
help = "reading.md#карточка-поста"

[tip_my_likes]
text = "Посты, которые ты лайкнул. По умолчанию лента выключена."
config = "lanes.enabled"
help = "reading.md#ленты"

[tip_activity]
text = "Кто лайкнул, продвинул, подписался, закончился опрос; на GoToSocial — ещё то, что ждёт твоего одобрения."
config = "activity.types"
help = "notifications.md#активность"

[tip_requests]
text = "Кто просится в подписчики: принять или отклонить."
help = "people.md#подписки-и-заявки"

# ── Над лентой ─────────────────────────────────────────────────────────────────────────

[show_all_tip]
text = "Все посты и все ответы."
help = "reading.md#ленты"

[posts_only_tip]
text = "Только корневые посты, без комментариев и ответов."
config = "lanes.posts_only"
help = "reading.md#ленты"

[unread_only_tip]
text = "Только то, что было непрочитано, когда ты открыл ленту, и что пришло потом. Прочитанное бледнеет, но не исчезает под глазами."
help = "reading.md#позиция-и-прочитанное"

[view_feed_tip]
text = "Каждый пост отдельной карточкой, по порядку."
help = "reading.md#ленты"

[conv_mode_tip]
text = "Каждый тред — одной карточкой: где начался, сколько сообщений, сколько новых, кто написал последним. Как разговоры на Point."
config = "feed.remember_choices"
help = "reading.md#ленты"

[media_filter_tip]
text = "Оставить только посты с картинками, гифками, видео, звуком, только текст или только бусты. До перезапуска."
help = "reading.md#ленты"

[to_new_tip]
text = "Прокрутить к первому непрочитанному."
help = "reading.md#позиция-и-прочитанное"

[to_end_tip]
text = "Непрочитанного нет — прокрутить к самому свежему."
help = "reading.md#позиция-и-прочитанное"

[mark_all_read]
text = "Отметить прочитанным всё в этой ленте."
config = "read.mark_read"
help = "reading.md#позиция-и-прочитанное"

[refresh]
text = "Спросить сервер о новом сейчас, не дожидаясь опроса."
config = "poll.interval_seconds"

[sub_tip]
text = "Подписка на тред: новые комменты в нём придут в «Подписки», как на Point."
config = "subs.auto"
help = "reading.md#треды"

# ── Пост ───────────────────────────────────────────────────────────────────────────────

[reply]
text = "Ответить: видимость ответа никогда не шире исходного поста. Клавиша r."
config = "post.reply_never_wider"
help = "writing.md#видимость"

[fav]
text = "Лайк. Правый клик по звёздочке — кто лайкнул. Клавиша f."
help = "reading.md#карточка-поста"

[boost]
text = "Продвинуть пост своим подписчикам. Правый клик — кто продвинул. Клавиша b."
help = "reading.md#карточка-поста"

[thread]
text = "Открыть весь тред деревом, с ответами с сервера автора."
config = "feed.complete_threads"
help = "reading.md#треды"

[bookmark]
text = "В закладки (лента «Закладки»). Клавиша m."
config = "ui.bookmark_button"
help = "reading.md#карточка-поста"

[more]
text = "Всё остальное: цитировать, перевести, заглушить тред, подписаться на тред, в список, скопировать ник, от другого аккаунта, пожаловаться."
help = "reading.md#карточка-поста"

[short_id_tip]
text = "Короткий номер поста, как #abc на Point. Клик — в командную строку: допиши текст, и это ответ."
help = "command-line.md#команды"

[unread_tip]
text = "Пост ещё не прочитан. Когда он считается прочитанным — read.mark_read."
config = "read.mark_read"
help = "reading.md#позиция-и-прочитанное"

[old_post_tip]
text = "Пост старше feed.old_days дней: пришёл из чужого outbox или старого треда, это не новость."
config = "feed.old_days"

[reactions_tip]
text = "Эмодзи-реакции с Akkoma, Pleroma, Misskey. Ставить свои пока нельзя: GoToSocial их не умеет."
help = "reading.md#карточка-поста"

# ── Панель поста ───────────────────────────────────────────────────────────────────────

[compose_bigger_tip]
text = "Панель побольше или поменьше; выбор запоминается."
config = "ui.compose_size"
help = "writing.md#панель-поста-и-черновики"

[close_tip]
text = "Закрыть панель. Черновик никуда не денется — откроешь снова, и он там."
config = "post.drafts_autosave"
help = "writing.md#панель-поста-и-черновики"

[lang_tip]
text = "Язык поста: по нему серверы фильтруют и переводят. «Другой язык…» добавит любой код ISO 639."
config = "post.language, post.languages"
help = "writing.md#markdown-cw-язык"

[cw_add_tip]
text = "Предупреждение (CW): текст спрячется под кнопку «показать». Для спойлеров, тяжёлых тем, длинных простыней."
config = "post.cw_field"
help = "writing.md#markdown-cw-язык"

[poll_add_tip]
text = "Опрос вместо картинок: варианты, срок, один ответ или несколько."
help = "writing.md#опросы-цитаты-цепочки-отложенные"

[sensitive_mark_tip]
text = "Картинки будут под плашкой, пока читатель сам не откроет."
help = "writing.md#картинки"

[schedule_tip]
text = "Отправить позже: пост подождёт на сервере, даже если fedtail закрыт. Список ждущих — ≡ → «Запланированные»."
config = "post.schedule"
help = "writing.md#опросы-цитаты-цепочки-отложенные"

[preview_tip]
text = "Как пост будет выглядеть: Markdown уже разметкой, CW, видимость, каждая часть цепочки."
config = "post.preview"
help = "writing.md#markdown-cw-язык"

[media_tip]
text = "Двойной клик — подпись (alt) и точка фокуса. Без подписи fedtail спросит перед отправкой."
config = "post.alt_reminder, post.focus_point"
help = "writing.md#картинки"

# ── Поиск и командная строка ───────────────────────────────────────────────────────────

[cmd_tip]
text = "Командная строка как на Point: #id — открыть, #id текст — ответить, S/U — подписка, ! — буст, ~ — закладка, просто текст — новый пост."
config = "ui.command_line, post.plain_posts"
help = "command-line.md#команды"

[find_deeper_tip]
text = "Искать во всём, что сохранено для этой ленты, и догрузить её до найденного."
help = "search.md#в-ленте-ctrlf"

[find_everywhere_tip]
text = "Искать во всех лентах сразу: следующее совпадение само откроет свою ленту."
help = "search.md#во-всех-лентах"

[try_theme_tip]
text = "Любая тема сразу, до перезапуска. Насовсем — ui.theme в конфиге."
config = "ui.theme"
help = "look.md#темы"

[viewer_save_tip]
text = "Сохранить оригинал в папку загрузок. Клавиша S."
config = "ui.save_dir"
help = "keys.md#просмотрщик-и-плеер"

[whats_this_tip]
text = "Этот самый режим: подробные подсказки при наведении мыши. Выключить — тем же пунктом меню."
config = "ui.whats_this"
help = "index.md"
