# fedtail as a Flatpak: the Qt window on KDE's runtime with PySide6 from its BaseApp.
#
#   flatpak-builder --user --install --force-clean build/flatpak \
#       packaging/flatpak/online.dmesg.fedtail.yml
#   flatpak run online.dmesg.fedtail
#
# CI's `flatpak` job builds it into fedtail-<version>.flatpak (a bundle:
# `flatpak install --user fedtail-….flatpak`). The Python packages below are pinned with
# their sha256 from PyPI; a newer one: its file name, url and sha256 from
# https://pypi.org/pypi/<name>/json. The menu entry, the icon (named as the app) and the
# AppStream file come from packaging/desktop_files.py.
id: online.dmesg.fedtail
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: fedtail
finish-args:
  - --share=network
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --socket=pulseaudio            # sounds of new posts, video in the window
  - --talk-name=org.freedesktop.Notifications
  - --talk-name=org.kde.StatusNotifierWatcher   # the tray icon
  - --filesystem=xdg-download      # pictures and videos saved
cleanup-commands:
  - /app/cleanup-BaseApp.sh
modules:
  # for building what comes as source (cffi, langdetect, fedtail itself); not shipped
  - name: python3-setuptools
    buildsystem: simple
    cleanup: ['*']
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        --no-build-isolation setuptools wheel
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/ef/55/6dc6d6bb953bdfc52519a0059592c52b6e3b8ad51cf8256dffceb55b0610/setuptools-84.2.1-py3-none-any.whl
        sha256: ca140b45d5325a9478f880e351484f62fef15f336462e449ca0c03c873d589c2
      - type: file
        url: https://files.pythonhosted.org/packages/2e/29/69cfbb602cd91690c55d38ba9fe53e6a7e76a6fa647bf38f19c138d25449/wheel-0.48.0-py3-none-any.whl
        sha256: 3217dcc807155e45db462d7ef2431f5ddda0d7273b700d05a67b271ceb1287ab

  - name: python3-requests
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        --no-build-isolation requests
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/a0/f4/c67b0b3f1b9245e8d266f0f112c500d50e5b4e83cb6f3b71b6528104182a/requests-2.34.2-py3-none-any.whl
        sha256: 2a0d60c172f83ac6ab31e4554906c0f3b3588d37b5cb939b1c061f4907e278e0
      - type: file
        url: https://files.pythonhosted.org/packages/92/9d/c4e665119135114480843e7ab388fa94d8480650450e6f8e26b70d323a4c/urllib3-2.8.0-py3-none-any.whl
        sha256: 0cf3cae568d36aa9576b28dfb35f11328f1cb974ca7647d9475ebb86c75ac6e3
      - type: file
        url: https://files.pythonhosted.org/packages/58/a2/bb081bab032533a855d44de1d56f8e8426114ff1ba5d1f07a438a0a654f8/idna-3.20-py3-none-any.whl
        sha256: ab7ae7122974553370f0bdb919e1a960b2cd1bc1ef0276416d896db81c14582c
      - type: file
        url: https://files.pythonhosted.org/packages/fc/ad/d07d7862a62ffa6d79d68074d14823243dd235a77c45262acbf6adeb28bf/charset_normalizer-3.5.2-py3-none-any.whl
        sha256: b6b751274acb69d77b3323d6b7dbaa3c7fdfc1eb829b7eb61d262f32e1af9685
      - type: file
        url: https://files.pythonhosted.org/packages/32/d1/a3652fe2c19134d0d15922177821d863cbd7e842d53a21bbe7e8e3a1b5ac/certifi-2026.10.23-py3-none-any.whl
        sha256: e9b54de76e530bb6cf0ccd036787103acb58fd42ba930ea8bf948ddbaa2f61d1

  # sync between devices (core/sync): cryptography, its cffi built here
  - name: python3-cryptography
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        --no-build-isolation cryptography
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b6/ae/315bbeee126a769cbde43cf4908acb4b40408d8bf8bbf334dd7368d8dadf/pycparser-3.12-py3-none-any.whl
        sha256: a076f3f489b39b43ed13563a1dafe42447445bec2e294154ec5c57fcdda4c85e
      - type: file
        url: https://files.pythonhosted.org/packages/9e/ef/008a1939e372c06329a3fce4279c02f328488f3526744906eeec3da7ad5f/cffi-2.1.1.tar.gz
        sha256: dd31f52ea1086513bb9df30f8fcee9b8918323ae067a3d5b78bc826a000712be
      - type: file
        only-arches: [x86_64]
        url: https://files.pythonhosted.org/packages/1a/f1/b474e930c4d910328780e3940da76f5aa5cbc48ce1fc14e44d239d9ea9db/cryptography-50.0.2-cp311-abi3-manylinux_2_28_x86_64.whl
        sha256: 4061c0079120205fb760c58acab6443e217307dcf05e3702cf970e0689972856
      - type: file
        only-arches: [aarch64]
        url: https://files.pythonhosted.org/packages/38/6b/61a3f8d8c5e1e49a6cddccafc4015cc1c0021360ab0acb4080e7a423644a/cryptography-50.0.2-cp311-abi3-manylinux_2_28_aarch64.whl
        sha256: f9f6143a8c75945eb960d9eb98905a441394abfa24afaae239d514ffb2586480

  # a post's language by its words (filters, the language check)
  - name: python3-langdetect
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST}
        --no-build-isolation langdetect
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/b7/ce/149a00dd41f10bc29e5921b496af8b574d8413afcd5e30dfa0ed46c2cc5e/six-1.17.0-py2.py3-none-any.whl
        sha256: 4721f391ed90541fddacab5acf947aa0d3dc7d27b2e1e8eda2be8970586c3274
      - type: file
        url: https://files.pythonhosted.org/packages/0e/72/a3add0e4eec4eb9e2569554f7c70f4a3c27712f40e3284d483e88094cc0e/langdetect-1.0.9.tar.gz
        sha256: cbc1fef89f8d062739774bd51eda3da3274006b3661d199c2655f6b3f6d605a0

  - name: fedtail
    buildsystem: simple
    build-commands:
      - pip3 install --no-index --no-deps --no-build-isolation --prefix=${FLATPAK_DEST} .
      - python3 packaging/desktop_files.py ${FLATPAK_DEST} --icon online.dmesg.fedtail
    sources:
      - type: dir
        path: ../..
        skip:
          - .git
          - build
          - dist
          - tmp
          - NOTES
          - android
