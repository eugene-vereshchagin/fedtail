[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedtail"
dynamic = ["version"]
description = "Desktop fediverse client for people who miss Point.im: whole threads as trees, nothing jumps, everything is a config flag"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Eugene Vereshchagin" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.28,<3"]
keywords = ["fediverse", "mastodon", "gotosocial", "akkoma", "client", "qt", "point.im", "juick"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Topic :: Communications",
    "Topic :: Internet",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/eugene-vereshchagin/fedtail"
Issues = "https://github.com/eugene-vereshchagin/fedtail/issues"
Changelog = "https://github.com/eugene-vereshchagin/fedtail/blob/main/CHANGELOG.md"

[project.optional-dependencies]
qt = ["PySide6-Essentials>=6.5"]
tui = ["textual>=0.86", "Pillow>=9.1"]
sync = ["cryptography>=3.4"]

[project.scripts]
fedtail = "fedtail.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "fedtail.__version__" }

[tool.setuptools.packages.find]
include = ["fedtail*"]

[tool.setuptools.package-data]
fedtail = ["data/*", "data/themes/*", "data/themes/fonts/*", "data/icons/*", "data/icons/fallback/*", "data/themes/*/icons/*", "data/web/*", "data/help/*/*", "data/help/*/ref/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# a Qt stylesheet template: long CSS lines read better unbroken
"fedtail/frontends/qt/theme.py" = ["E501"]
