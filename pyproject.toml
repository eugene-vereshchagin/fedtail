[build-system]
requires = ["setuptools>=69"]  # "**" in package-data
build-backend = "setuptools.build_meta"

[project]
name = "fedtail"
dynamic = ["version"]
description = "Desktop fediverse client for people who miss Point.im: whole threads as trees, nothing jumps, everything is a config flag"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "Eugene Vereshchagin" }]
requires-python = ">=3.11"
dependencies = ["requests>=2.28,<3"]
keywords = ["fediverse", "mastodon", "gotosocial", "akkoma", "client", "qt", "point.im", "juick"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Environment :: X11 Applications :: Qt",
    "Environment :: Win32 (MS Windows)",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Natural Language :: English",
    "Natural Language :: Russian",
    "Topic :: Communications",
    "Topic :: Internet",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/eugene-vereshchagin/fedtail"
Issues = "https://github.com/eugene-vereshchagin/fedtail/issues"
Changelog = "https://github.com/eugene-vereshchagin/fedtail/blob/main/CHANGELOG.md"

[project.optional-dependencies]
qt = ["PySide6-Essentials>=6.5"]
media = ["PySide6-Addons>=6.5"]  # video and audio inside the window (QtMultimedia)
tui = ["textual>=0.86", "Pillow>=9.1"]
sync = ["cryptography>=3.4"]
langs = ["langdetect>=1.0.9"]

[project.scripts]
fedtail = "fedtail.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "fedtail.__version__" }

[tool.setuptools.packages.find]
include = ["fedtail*"]

[tool.setuptools.package-data]
# every file under data/ (a folder added later comes along: tests/test_packaging.py)
fedtail = ["_vendor/VENDORED.toml", "_vendor/*/LICENSE.txt", "_vendor/*/py.typed", "data/**/*"]

# Types, checked where they are said (docs/en/dev/ci.md, the `types` job — it warns, it
# doesn't block): the model, the core and the protocol first. Lenient on purpose: a
# function without annotations is still looked into (check_untyped_defs), nothing has
# to be annotated; tighten module by module.
[tool.mypy]
python_version = "3.11"
files = ["fedtail/model", "fedtail/core", "fedtail/protocols"]
ignore_missing_imports = true
follow_imports = "silent"
check_untyped_defs = true
# "say what this empty dict holds" and "I can't tell this attribute's type yet" are
# requests to annotate, not defects: not asked while nothing has to be annotated
disable_error_code = ["var-annotated", "has-type"]
warn_unused_ignores = true
cache_dir = "tmp/.mypy_cache"

# The Core's parts are mixins (core/app.py puts them together): each calls what another
# part or the Core itself has — `self.store`, `self.emit` — which a mixin alone doesn't
# declare. Until they do, "no such attribute" is not asked of these modules.
[[tool.mypy.overrides]]
module = [
    "fedtail.core.activity", "fedtail.core.counts", "fedtail.core.lists",
    "fedtail.core.markers", "fedtail.core.origin", "fedtail.core.people",
    "fedtail.core.poll", "fedtail.core.push", "fedtail.core.silence",
    "fedtail.core.social", "fedtail.core.syncing", "fedtail.core.thread_ops",
    "fedtail.core.threadsize", "fedtail.core.translate", "fedtail.core.updates",
    "fedtail.core.writing",
]
disable_error_code = ["attr-defined"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["fedtail/_vendor/*/"]  # carried as PyPI has it (tools/vendor.py)

[tool.ruff.lint]
# BLE: a broad `except Exception` says why beside its `noqa` (what is caught on purpose
# and what happens then) — 258 of them, each a decision (the audit of 23.11)
select = ["E", "F", "W", "B", "I", "UP", "BLE"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# a Qt stylesheet template: long CSS lines read better unbroken
"fedtail/frontends/qt/theme.py" = ["E501"]
