[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fedtail"
dynamic = ["version"]
description = "Desktop fediverse client for people who miss Point.im: threads as trees, nothing jumps, everything is a config flag"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["requests>=2.28"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Environment :: X11 Applications :: Qt",
    "Topic :: Communications",
    "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
qt = ["PySide6-Essentials>=6.5"]

[project.scripts]
fedtail = "fedtail.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "fedtail.__version__" }

[tool.setuptools.packages.find]
include = ["fedtail*"]

[tool.setuptools.package-data]
fedtail = ["data/*", "data/themes/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "B", "I", "UP"]
ignore = ["E731"]

[tool.ruff.lint.per-file-ignores]
# a Qt stylesheet template: long CSS lines read better unbroken
"fedtail/frontends/qt/theme.py" = ["E501"]
