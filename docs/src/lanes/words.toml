# What every key and word of a lane rule means (feeds the generated lanes guide;
# tests/test_lanes_doc.py checks it against core/atoms.py). ru and en say the same thing.

# ---- keys of a lane -------------------------------------------------------------------

[rule.name]
ru = "Имя ленты. Не меняется: окно, синк и плитки помнят ленту по нему."
en = "The lane's name. It never changes: the window, sync and tiles remember the lane by it."
takes = { ru = "слово: `home_plus`", en = "a word: `home_plus`" }

[rule.title]
ru = "Что показывает боковая панель. Без него показывается имя."
en = "What the sidebar shows. Without it the name is shown."
takes = { ru = "текст или по языкам: `{ ru = \"Посты\", en = \"Posts\" }`", en = "text, or one per language: `{ ru = \"Посты\", en = \"Posts\" }`" }

[rule.any]
ru = "Список условий: пост входит в ленту, если подходит под любое из них."
en = "A list of conditions: a post is in the lane if it matches any of them."
takes = { ru = "список таблиц: `[{ author = \"me\" }, { me = \"reply\" }]`", en = "a list of tables: `[{ author = \"me\" }, { me = \"reply\" }]`" }

[rule.none]
ru = "Условия-запреты: подходящий под любое из них пост не входит, даже если `any` его пустил."
en = "Conditions that keep a post out: one matching any of them is left out even if `any` let it in."
takes = { ru = "список таблиц, как в `any`", en = "a list of tables, as in `any`" }

[rule.source]
ru = "Сужает все условия до этих источников. Без него fedtail сам берёт источники, которые могут принести нужное."
en = "Narrows every condition to these sources. Without it the app picks the sources that can bring what the conditions ask for."
takes = { ru = "источник или список: `\"home\"`, `[\"home\", \"subs\"]`", en = "a source or a list: `\"home\"`, `[\"home\", \"subs\"]`" }

[rule.sort]
ru = "Порядок постов: по приходу, по времени поста или по счётчикам (в час возраста). Лучшее лежит там, где начинается чтение."
en = "Post order: by arrival, by the post's time, or by a counter (per hour of age). The best sit where reading starts."

[rule.mode]
ru = "`lane` — обычная лента; `catch_up` — только пришедшее за `window`: «что я пропустил»."
en = "`lane` is an ordinary lane; `catch_up` shows only what came within `window`: “what I missed”."

[rule.window]
ru = "Лента показывает только посты моложе этого срока. В `catch_up` по умолчанию 12 часов."
en = "The lane shows only posts younger than this. In `catch_up` the default is 12 hours."
takes = "`\"12h\"`, `\"2d\"`"

[rule.filter_context]
ru = "Серверные фильтры этого контекста скрывают или сворачивают посты ленты, из какого бы источника те ни пришли."
en = "The server's filters of this context hide or fold the lane's posts, whatever source they came from."

[rule.per_author]
ru = "Не больше стольких постов одного автора, самых свежих: шумный не забьёт ленту. 0 — сколько есть."
en = "At most this many posts of one author, the newest, so a noisy one doesn't fill the lane. 0 means no limit."
takes = { ru = "число: `3`", en = "a number: `3`" }

[rule.bundle]
ru = "Посты каждого автора вместе, самый активный первым: «что я пропустил» по людям."
en = "Each author's posts together, the busiest first: catching up by people."

[rule.view]
ru = "`threads` — по карточке на тред: его пост и число новых комментариев; только треды, где есть новое."
en = "`threads` shows one card per thread: its post and the number of new comments; only threads with something new."

[rule.open_at]
ru = "Где откроется тред с карточки ленты: на посте или на первом непрочитанном комментарии (нет такого — на посте). Без ключа — по общей настройке тредов."
en = "Where a thread opens from the lane's card: at the post or at the first unread comment (none: at the post). Without the key the general thread setting applies."

[rule.start]
ru = "`true` — эта лента набора открывается первой, если стартовая лента из настроек не называет ни одной из его лент."
en = "`true` makes this lane of a set open first when the start lane in the settings names none of its lanes."
takes = "`true`"

[rule.hide_empty]
ru = "`true` — лента видна в боковой панели, только когда в ней что-то есть."
en = "`true` shows the lane in the sidebar only when something is in it."
takes = "`true`"

[rule.switches]
ru = "Быстрые фильтры над лентой: «только посты», «только новое». `[]` — никаких. Без ключа — как в ленте до 0.22."
en = "Quick filters above the lane: “posts only”, “unread only”. `[]` means none. Without the key, as in lanes before 0.22."

[rule.badge]
ru = "Цвет счётчика ленты в боковой панели: «горячий» — на что ответить, «тихий» — не к спеху. Пусто — обычный."
en = "The colour of the lane's counter in the sidebar: “hot” is something to answer, “quiet” is no hurry. Empty means the usual one."

[rule.read]
ru = "Как лента читается: с метками непрочитанного и счётчиками, или как свежая страница без них."
en = "How the lane is read: with unread marks and counters, or as a fresh page without them."

[rule.group]
ru = "Раздел боковой панели, где лежит лента: `standard`, `personal`, `lists`, `tags` или своё имя."
en = "The sidebar section the lane sits in: `standard`, `personal`, `lists`, `tags`, or a name of your own."
takes = { ru = "слово: `standard` или своё имя", en = "a word: `standard` or a name of your own" }

[rule.icon]
ru = "Картинка ленты: из значков встроенных лент или из библиотеки (`fire`, `book`, `globe`…). Без неё — по имени ленты, у своей — как у списка."
en = "The lane's picture: one of the built-in lanes' icons or the library's (`fire`, `book`, `globe`…). Without it, by the lane's name; a custom lane gets the list icon."
takes = { ru = "слово картинки, см. ниже", en = "a picture's word, see below" }

# ---- keys of a condition --------------------------------------------------------------

[condition.source]
ru = "Откуда пришёл пост: из какой ленты сервера, списка, поиска и т. д."
en = "Where the post came from: which server timeline, list, search and so on."

[condition.author]
ru = "Кто автор поста (у буста — кто бустнул) и как он связан со мной."
en = "Who wrote the post (for a boost, who boosted) and how they relate to me."

[condition.visibility]
ru = "Кому виден пост."
en = "Who can see the post."

[condition.kind]
ru = "Вид поста: обычный, ответ, буст, цитата и так далее."
en = "The kind of post: plain, reply, boost, quote and so on."

[condition.me]
ru = "Как пост связан со мной: ответ мне, упоминание, буст моего поста…"
en = "How the post relates to me: a reply to me, a mention, a boost of my post…"

[condition.parent]
ru = "Чей пост, на который отвечают, если он известен."
en = "Whose post is being replied to, when that is known."

[condition.has]
ru = "Что есть в посте: вложения, предупреждение, ссылки, теги, слова."
en = "What the post contains: attachments, a warning, links, tags, words."

[condition.lang]
ru = "Язык поста — как его выставил клиент автора, а он часто ошибается. `unknown` — язык не указан."
en = "The post's language as the author's client set it, which is often wrong. `unknown` means no language given."
takes = "`\"ru\"`, `\"en\"`, `\"unknown\"`"

[condition.state]
ru = "Что с постом у меня: прочитан, в закладках, лайкнут, в удалённых и так далее."
en = "What state the post is in for me: read, bookmarked, liked, deleted and so on."

[condition.via]
ru = "Почему пост попал в мою Ленту."
en = "Why the post is in my Home."

[condition.target]
ru = "На что направлен буст, лайк или другое событие: на пост или комментарий, мой или чужой."
en = "What a boost, like or other event is about: a post or a comment, mine or someone else's."

[condition.event]
ru = "Событие, не пост: лайк, подписка, отписка и подобное. Такое условие подходит строкам Активности."
en = "An event that isn't a post: a like, a follow, an unfollow and so on. Such a condition matches Activity rows."

[condition.likes]
ru = "Число лайков на момент получения поста (потом устаревает)."
en = "The number of likes when the post was fetched (it goes stale afterwards)."
takes = { ru = "`\">10\"`, `\"<=3\"`, `\"5\"` (не меньше)", en = "`\">10\"`, `\"<=3\"`, `\"5\"` (at least)" }
[condition.boosts]
ru = "Число бустов на момент получения поста (потом устаревает)."
en = "The number of boosts when the post was fetched (it goes stale afterwards)."
takes = { ru = "`\">10\"`, `\"<=3\"`, `\"5\"` (не меньше)", en = "`\">10\"`, `\"<=3\"`, `\"5\"` (at least)" }
[condition.replies]
ru = "Число ответов на момент получения поста (потом устаревает)."
en = "The number of replies when the post was fetched (it goes stale afterwards)."
takes = { ru = "`\">10\"`, `\"<=3\"`, `\"5\"` (не меньше)", en = "`\">10\"`, `\"<=3\"`, `\"5\"` (at least)" }

[condition.text]
ru = "Слова в тексте поста и предупреждении (CW). Внешний список — ИЛИ, внутренний — И."
en = "Words in the post's text and its warning (CW). The outer list is OR, the inner one AND."
takes = { ru = "`[[\"a\", \"b\"], [\"c\"]]` — (a и b) или c", en = "`[[\"a\", \"b\"], [\"c\"]]`: (a and b) or c" }

[condition.text_in]
ru = "Где искать `text`: в тексте, предупреждении (CW), описании медиа, вариантах опроса, имени автора. По умолчанию — текст и CW."
en = "Where `text` looks: the text, the warning (CW), media descriptions, poll options, the author's name. The default is text and CW."

[condition.text_case]
ru = "`true` — различать заглавные и строчные буквы в `text`."
en = "`true` makes `text` tell capital and small letters apart."
takes = "`true`"

[condition.text_regex]
ru = "`true` — слова в `text` читаются как регулярные выражения."
en = "`true` reads the words in `text` as regular expressions."
takes = "`true`"

[condition.age]
ru = "Возраст поста: младше (`<`) или старше (`>`) срока."
en = "The post's age: younger (`<`) or older (`>`) than a span."
takes = "`\"<1d\"`, `\">2d\"`"

[condition.age_of]
ru = "Чей возраст считает `age` у буста: самого буста или оригинала."
en = "Whose age `age` counts for a boost: the boost's or the original's."

[condition.id]
ru = "Конкретный пост по его номеру на сервере (у буста подходит и номер оригинала)."
en = "One particular post by its id on the server (for a boost, the original's id matches too)."
takes = { ru = "номер или список номеров: `\"1122334455\"`", en = "an id or a list of ids: `\"1122334455\"`" }

[condition.until]
ru = "Условие действует до этого времени; потом как будто его нет: заглушка на неделю, лента на поездку."
en = "The condition holds until then and afterwards is as if absent: a mute for a week, a lane for a trip."
takes = { ru = "дата или момент: `\"2026-11-01\"`", en = "a date or a moment: `\"2026-11-01\"`" }

[condition.priority]
ru = "Какое из условий `any` назвать причиной, когда подходят несколько: у кого число больше, то первое. На выбор постов не влияет."
en = "Which of the `any` conditions to name as the reason when several match: the larger number goes first. It doesn't change which posts get in."
takes = { ru = "число: `1`", en = "a number: `1`" }

[condition.apart]
ru = "Условие из `none`, которое работает, только пока показывается названная лента: личные читаются в «Личных» — там, где она включена, здесь их нет."
en = "A `none` condition that counts only while the named lane is shown: the private posts are read in Direct when it is on, and stay here otherwise."
takes = { ru = "имя ленты: `\"direct\"`", en = "a lane's name: `\"direct\"`" }

[condition.switch]
ru = "Делает условие переключателем: над лентой появляется чип с этим словом."
en = "Makes the condition a switch: a chip with this word appears above the lane."
takes = { ru = "слово на чипе: `\"Комменты\"`", en = "the chip's word: `\"Comments\"`" }

[condition.shown]
ru = "`false` — переключатель по умолчанию выключен, посты под ним скрыты, пока не нажмёшь."
en = "`false` leaves the switch off by default: posts under it stay hidden until you click it."
takes = "`false`"

[condition.any]
ru = "Внутреннее ИЛИ: должна подойти одна из этих таблиц, а остальные ключи условия — тоже (И из ИЛИ)."
en = "An inner OR: one of these tables must match too, along with the condition's other keys (an AND of ORs)."
takes = { ru = "список таблиц: `[{ has = \"image\" }, { kind = \"reply\" }]`", en = "a list of tables: `[{ has = \"image\" }, { kind = \"reply\" }]`" }

