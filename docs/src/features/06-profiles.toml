others.ru = "у всех"
others.en = "everyone"
clients = ["all"]
details.ru = "Сверху профиля с пометкой 📌. `false` — профиль просто по времени."
details.en = "At the top of a profile, marked 📌. `false` — the profile simply in time order."

[[feature]]
