id = "profiles"
title.ru = "Профили"
title.en = "Profiles"

[[feature]]
id = "profile"
status = "has"
since = "0.2.0"
name.ru = "Свой и чужой профиль"
name.en = "Your own and other people's profiles"
config = "—"
api = "`accounts/:id`, `accounts/:id/statuses`"
others.ru = "у всех"
others.en = "everyone"
clients = ["all"]
details.ru = "Шапка, о себе, поля, счётчики, посты; «из твоих подписок на него подписаны» (`familiar_followers`); подписки и подписчики."
details.en = "The header, bio, fields, counts, posts; “followed by people you follow” (`familiar_followers`); follows and followers."

[[feature]]
id = "profile-show"
status = "has"
since = "0.20.0"
name.ru = "В профиле: посты, посты и ответы, медиа"
name.en = "In a profile: posts, posts and replies, media"
config = "`feed.profile_show`"
api = "`accounts/:id/statuses` `exclude_replies`, `only_media`"
others = "Mastodon web, Tusky, Ivory, Phanpy, Elk, Ice Cubes, Fedilab"
clients = ["Mastodon web", "Tusky", "Ivory", "Phanpy", "Elk", "Ice Cubes", "Fedilab"]
details.ru = "Над постами человека — переключатель: «Посты» (без его ответов другим; ответы в своих тредах остаются), «Посты и ответы», «Медиа» (только с картинками и видео). С чего начинать — `feed.profile_show`, по умолчанию «Посты», как в других клиентах. Отбирает сервер."
details.en = "Above a person's posts, a switch: “Posts” (without their replies to others; replies in their own threads stay), “Posts and replies”, “Media” (only with pictures and video). Which one first — `feed.profile_show`, “Posts” by default, as in other clients. The server does the picking."

