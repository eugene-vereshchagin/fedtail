since = "0.14.0"
name.ru = "Софт сервера автора"
name.en = "The author's server software"
config = "`feed.server_info`"
api.ru = "nodeinfo, в профиле «🖥 GoToSocial 0.17»"
api.en = "nodeinfo, in the profile “🖥 GoToSocial 0.17”"
others = "—"
activitypub = true
details.ru = "fedtail спрашивает nodeinfo сервера человека (Mastodon, GoToSocial, Akkoma, Misskey, Lemmy…) и пишет в профиле «🖥 GoToSocial 0.17.3». Ответ помнится неделю на сервер."
details.en = "fedtail asks the person's server for its nodeinfo (Mastodon, GoToSocial, Akkoma, Misskey, Lemmy…) and writes “🖥 GoToSocial 0.17.3” in the profile. The answer is kept a week per server."

[[feature]]
id = "server-probe"
status = "has"
since = "0.17.0"
name.ru = "Что умеет мой сервер"
name.en = "What my server can do"
config.ru = "≡ → аккаунт → «О сервере» → «Что умеет» → «Проверить»"
config.en = "≡ → account → “Server info” → “What it can do” → “Check”"
api.ru = "по безобидному GET с `limit=1` на каждую возможность"
api.en = "one harmless GET with `limit=1` per feature"
others = "—"
details.ru = "Два десятка запросов «покажи одну штуку» (ничего на сервере не меняется), несколько секунд в фоне — окно не замирает. Ответ на каждую возможность: есть, нет, есть, но закрыто для меня, непонятно; лимиты (символов, вложений, вариантов в опросе) — числом. Что не спросишь, ничего не изменив (убрать одно уведомление, мьют треда), сказано по тому, что это за сервер. Последняя проверка запоминается и показывается сразу; ответы заодно говорят fedtail, какие кнопки показывать."
details.en = "A score of “show me one” requests (nothing changes on the server), a few seconds in the background — the window doesn't freeze. Each feature gets an answer: yes, no, there but closed to me, unclear; limits (characters, attachments, poll options) as numbers. What can't be asked without changing something (dismissing one notification, muting a thread) is told from what server this is. The last check is kept and shown at once; the answers also tell fedtail which buttons to show."
