name.en = "Flatpak"
note.ru = "`fedtail-X.Y.Z-x86_64.flatpak` в релизе (`flatpak install --user …`): окно Qt на рантайме KDE, синхронизация и языки внутри; манифест — `packaging/flatpak/online.dmesg.fedtail.yml`; на Flathub — когда заявку примут"
