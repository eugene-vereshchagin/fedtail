name.en = "An RPM for Fedora"
note.ru = "`fedtail-X.Y.Z-1.fcNN.noarch.rpm` (`sudo dnf install ./…`) и spec в релизе: Qt из Fedora, WebP, синхронизация и языки — Recommends, GTK и терминал — Suggests; собирается в чистой Fedora в CI (`packaging/rpm.py`); `fedtail --check` там подсказывает `dnf install`"
note.en = "`fedtail-X.Y.Z-1.fcNN.noarch.rpm` (`sudo dnf install ./…`) and the spec in the release: Qt from Fedora, WebP, sync and languages as Recommends, GTK and the terminal as Suggests; built in a clean Fedora in CI (`packaging/rpm.py`); `fedtail --check` there says `dnf install`"

