name.ru = "AppImage"
name.en = "AppImage"
note.ru = "`fedtail-X.Y.Z-x86_64.AppImage`: Python, Qt и терминальный интерфейс внутри, собран на Debian 12; монтируется, а не распаковывается при каждом запуске; обновляется по разнице (`.zsync`, AppImageUpdate); пункт меню — AppImageLauncher, Gear Lever или `--install-desktop` (`packaging/appimage.py`)"
note.en = "`fedtail-X.Y.Z-x86_64.AppImage`: Python, Qt and the terminal interface inside, built on Debian 12; mounted, not unpacked at every start; updates by delta (`.zsync`, AppImageUpdate); a menu entry — AppImageLauncher, Gear Lever or `--install-desktop` (`packaging/appimage.py`)"

