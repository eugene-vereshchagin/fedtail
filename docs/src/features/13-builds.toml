[[feature]]
id = "arch"
status = "has"
android = "na"
android_note.ru = "на телефоне не нужно"
android_note.en = "not a phone thing"
since = "0.23.6"
name.ru = "Пакет для Arch Linux"
name.en = "An Arch Linux package"
note.ru = "`fedtail-X.Y.Z-1-any.pkg.tar.zst` (`sudo pacman -U …`) и PKGBUILD для AUR в релизе: зависимости из репозиториев Arch (PySide6, requests), остальное — optdepends с пояснениями; собирается `makepkg` и проверяется namcap в CI (`packaging/arch.py`); `fedtail --check` там подсказывает `pacman -S`"
note.en = "`fedtail-X.Y.Z-1-any.pkg.tar.zst` (`sudo pacman -U …`) and the AUR's PKGBUILD in the release: dependencies from Arch's repositories (PySide6, requests), the rest as optdepends with what each gives; built with `makepkg` and checked by namcap in CI (`packaging/arch.py`); `fedtail --check` there says `pacman -S`"

[[feature]]
id = "rpm"
