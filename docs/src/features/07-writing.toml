[[feature]]
id = "chain"
status = "has"
android = "has"
since = "0.14.0"
name.ru = "Тред цепочкой"
name.en = "A thread as a chain"
config = "`post.chain`"
api = "`in_reply_to_id`"
others.ru = "Ice Cubes (до пяти постов)"
others.en = "Ice Cubes (up to five posts)"
clients = ["Ice Cubes"]
details.ru = "Строка из одних `---` делит текст на посты: уходят разом, каждый ответом на предыдущий, с той же видимостью, CW и языком; картинки и опрос — у первого. Счётчик знаков считает каждую часть отдельно. `post.chain = false` — `---` остаётся текстом."
details.en = "A line of nothing but `---` splits the text into posts: they go at once, each a reply to the one before, with the same visibility, CW and language; pictures and the poll go with the first. The character counter counts each part on its own. `post.chain = false` — `---` stays text."

[[feature]]
id = "command-line"
status = "has"
android = "has"
since = "0.3.0"
name.ru = "Командная строка как на Point"
name.en = "A command line as on Point"
config = "`ui.command_line`, `post.plain_posts`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail (tut — команды vim-стиля)"
others.en = "only in fedtail (tut — vim-style commands)"
clients = []
details.ru = "Внизу окна (`Ctrl+L`): `#a3f` — открыть, `#a3f текст` — ответить, `S`/`U #a3f` — подписка на тред, `S`/`U @ник` — на человека, `!` — продвинуть, `~` — в закладки, `D` — удалить свой, `@ник` — профиль, `?` — справка. Простой текст без команды — новый пост (`post.plain_posts = false` — только команды, без случайных постов)."
details.en = "At the bottom of the window (`Ctrl+L`): `#a3f` — open, `#a3f text` — reply, `S`/`U #a3f` — subscribe to a thread, `S`/`U @nick` — follow a person, `!` — boost, `~` — bookmark, `D` — delete your own, `@nick` — profile, `?` — help. Plain text without a command — a new post (`post.plain_posts = false` — commands only, no accidental posts)."

[[feature]]
id = "short-ids"
status = "has"
android = "has"
since = "0.18.0"
name.ru = "Короткие имена постов одинаковые на всех устройствах"
name.en = "Short post names the same on every device"
config = "—"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail (на Point — номера постов сервера)"
others.en = "only in fedtail (Point had the server's post numbers)"
clients = []
details.ru = "Имя вроде `#kq3zt` выводится из id поста, поэтому один и тот же пост зовётся одинаково на десктопе, ноутбуке и телефоне — можно продиктовать с одного и открыть на другом. Пять знаков; если два известных поста начинаются одинаково, их имена показываются длиннее. Имена, которые fedtail раздал раньше (три-четыре знака, счётчиком), остаются за своими постами и по-прежнему открываются."
details.en = "A name like `#kq3zt` is derived from the post's id, so the same post is called the same on the desktop, the laptop and the phone — read it out on one, open it on another. Five characters; when two known posts begin the same, their names are shown longer. Names fedtail gave earlier (three or four characters, by a counter) stay with their posts and still open them."

