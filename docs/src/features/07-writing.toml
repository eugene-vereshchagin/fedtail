details.ru = "У видео и звука во вложениях — «Обложка…»: картинка, которую видно до запуска. При правке своего поста его картинки можно заново описать и поставить фокус (в терминале — только описание)."
details.en = "A video or a sound among the attachments gets “Cover…”: a picture shown until it's played. Editing your post, its pictures can be described anew and their focus set (in the terminal — the description only)."

