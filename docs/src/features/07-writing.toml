[[feature]]
id = "invite"
status = "has"
android = "has"
since = "0.16.0"
name.ru = "Позвать в тред"
name.en = "Call someone into a thread"
config = "`post.invite`"
api.ru = "ответ с упоминанием"
api.en = "a reply with a mention"
others.ru = "только в fedtail (в других — руками)"
others.en = "only in fedtail (in others — by hand)"
clients = []
details.ru = "Меню ⋯ у поста → «Позвать в тред…»: ответ на этот пост, в котором пока только «@» и сразу открыт список людей — выбираешь кого (можно нескольких), пишешь пару слов. Названному приходит уведомление, клик — и тред открыт у него, на его сервере, можно отвечать; без страшных ссылок со служебными id. Остальных участников треда не упоминает, у приглашения свой черновик. Если тред не публичный, приглашённый увидит твой ответ, а остальное — только то, что ему и так видно. То же из командной строки: `#a3f @кого глянь`."
details.en = "A post's ⋯ menu → “Call into the thread…”: a reply to this post with only “@” in it so far and the people list open at once — pick whom (several are fine), write a couple of words. The person gets a notification, a click — and the thread is open on their side, on their server, ready for a reply; no scary links with service ids. The thread's other participants aren't mentioned, the call has its own draft. If the thread isn't public, the person called sees your reply, and the rest only as far as they could anyway. The same from the command line: `#a3f @whom take a look`."

[[feature]]
id = "quote-reply"
status = "has"
android = "has"
since = "0.17.0"
name.ru = "Ответ с цитатой, по кусочкам"
name.en = "Reply with quotes, piece by piece"
config = "`post.quote_prefix`"
api.ru = "своё (текст ответа)"
api.en = "own (the reply's text)"
others.ru = "Thunderbird и почтовики — для писем; в клиентах федиверса нет"
others.en = "Thunderbird and mail clients — for mail; no fediverse client"
clients = []
details.ru = "Меню ⋯ у поста → «Ответить с цитатой»: ответ, в котором уже стоит текст поста цитатой (`> `, без упоминаний в начале), а если в посте что-то выделено — только выделенное. Правый клик по выделенному → «Процитировать в ответ». Ответ на этот пост уже открыт — цитата встаёт туда, где курсор, с пустой строкой после: выделил предложение, процитировал, ответил, выделил следующее — и так по всему посту. Начало строк цитаты — `post.quote_prefix`; `\"\"` — без этих пунктов."
details.en = "A post's ⋯ menu → “Reply with quote”: a reply with the post's text already in it as a quote (`> `, the leading mentions left out), or only what's selected in the post. A right click on a selection → “Quote in reply”. With a reply to this post already open, the quote goes where its cursor is, an empty line after it: select a sentence, quote, answer, select the next one — and so on through the post. The quote's line start is `post.quote_prefix`; `\"\"` — no such items."

