details.ru = "`ui.compose = \"inline\"` — панелью внутри главного окна (раскладка клавиатуры не сбрасывается: KDE помнит её для каждого окна); `\"window\"` — отдельным окном. Размер панели — в процентах от окна (`compose_size`), кнопка ⤡ переключает обычный и большой. Черновики сохраняются на лету и переживают закрытие."
details.en = "`ui.compose = \"inline\"` — a panel inside the main window (the keyboard layout isn't reset: KDE keeps it per window); `\"window\"` — a window of its own. The panel's size — in percent of the window (`compose_size`), the ⤡ button switches normal and big. Drafts are saved as you type and survive closing."

