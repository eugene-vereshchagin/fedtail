[[feature]]
id = "resize-images"
status = "has"
android = "has"
since = "0.14.0"
name.ru = "Ужимать картинки под лимит сервера"
name.en = "Shrinking pictures to the server's limit"
config = "`post.resize_images`"
api = "`instance.configuration.media_attachments`"
others = "Fedilab"
clients = ["Fedilab"]
details.ru = "Сервер говорит, какую картинку примет (в пикселях и байтах). Больше — fedtail перед загрузкой уменьшает копию под предел в пикселях и пережимает в JPEG (с прозрачностью — PNG) под предел в байтах, а не получает отказ. Твой файл не трогается, гифки не сплющиваются. `post.resize_images = false` — как есть."
details.en = "The server says what picture it takes (in pixels and bytes). Bigger — before the upload fedtail shrinks a copy to the pixel limit and recompresses it as JPEG (with transparency — PNG) under the byte limit, instead of being refused. Your file isn't touched, gifs aren't flattened. `post.resize_images = false` — as is."

