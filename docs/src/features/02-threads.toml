[[feature]]
id = "thread-subs"
status = "has"
android = "has"
since = "0.2.0"
name.ru = "Подписки на треды, как на Point"
name.en = "Thread subscriptions, as on Point"
config = "`[subs]`: `auto`, `interval_minutes`, `active_days`, `max_threads`, `replies_to_me`, `leave_mutes`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Сервер сообщает только об ответах, где тебя упомянули: если двое отвечают друг другу под твоим постом, ты не узнаешь. fedtail сам перечитывает треды, на которые ты подписан, раз в `threads.interval_minutes` минут (тред, затихший на час, — втрое реже, на сутки — в 12 раз, на трое суток — в 36) и складывает новое в ленту «Подписки». На треды уходит не больше четверти того, что сервер ещё разрешает в этом окне лимита: ленты важнее. Подписаться — в меню ⋯ у поста, кнопкой в заголовке треда или командой `S #a3f` (`U #a3f` — отписаться). `threads.auto` — на что подписываться самому: `\"posts\"` — свои посты, `\"comments\"` — треды, где комментишь; с 0.22 и треды постов, которые ты бустнул (`\"boosts\"`), лайкнул (`\"likes\"`), положил в закладки (`\"bookmarks\"`), процитировал (`\"quotes\"`), где проголосовал (`\"votes\"`), — новое в них с этой минуты. Тред без движения `threads.active_days` дней больше не проверяется; за один заход — не больше `threads.max_threads` тредов. Ответы тебе и так приходят в «Ответы мне»; `subs.replies_to_me = true` — показывать их и в «Подписках». Отписка глушит и упоминания из треда (ответы там сами тегают всех участников); `threads.leave_mutes = false` — отписываться только от «Подписок»."
details.en = "The server tells you only of replies that mention you: if two people answer each other under your post, you won't know. fedtail itself rereads the threads you're subscribed to every `threads.interval_minutes` minutes (a thread quiet for an hour — three times less often, for a day — 12 times, for three days — 36) and puts what's new into the “Subscriptions” lane. Threads take at most a quarter of what the server still allows in its rate-limit window: the lanes come first. Subscribe — in a post's ⋯ menu, with the button in the thread's header or the command `S #a3f` (`U #a3f` — unsubscribe). `threads.auto` — what to subscribe to by itself: `\"posts\"` — your own posts, `\"comments\"` — threads you comment in; since 0.22 also the threads of posts you boosted (`\"boosts\"`), liked (`\"likes\"`), bookmarked (`\"bookmarks\"`), quoted (`\"quotes\"`), voted in (`\"votes\"`) — news in them from then on. A thread quiet for `threads.active_days` days is not checked any more; one round checks at most `threads.max_threads` threads. Replies to you come to “Replies to me” anyway; `subs.replies_to_me = true` — show them in “Subscriptions” too. Unsubscribing mutes the thread's mentions as well (replies there tag everyone in it by themselves); `threads.leave_mutes = false` — leave “Subscriptions” only."

[[feature]]
id = "mute-thread"
status = "has"
android = "has"
since = "0.11.0"
name.ru = "Заглушить тред"
name.en = "Mute a thread"
config = "—"
api.ru = "`statuses/:id/mute` и своё"
api.en = "`statuses/:id/mute` and own"
others = "Mastodon web, Tusky, Ivory"
clients = ["Mastodon web", "Tusky", "Ivory"]
details.ru = "Уведомления из треда перестают приходить, подписка на него снимается. Сервер, который это умеет, помнит для всех клиентов; где не умеет (GoToSocial), fedtail глушит тред сам: упоминания из него отбрасываются по мере прихода — даже ответы на посты треда, которых он не видел. Пункт в меню ⋯ поста есть всегда."
details.en = "Notifications from the thread stop coming and its subscription goes. A server that can do it remembers it for all clients; where it can't (GoToSocial), fedtail mutes the thread itself: its mentions are dropped as they come — even replies to posts of the thread it never saw. The item in a post's ⋯ menu is always there."

[[feature]]
id = "long-form"
