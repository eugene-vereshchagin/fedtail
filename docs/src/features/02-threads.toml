others.ru = "Phanpy — отступами; номера только в fedtail"
others.en = "Phanpy — indented; numbers only in fedtail"
clients = ["Phanpy"]
details.ru = "Тред открывается деревом: каждый ответ под тем, на что он отвечает, у каждого коммента номер `/1`, `/2`, `/2/1`, как на Point и Juick. По номеру к комменту можно обратиться из командной строки."
details.en = "A thread opens as a tree: every reply under what it answers, every comment numbered `/1`, `/2`, `/2/1`, as on Point and Juick. The command line can address a comment by its number."

[[feature]]
id = "reply-context"
status = "has"
since = "0.1.0"
name.ru = "Над ответом — на что он отвечает"
name.en = "Over a reply — what it answers"
config = "`feed.show_reply_context`"
api = "`in_reply_to_id`"
others.ru = "Sengi и Megalodon — похоже"
others.en = "Sengi and Megalodon — similar"
