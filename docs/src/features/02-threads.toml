[[feature]]
id = "thread-report"
status = "has"
android = "partly"
android_note.ru = "клавиш ] [ − на телефоне нет; остальное — как везде"
android_note.en = "no ] [ − keys on a phone; the rest as everywhere"
since = "0.21.0"
name.ru = "Треды: откуда ответы, сам дорастает, только подписки, по веткам, «Вокруг поста»"
name.en = "Threads: where replies come from, growing by itself, only the followed, by branch, \"Around this post\""
config = "`threads.thread_from`, `threads.thread_recheck_minutes`, `threads.thread_recheck_for_minutes`, `threads.thread_followed_only`, `threads.thread_progress`, `card.around_post`"
api.ru = "`statuses/<id>/context`; ActivityPub-коллекция ответов на сервере автора; `timelines/home` с `max_id`/`min_id`"
api.en = "`statuses/<id>/context`; the replies collection on the author's server; `timelines/home` with `max_id`/`min_id`"
others.ru = "Fedilab, Ivory, Mona (режимы треда), Tuba (сам проверяет), Pipilo (только подписки), Voyager, Thunder (ветки), Subway Tooter (вокруг поста)"
others.en = "Fedilab, Ivory, Mona (thread modes), Tuba (checks by itself), Pipilo (only the followed), Voyager, Thunder (branches), Subway Tooter (around a post)"
clients = ["Fedilab", "Ivory", "Tuba"]
details.ru = "`thread_from`: \"local\" — только то, что знает твой сервер; \"mixed\" — сразу, недостающее подтягивается с сервера автора и тред дорастает; \"remote\" — сначала сервер автора, тред открывается полным. `thread_recheck_minutes` — открытый тред сам переспрашивает о новых ответах. `thread_followed_only` — только ответы подписок и твои (и то, на что они отвечали). В треде `]` / `[` — по комментариям верхнего уровня, `-` — свернуть ветку (окно). `thread_progress` — в шапке треда «⇣ дотягиваю ответы: 3 из 12», потом сколько дотянул. `card.around_post` — пункт меню поста «Вокруг этого поста»: что было в Ленте прямо до и после него."
details.en = "`thread_from`: \"local\" — only what your server knows; \"mixed\" — at once, the missing ones fetched from the author's server and the thread grows; \"remote\" — the author's server first, the thread opens whole. `thread_recheck_minutes` — an open thread asks about new replies by itself. `thread_followed_only` — only the replies of people you follow and yours (and what they answer). In a thread `]` / `[` — between top-level comments, `-` — fold a branch (the window). `thread_progress` — \"⇣ fetching replies: 3 of 12\" in the thread's head, then how many came. `card.around_post` — the post menu's \"Around this post\": what was in Home just before and after it."

[[feature]]
id = "commented-posts"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Комментарии: тред — одна карточка, открывается на первом новом"
name.en = "Comments: a thread a card, opened at the first new comment"
config.ru = "лента `commented` в наборе fedtail (остальным — из набора extra); `view = \"threads\"` и `threads_shown` у своей ленты"
config.en = "the `commented` lane in fedtail's set (the others: the extra set); `view = \"threads\"` and `threads_shown` on a lane of your own"
api.ru = "своё"
api.en = "own"
others.ru = "Point (подписки), Juick"
others.en = "Point (subscriptions), Juick"
details.ru = "Твои посты, треды, где комментировал (`subs.auto`), и подписанные руками: по карточке на тред, под ней «14 комментов · 1 новый · кто: «…»». Щелчок открывает тред сразу на первом новом комментарии. В наборе fedtail (с 0.22) — все такие треды, а те, где есть новое, собраны вместе там, где начинается чтение, за чертой «дальше новое» (при «новое сверху» — над чертой «дальше прочитанное»): `threads_shown = \"all\"`. В наборе extra — как на Point, только треды с новым: прочитанный остаётся, пока ты в ленте, и уходит, когда вернёшься. В наборе fedtail показана по умолчанию, в остальных включается в редакторе лент; то же самое — `view = \"threads\"` у своей ленты из правил."
details.en = "Your posts, threads you commented in (`subs.auto`) and those followed by hand: a card a thread, under it \"14 comments · 1 new · who: “…”\". A click opens the thread right at the first new comment. In fedtail's set (since 0.22) every such thread, those with something new together where reading starts, past the \"new below\" line (newest first — over the \"read below\" line): `threads_shown = \"all\"`. In the extra set, as on Point, only the threads with news: one read stays while you're in the lane and goes when you come back. Shown by default in fedtail's set, turned on in the lane editor for the others; the same thing — `view = \"threads\"` on a lane of rules of your own."

[[feature]]
id = "open-at"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Где открывается тред: на посте или на первом новом комменте"
name.en = "Where a thread opens: at the post or at the first new comment"
config.ru = "`threads.open_at`; у ленты из правил — свой `open_at`"
config.en = "`threads.open_at`; a lane of rules — its own `open_at`"
api.ru = "своё"
api.en = "own"
others.ru = "Point, Juick (не клиенты федиверса)"
others.en = "Point, Juick (not fediverse clients)"
clients = []
details.ru = "Одна настройка для всех карточек: `\"post\"` — тред встаёт на посте, `\"first_unread\"` — на первом непрочитанном комментарии (нет такого — на посте). Лента из правил может решить за себя («Посты с комментами» — к первому новому); строка «🔔 N новых в треде» всегда ведёт к первому новому. Во всех интерфейсах и на телефоне."
details.en = "One setting for every card: `\"post\"` — the thread stands at the post, `\"first_unread\"` — at the first unread comment (none — at the post). A lane of rules may decide for itself (\"Commented posts\" — at the first new one); \"🔔 N new in the thread\" always goes to the first new one. Every interface and the phone."

[[feature]]
id = "watch-replies"
status = "has"
android = "has"
since = "0.22.0"
name.ru = "Следить за ответами на все посты человека"
name.en = "Following the replies to all of someone's posts"
config = "`people.watch_replies`"
api.ru = "своё (его посты и `/context` их тредов)"
api.en = "own (their posts and their threads' `/context`)"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Редкое: видеть, кто отвечает какому-то аккаунту — например своему боту. С `people.watch_replies = true` в профиле появляется «Следить за ответами на все его посты»: треды его последних 10 постов сразу в подписках, каждого нового — как только круг его принесёт (его посты спрашиваются каждый круг). Ответы идут в ленты подписанных тредов — «Комментарии», «Подписки». Выключено по умолчанию — нет и кнопки."
details.en = "A rare one: seeing who answers some account — a bot of yours, say. With `people.watch_replies = true` a profile has \"Follow replies to all their posts\": their latest 10 posts' threads followed at once, each new one's as soon as a round brings it (their posts are asked every round). The replies go to the lanes of followed threads — Comments, Subscriptions. Off by default — not even the button."
