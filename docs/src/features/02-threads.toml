[[feature]]
id = "thread-subs"
status = "has"
since = "0.2.0"
name.ru = "Подписки на треды, как на Point"
name.en = "Thread subscriptions, as on Point"
config = "`[subs]`: `auto`, `interval_minutes`, `active_days`, `max_threads`, `replies_to_me`, `leave_mutes`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Сервер сообщает только об ответах, где тебя упомянули: если двое отвечают друг другу под твоим постом, ты не узнаешь. fedtail сам перечитывает треды, на которые ты подписан, раз в `subs.interval_minutes` минут и складывает новое в ленту «Подписки». Подписаться — в меню ⋯ у поста, кнопкой в заголовке треда или командой `S #a3f` (`U #a3f` — отписаться). `subs.auto` — на что подписываться самому: `\"posts\"` — свои посты, `\"comments\"` — треды, где комментишь. Тред без движения `subs.active_days` дней больше не проверяется; за один заход — не больше `subs.max_threads` тредов. Ответы тебе и так приходят в «Ответы мне»; `subs.replies_to_me = true` — показывать их и в «Подписках». Отписка глушит и упоминания из треда (ответы там сами тегают всех участников); `subs.leave_mutes = false` — отписываться только от «Подписок»."
details.en = "The server tells you only of replies that mention you: if two people answer each other under your post, you won't know. fedtail itself rereads the threads you're subscribed to every `subs.interval_minutes` minutes and puts what's new into the “Subscriptions” lane. Subscribe — in a post's ⋯ menu, with the button in the thread's header or the command `S #a3f` (`U #a3f` — unsubscribe). `subs.auto` — what to subscribe to by itself: `\"posts\"` — your own posts, `\"comments\"` — threads you comment in. A thread quiet for `subs.active_days` days is not checked any more; one round checks at most `subs.max_threads` threads. Replies to you come to “Replies to me” anyway; `subs.replies_to_me = true` — show them in “Subscriptions” too. Unsubscribing mutes the thread's mentions as well (replies there tag everyone in it by themselves); `subs.leave_mutes = false` — leave “Subscriptions” only."

[[feature]]
id = "mute-thread"
status = "has"
since = "0.11.0"
name.ru = "Заглушить тред"
name.en = "Mute a thread"
config = "—"
api.ru = "`statuses/:id/mute` и своё"
api.en = "`statuses/:id/mute` and own"
others = "Mastodon web, Tusky, Ivory"
clients = ["Mastodon web", "Tusky", "Ivory"]
details.ru = "Уведомления из треда перестают приходить, подписка на него снимается. Сервер, который это умеет, помнит для всех клиентов; где не умеет (GoToSocial), fedtail глушит тред сам: упоминания из него отбрасываются по мере прихода — даже ответы на посты треда, которых он не видел. Пункт в меню ⋯ поста есть всегда."
details.en = "Notifications from the thread stop coming and its subscription goes. A server that can do it remembers it for all clients; where it can't (GoToSocial), fedtail mutes the thread itself: its mentions are dropped as they come — even replies to posts of the thread it never saw. The item in a post's ⋯ menu is always there."

[[feature]]
id = "long-form"
status = "has"
since = "0.14.0"
name.ru = "Длинные тексты и события"
name.en = "Long texts and events"
config = "`feed.long_form`"
api.ru = "⋯ → «📄 Читать целиком»: `Article`, `Page`, `Event` с сервера автора"
api.en = "⋯ → “📄 Read it whole”: `Article`, `Page`, `Event` from the author's server"
others = "—"
activitypub = true
details.ru = "Статьи из WriteFreely, Ghost, Plume, посты Lemmy, события Mobilizon. Mastodon API сплющивает их в обычный пост с обрезанным текстом. В меню ⋯ такого поста есть «📄 Читать целиком»: fedtail берёт полный текст напрямую по ActivityPub с сервера автора, у события — ещё время и место."
details.en = "Articles from WriteFreely, Ghost, Plume, Lemmy posts, Mobilizon events. The Mastodon API flattens them into an ordinary post with the text cut. The ⋯ menu of such a post has “📄 Read it whole”: fedtail takes the full text straight from the author's server over ActivityPub, for an event — also the time and the place."

