details.en = "Over a reply in a lane, a strip “↪ in reply to…” with the start of the original post; a click opens the whole thread. No reply in a lane hangs as a scrap."

[[feature]]
id = "complete-threads"
status = "has"
since = "0.3.0"
name.ru = "Тред целиком: ответы с сервера автора"
name.en = "A whole thread: replies from the author's server"
config = "`feed.complete_threads`"
api.ru = "коллекция `replies` по ActivityPub, `search?resolve=true`"
api.en = "the `replies` collection over ActivityPub, `search?resolve=true`"
others.ru = "только в fedtail (Mastodon 4.5+ умеет это на сервере)"
others.en = "only in fedtail (Mastodon 4.5+ does it on the server)"
clients = []
activitypub = true
details.ru = "Твой сервер знает только те ответы, что до него дошли, поэтому чужие треды бывают с дырами. Открыл тред — fedtail читает список ответов прямо с сервера автора и просит твой сервер подтянуть недостающие; тред дорастает сам через пару секунд. Запросы к чужим серверам — без твоего токена. `false` — довольствоваться тем, что знает свой сервер."
details.en = "Your server knows only the replies that reached it, so other people's threads have holes. Open a thread — fedtail reads the list of replies straight from the author's server and asks your server to fetch what's missing; the thread grows by itself a couple of seconds later. Requests to other servers go without your token. `false` — make do with what your own server knows."

[[feature]]
id = "async-refresh"
status = "has"
since = "0.8.0"
name.ru = "Тред дорастает, когда Mastodon дособрал ответы"
name.en = "A thread grows when Mastodon has gathered the replies"
config = "`feed.complete_threads`"
api.ru = "заголовок `Mastodon-Async-Refresh`"
api.en = "the `Mastodon-Async-Refresh` header"
others = "Mastodon web"
clients = ["Mastodon web"]
activitypub = true
details.ru = "Mastodon 4.5+ сам дособирает ответы и сообщает, когда готово; fedtail ждёт этого сигнала и перечитывает тред."
