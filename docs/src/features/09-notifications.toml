clients = ["Mastodon web", "Ivory", "Phanpy"]
details.ru = "Заявки стоят сверху Активности с кнопками «Одобрить» / «Отклонить» (в терминале — a / d), считаются в её числе; × их не трогает. Отдельная лента «Заявки» по умолчанию больше не нужна; если её включить — заявки в ней, а не в Активности."
details.en = "Requests stand on top of Activity with “Approve” / “Reject” (in the terminal — a / d), counted in its number; × leaves them be. The “Follow requests” lane isn't among the defaults any more; with it on, requests are there, not in Activity."
