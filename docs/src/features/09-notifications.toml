api.ru = "своё"
api.en = "own"
others = "Tokodon"
clients = ["Tokodon"]
details.ru = "В трее и на кнопке в панели задач (KDE: нужна запись от `--install-desktop` и `python3-pyside6.qtdbus`). Какие ленты считать — списком, как в уведомлениях: `\"lists\"` — все списки, `\"list:Друзья\"` — один, `\"all\"` — всё, плюс `icon_count_except` — что не считать. Сама иконка — опоссум, обнявший свой хвост (`app_icon = \"possum\"`, он же в меню и в «О программе»), или нарисованный пузырь-тред (`\"bubble\"`), который `themed_icon` красит в цвета темы."
details.en = "In the tray and on the task bar button (KDE: needs the entry from `--install-desktop` and `python3-pyside6.qtdbus`). Which lanes to count — a list, as for notifications: `\"lists\"` — all lists, `\"list:Friends\"` — one, `\"all\"` — everything, plus `icon_count_except` — what not to count. The icon itself — an opossum holding its own tail (`app_icon = \"possum\"`, also in the menu and in About), or the drawn thread bubble (`\"bubble\"`), which `themed_icon` paints in the theme's colours."

