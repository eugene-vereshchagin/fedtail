# Notifications and activity — a chapter of docs/{ru,en}/features.md; built by tools/docs_build.py

id = "notifications"
title.ru = "Уведомления и активность"
title.en = "Notifications and activity"

[[feature]]
id = "desktop-notify"
status = "has"
android = "has"
since = "0.2.0"
name.ru = "Уведомления рабочего стола с уровнями приватности"
name.en = "Desktop notifications with privacy levels"
config = "`[notify]`: `enabled`, `lanes`, `except`, `privacy`, `when_focused`, `backend`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail (Tokodon — без приватности)"
others.en = "only in fedtail (Tokodon — without privacy)"
clients = []
details.ru = "О каких лентах уведомлять — `notify.lanes` (те же имена, что в `[lanes]`; `\"lists\"` — все списки, `\"list:Друзья\"` — один, `\"all\"` — обо всём); о каких никогда — `notify.except` (чёрный список поверх `lanes`, например при `[\"all\"]`). `privacy`: `\"full\"` — кто и что, `\"sender\"` — только кто (можно читать при посторонних), `\"count\"` — только сколько. О ленте, открытой перед глазами, по умолчанию молчит (`when_focused`). `backend`: `\"auto\"` (notify-send, иначе трей), `\"desktop\"`, `\"tray\"`."
details.en = "Which lanes to notify about — `notify.lanes` (the same names as in `[lanes]`; `\"lists\"` — all lists, `\"list:Friends\"` — one, `\"all\"` — everything); which never — `notify.except` (a blacklist over `lanes`, say with `[\"all\"]`). `privacy`: `\"full\"` — who and what, `\"sender\"` — only who (fine to read with others around), `\"count\"` — only how many. About the lane in front of your eyes it keeps quiet by default (`when_focused`). `backend`: `\"auto\"` (notify-send, else the tray), `\"desktop\"`, `\"tray\"`."

[[feature]]
id = "activity"
status = "has"
android = "has"
since = "0.2.0"
name.ru = "Активность: лайки, бусты, подписки"
name.en = "Activity: likes, boosts, follows"
config = "`activity.types`"
api = "`/api/v1/notifications`"
others.ru = "у всех"
others.en = "everyone"
clients = ["all"]
details.ru = "Лента «Активность»: кто лайкнул, продвинул, подписался, закончился опрос, отредактирован пост, который ты продвигал, новый пост под колокольчиком — с временем каждого события. `[\"all\"]` — всё, что есть и что добавится."
details.en = "The “Activity” lane: who liked, boosted, followed, a poll ended, a post you boosted was edited, a new post under a bell — with the time of each event. `[\"all\"]` — everything there is and what will be added."

[[feature]]
id = "grouping"
status = "has"
android = "has"
since = "0.2.0"
name.ru = "Группировка уведомлений"
name.en = "Grouping notifications"
config = "`activity.types`, `activity.server_groups`"
api.ru = "своя группировка; с 0.18 — и серверная, `/api/v2/notifications` (Mastodon 4.3+)"
api.en = "its own grouping; since 0.18 the server's too, `/api/v2/notifications` (Mastodon 4.3+)"
details.ru = "Соседние уведомления одного вида об одном посте — одна строка: кто (первые несколько, «и ещё N»), что, когда. Где сервер группирует сам (Mastodon 4.3+), fedtail берёт его группы: 300 лайков одного поста — один запрос и одна строка со счётом, а не 300 уведомлений восемью страницами; × у такой строки убирает с сервера всю группу. GoToSocial и Mastodon постарше группировать не умеют — там fedtail группирует сам, как раньше. `activity.server_groups = false` — всегда самому."
details.en = "Neighbouring notifications of one kind about one post are one row: who (the first few, “and N more”), what, when. Where the server groups them itself (Mastodon 4.3+), fedtail takes its groups: 300 likes of one post are one request and one row with the count, not 300 notifications in eight pages; × on such a row dismisses the whole group on the server. GoToSocial and older Mastodon can't group — there fedtail groups them itself, as before. `activity.server_groups = false` — always itself."
others = "Mastodon web, Ivory, Phanpy, Ice Cubes"
clients = ["Mastodon web", "Ivory", "Phanpy", "Ice Cubes"]

