name.en = "Severed relationships and moderators' warnings"
config = "`activity.server_notices`"
api.ru = "уведомления `severed_relationships`, `moderation_warning`"
api.en = "notifications `severed_relationships`, `moderation_warning`"
others = "Mastodon web"
clients = ["Mastodon web"]
details.ru = "Когда твой сервер блокирует чужой (или наоборот) и твои подписки рвутся, Mastodon присылает уведомление со списком потерь; модераторы могут прислать предупреждение. fedtail показывает их в «Активности» (`activity.server_notices`)."
details.en = "When your server blocks another one (or the other way round) and your follows are cut, Mastodon sends a notification with the list of what was lost; moderators may send a warning. fedtail shows them in “Activity” (`activity.server_notices`)."

