[[feature]]
id = "activity-filters"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Быстрые фильтры Активности"
name.en = "Activity's quick filters"
config.ru = "— (выбор держится до закрытия программы)"
config.en = "— (the choice holds till the program closes)"
api.ru = "своё"
api.en = "own"
others = "—"
clients = []
details.ru = "Над Активностью: Всё · Лайки и бусты · Подписчики (кто подписался и отписался) · Заявки (ждут твоего ответа) · Моё (на кого подписался ты) · Прочее (опросы, правки, посты важных людей, сообщения сервера). В вебе — вкладки места, в терминале — `s`. Только те фильтры, где может что-то быть: заявки в подписчики своей лентой (и ответов, ждущих одобрения, нет) — без «Заявок»; без `activity.my_follows` — без «Моего»."
details.en = "Over Activity: All · Likes & boosts · Followers (who followed and who stopped) · Requests (waiting for your answer) · Mine (whom you followed) · Other (polls, edits, important people's posts, the server's notices). On the web page — the place's tabs, in the terminal — `s`. Only the filters that can show something: follow requests in a lane of their own (and no approvals waiting) — no “Requests”; without `activity.my_follows` — no “Mine”."

[[feature]]
id = "unfollows"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Кто отписался"
name.en = "Who stopped following you"
config = "`activity.unfollows`, `activity.unfollows_minutes`, `activity.unfollows_max`, `activity.unfollows_mass`, `activity.unlikes`, `activity.unlikes_days`, `activity.unlikes_posts`"
api = "`accounts/:id/followers`, `accounts/relationships`"
others.ru = "только в fedtail (сервер этого не сообщает)"
others.en = "only in fedtail (no server says it)"
clients = []
details.ru = "Раз в час fedtail сверяет весь список подписчиков с прошлым: кого нет в двух списках подряд и кто, если спросить, не подписан, — строка «отписался» в «Активности»; учётки, которой больше нет, — «пропал». Чтобы не врать: список, пришедший не целиком (меньше, чем сервер насчитал), выбрасывается; первый снимок — начало, без событий; кого убрал или заблокировал ты сам — не новость; больше `unfollows_mass` с одного сервера разом — одна строка про сервер. Лента из правил берёт это как `event = \"unfollow\"` (`\"unfollowed_back\"` — на кого подписан и ты), `\"gone\"`, `\"lost\"`. Переехавший подписчик — «переехал», не отписка (`\"moved\"`). С `activity.unlikes` — и снятые лайки (`\"unliked\"`): последние `unlikes_posts` твоих постов за `unlikes_days` дней, запрос на пост — поэтому выключено. Пост, удалённый на своём сервере, помечается на карточке."
details.en = "Every hour fedtail compares the whole list of your followers with the last one: missing from two lists in a row and not following when asked — a row “stopped following you” in Activity; an account that is no more — “gone”. So as not to lie: a list that didn't come whole (fewer than the server counts) is thrown away; the first snapshot is the start, no events; the ones you removed or blocked yourself aren't news; more than `unfollows_mass` of one server at once — one row about the server. A lane of rules takes them as `event = \"unfollow\"` (`\"unfollowed_back\"`: one you follow too), `\"gone\"`, `\"lost\"`. A follower who moved is “moved”, not an unfollow (`\"moved\"`). With `activity.unlikes` — likes taken back too (`\"unliked\"`): your last `unlikes_posts` posts of `unlikes_days` days, a request a post — so it is off. A post deleted on its server is marked on its card."

[[feature]]
id = "my-follows"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "В Активности — на кого подписался ты"
name.en = "Activity says whom you followed"
config = "`activity.my_follows`"
api.ru = "своё (и `accounts/:id/following`)"
api.en = "own (and `accounts/:id/following`)"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Подписался — в «Активности» строка «@кто — ты подписался», рядом с тем, что делали другие: видно, что делал сам. И если подписался в другом клиенте — fedtail заметит по списку подписок (раз в 6 часов). Числа непрочитанного не даёт; × убирает только здесь. Лента из правил берёт это как `event = \"i_followed\"`."
details.en = "Followed someone — Activity has a row “@who — you followed”, beside what others did: what you did yourself is there. Followed in another client — fedtail notices it in whom you follow (every 6 hours). No unread number for it; × takes it away here only. A lane of rules takes it as `event = \"i_followed\"`."

[[feature]]
id = "dm-newcomer"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Новый человек в личной беседе — видно сразу"
name.en = "Someone new in a private talk — shown at once"
config.ru = "—"
config.en = "—"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Личное сообщение, которое отвечает на личное и приводит в беседу того, кого в нём не было (автор или упомянутый), помечено строкой «👤 Новый в личной беседе: @кто» — он теперь читает и это сообщение, и то, что в нём процитировано. В окне ответа то же до отправки: пишешь личный ответ и добавляешь `@кого-то` не из беседы — под текстом «👤 Добавишь в личную беседу: @кто». Сравнивается с сообщением, на которое ответ: кто его написал и кого оно упоминало."
details.en = "A private message that answers a private one and brings in someone who wasn't in it (its author or one it mentions) is marked “👤 New in this private talk: @who” — they now read this message and whatever it quotes. The reply box says the same before sending: write a private answer adding `@someone` from outside the talk, and under the text — “👤 You add to the private talk: @who”. Compared with the message answered: who wrote it and whom it mentioned."

[[feature]]
id = "push"
status = "has"
android = "has"
since = "0.20.0"
name.ru = "Push-уведомления (Web Push, UnifiedPush)"
name.en = "Push notifications (Web Push, UnifiedPush)"
status_note.ru = "Web Push в веб-версии, UnifiedPush на Android"
status_note.en = "Web Push in the web version, UnifiedPush on Android"
config = "`phone.push`"
api = "`/api/v1/push/subscription`"
others = "Mastodon web, Elk, Phanpy, Tusky, Ivory"
clients = ["Mastodon web", "Elk", "Phanpy", "Tusky", "Ivory"]
details.ru = "Веб-страница подписывает браузер на push прямо у твоего сервера (≡ → «Push-уведомления…»): уведомления приходят и с закрытой вкладкой, и при выключенном fedtail. Нужен https или localhost. Телефон — через UnifiedPush (`phone.push = \"auto\"`): если стоит дистрибьютор (ntfy, Sunup, NextPush…), сервер пушит в него, приложение просыпается и делает круг — уведомления те же, что у окон (`notify.lanes`, `notify.privacy`); без дистрибьютора — круг раз в 15 минут. Окнам и терминалу push не нужен — им хватает живого потока и опроса."
details.en = "The web page subscribes the browser to push right at your server (≡ → “Push notifications…”): notifications come with the tab closed and fedtail off. Needs https or localhost. The phone — through UnifiedPush (`phone.push = \"auto\"`): with a distributor installed (ntfy, Sunup, NextPush…) the server pushes to it, the app wakes and does a round — the same notes as the windows' (`notify.lanes`, `notify.privacy`); without one — a round every 15 minutes. The windows and the terminal don't need push — the live stream and polling are enough."

