id = "approvals"
status = "has"
android = "has"
since = "0.13.0"
name.ru = "Одобрить ответ, лайк, буст (GoToSocial)"
name.en = "Approve a reply, like, boost (GoToSocial)"
config = "`activity.approvals`"
api = "`/api/v1/interaction_requests`"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Запросы на взаимодействие, ждущие одобрения по твоим настройкам кто-может-что, приходят с кнопками «Одобрить» и «Отклонить»."
details.en = "Interaction requests waiting for approval under your who-may-do-what settings come with “Approve” and “Reject” buttons."

[[feature]]
id = "filtered-notify"
status = "has"
android = "has"
since = "0.9.0"
name.ru = "Уведомления от незнакомцев отдельно"
name.en = "Notifications from strangers apart"
config = "`notify.filtered`"
api = "`/api/v2/notifications/policy`, `notifications/requests`"
others = "Mastodon 4.3+"
clients = ["Mastodon web"]
details.ru = "Mastodon придерживает упоминания от незнакомых и новых аккаунтов, пока не разрешишь. ≡ → «Для нежных и ранимых» → «Отфильтрованные уведомления…»: кто ждёт, «Пустить» / «Отклонить», что фильтровать. `\"remind\"` — ещё и строкой при запуске, `\"menu\"` — только в меню, `\"off\"` — никак."
details.en = "Mastodon holds back mentions from unknown and new accounts until you allow them. ≡ → “For the tender and sensitive” → “Filtered notifications…”: who waits, “Let in” / “Dismiss”, what to filter. `\"remind\"` — also a line at start, `\"menu\"` — in the menu only, `\"off\"` — not at all."

