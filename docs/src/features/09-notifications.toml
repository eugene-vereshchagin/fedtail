name.en = "“Of them new”: what the last update brought"
config.ru = "на плитках телефона, в боковой панели окон, веба и терминала"
config.en = "on the phone's tiles, in the sidebar of the windows, the web page and the terminal"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "У счётчика непрочитанного — помельче, сколько из них принесло последнее обновление, которое что-то принесло: «300» и под ним «из них новых 56» на плитке телефона, «300 +56» в боковой панели (слова — в подсказке). Прочитанное из пачки из этого числа уходит. С медленным режимом — ровно то, что пришло последней пачкой."
details.en = "Beside the unread count, smaller — how many of them the last update that brought anything brought: “300” with “56 of them new” under it on the phone's tile, “300 +56” in the sidebar (the words on hover). What's read of the batch leaves the number. With slow mode — exactly what the last batch brought."

