details.en = "`fedtail lanes`, `fedtail show replies -n 20`, `fedtail tail` (the new as it comes), `fedtail post \"text\"`, `fedtail post --reply a3f \"text\"`, `fedtail read replies`. The same profile, database and read marks as the window; works without Qt."

[[feature]]
id = "android"
status = "partly"
android = "has"
since = "0.19.0"
name.ru = "Android: телефон и планшет"
name.en = "Android: a phone and a tablet"
config = "`[phone]`: `overview`, `layout`"
others.ru = "Tusky, Fedilab, Moshidon"
others.en = "Tusky, Fedilab, Moshidon"
clients = ["Tusky", "Fedilab"]
details.ru = "APK в каждом релизе (`fedtail-X.Y.Z-android.apk`), dev-сборки из CI. Нативные экраны (Kotlin, Jetpack Compose) поверх того же ядра на Python, что у десктопа. Дом — обзор лент: плитками по четыре в ряд — какие и в каком порядке, выбирается долгим нажатием и переезжает на другие устройства синхронизацией (`sync.tiles`) — или списком с первым непрочитанным (`phone.overview`), «Читать подряд» — сначала то, что тебе. В ленте — ленты с новым полоской, переключатель с поиском, в конце «дочитана → дальше» и свайп туда. Треды деревом, ответ, лайк, картинки с просмотром, видео и звук своим плеером; все места меню ≡ окон (поиск, списки, фильтры, тишина, тренды, сервер, справка, правка профиля, аккаунты), профили с их кнопками, закреплёнными и «ещё» до самого их сервера, меню ⋯ окон на каждой карточке, голосование, цитаты; редактор — картинки с описаниями, предупреждение, язык, опрос, правка и цитата. Обновить — ⟳ на каждом экране и потянуть: сверху, а при чтении «форумом» (старые сверху) — снизу вверх, место в ленте не прыгает. Уведомления — в шторку (как `notify.*` окон), с закрытым приложением — раз в 15 минут. Темы окон — цветами (`ui.theme`); настройки — страницей (каждая опция конфига с пояснением, пишется в тот же файл) или самим файлом, синхронизация прочитанного. На планшете — две или три колонки, как на десктопе (`phone.layout`). Командная строка Point на телефоне выключена (`ui.command_line`)."
details.en = "An APK in every release (`fedtail-X.Y.Z-android.apk`), dev builds from CI. Native screens (Kotlin, Jetpack Compose) over the same Python core the desktop runs. Home is the overview of lanes: tiles four in a row — which and in which order is picked with a long press and travels to the other devices with sync (`sync.tiles`) — or a list with each lane's first unread post (`phone.overview`), “Read in a row” — yours first. In a lane — the lanes with news as a strip, a switcher with a search, “read → next” at the end and a swipe there. Threads as trees, replies, likes, pictures with a viewer, video and sound in a player of its own; every place of the windows' ≡ menu (search, lists, filters, silence, trends, the server, help, editing the profile, accounts), profiles with their buttons, pinned posts and “more” as far back as their own server, the windows' ⋯ menu on every card, voting, quotes; the editor — pictures with descriptions, a warning, the language, a poll, edits and quotes. Refresh — ⟳ on every screen and a pull: from the top, or, read “as a forum” (oldest first), up from the bottom; the place in the lane doesn't jump. Notifications into the shade (the windows' `notify.*`), with the app closed — every 15 minutes. The windows' themes as colours (`ui.theme`); settings as a page (each option of the config with its explanation, written into the same file) or the file itself, read marks synced. On a tablet — two or three columns, as on the desktop (`phone.layout`). Point's command line is off on the phone (`ui.command_line`)."

[[feature]]
id = "tui"
status = "has"
android = "na"
android_note.ru = "на телефоне не нужно"
android_note.en = "not a phone thing"
since = "0.10.0"
name.ru = "Терминальный интерфейс (Textual)"
name.en = "A terminal interface (Textual)"
config = "`ui.frontend = \"tui\"`, `[tui]`: `theme`, `lanes_width`, `show_context`, `pictures`, `picture_rows`, `viewer`, `video`"
others = "tut"
clients = ["tut"]
details.ru = "Слева ленты, справа посты, внизу командная строка. Те же клавиши, `x` — лента прочитана, `:` — командная строка. Ленты — `[` / `]`, цифры `1`…`9`, `h` — в список лент (там `j` / `k`), `l` — обратно в посты, Tab — туда-сюда. «Активность» и «Заявки» — свои строки (в заявках `a` — пустить, `d` — отказать). Картинки — первая маленькой прямо в ленте (`tui.pictures`, `tui.picture_rows`), `v` — все во весь экран, ← / → между ними, `o` — оригинал в браузере; нужен Pillow (`python3-pil`). С 0.19 — настоящие (sixel в Konsole, WezTerm, foot; протокол kitty в kitty), если стоит `textual-image`, иначе полублоками в любом терминале с truecolor; если есть `chafa`, `timg` или `icat` из kitty, `v` отдаёт картинку им, а интерфейс отступает до Enter (`tui.viewer`). Видео и гифки играет `mpv` (с 0.19): в своём окне на рабочем столе, по ssh — прямо в терминале (sixel, kitty или цветным текстом); нет mpv — браузер (`tui.video`). Работает по ssh. Нужен `python3-textual`."
details.en = "Lanes on the left, posts on the right, the command line at the bottom. The same keys, `x` — the lane is read, `:` — the command line. Lanes — `[` / `]`, digits `1`…`9`, `h` — into the lane list (`j` / `k` there), `l` — back to the posts, Tab — to and fro. “Activity” and “Follow requests” have rows of their own (in requests `a` — accept, `d` — reject). Pictures — the first one small right in the lane (`tui.pictures`, `tui.picture_rows`), `v` — all of them full screen, ← / → between them, `o` — the original in the browser; needs Pillow (`python3-pil`). Since 0.19 real ones (sixel in Konsole, WezTerm, foot; the kitty protocol in kitty) with `textual-image` installed, half blocks in any true colour terminal otherwise; with `chafa`, `timg` or kitty's `icat` there, `v` hands the picture to them, the interface stepping aside until Enter (`tui.viewer`). Video and gifs play in `mpv` (since 0.19): in a window of their own on a desktop, right in the terminal over ssh (sixel, kitty or coloured text); no mpv — the browser (`tui.video`). Works over ssh. Needs `python3-textual`."

[[feature]]
id = "web"
status = "has"
android = "na"
android_note.ru = "на телефоне не нужно"
android_note.en = "not a phone thing"
since = "0.10.0"
name.ru = "Веб на localhost"
name.en = "Web on localhost"
config = "`ui.frontend = \"web\"`, `[web]`: `host`, `port`, `open_browser`"
others.ru = "Phanpy, Elk — веб-клиенты"
others.en = "Phanpy, Elk — web clients"
clients = ["Phanpy", "Elk"]
details.ru = "fedtail во вкладке браузера: ленты, треды деревом, профили, кнопка «Написать» (предупреждение, кому видно, язык, черновики), картинки сеткой с просмотром, видео и звук, опросы с голосованием, карточки ссылок, цитаты, свои эмодзи, «Ещё» в конце ленты, командная строка Point; на телефоне ленты выезжают сбоку, светлая и тёмная тема — как в системе. При запуске печатается одноразовая ссылка (15 минут); браузер получает ключ из папки профиля в cookie (`web.key`; удалишь — выйдут все браузеры и старые ссылки с ключом). `host = \"0.0.0.0\"` — и с телефона в домашней сети; без шифрования, только для своей сети. Меню ≡ (написать, мой профиль, обновить, всё прочитано, справка, клавиши, о программе); меню ⋯ у поста — то же, что в окнах Qt и GTK, теми же пунктами в том же порядке (с 0.18: открыть, скопировать ссылку, #id и ник, ответить с цитатой, позвать в тред, закладка, кто процитировал, подписаться / заглушить тред, заглушить / заблокировать автора и сервер, пожаловаться, исправить, закрепить, удалить, удалить и переписать — рискованное с вопросом); кнопки профиля — тоже как в окнах (подписаться, колокольчик, бусты и языки в «Ленте», упомянуть, заглушить, заблокировать, убрать из читателей, рекомендовать, заметка). В ответе виден весь пост: выделил кусок — «❝ Процитировать в ответ» ставит его туда, где курсор. Картинки поста листаются в просмотре стрелками ← / →."
details.en = "fedtail in a browser tab: lanes, threads as trees, profiles, a “Write” button (content warning, who sees it, language, drafts), pictures in a grid with a viewer, video and audio, polls with voting, link cards, quotes, custom emoji, “More” at a lane's end, the Point command line; on a phone the lanes slide in from the side, light and dark follow the system. At start a one-time link (15 minutes) is printed; the browser gets a key from the profile's folder in a cookie (`web.key`; delete it and every browser and every old link with the key is out). `host = \"0.0.0.0\"` — from the phone on the home network too; no encryption, for your own network only. The ≡ menu (write, my profile, refresh, all read, help, keys, about); a post's ⋯ menu — the same as the Qt and GTK windows', the same items in the same order (since 0.18: open, copy the link, the #id and the handle, reply with quote, call into the thread, bookmark, who quoted, subscribe / mute the thread, mute / block the author and the server, report, edit, pin, delete, delete and redraft — the risky ones ask first); a profile's buttons as in the windows too (follow, the bell, boosts and languages in Home, mention, mute, block, remove from followers, endorse, a note). A reply shows the whole post: select a piece and “❝ Quote in reply” puts it where the cursor is. The viewer goes through a post's pictures with ← / →."

[[feature]]
id = "tui-full"
status = "partly"
android = "na"
android_note.ru = "на телефоне не нужно"
android_note.en = "not a phone thing"
since = "0.19.0"
name.ru = "Терминал — всё, что в окнах"
name.en = "The terminal — everything the windows have"
config = "`ui.frontend = \"tui\"`, `tui.sound`"
size.ru = "крупный (0.19, продолжается)"
size.en = "large (0.19, going on)"
details.ru = "С 0.19: меню поста `.` (⋯) — те же пункты, что в окнах, и делают то же (ссылки — через общий `common/links.py`, «уверен?» — вопросом); меню `g` (≡) — все места: поиск (`/`), списки, теги, тишина, отфильтрованные, запланированные, заявки, активность, тренды, рекомендации, каталог, о сервере, правка профиля, справка (Markdown, ссылки между страницами), «что нового», о программе, состояние федерации, отчёт для разбора, проверка звука; профиль — кнопки окон под цифрами `1`…`9`; редактор поста `w` (предупреждение, кому видно, язык, черновики — как в окнах; Ctrl+O — вложения с описанием, «чувствительное», опрос, позже; Ctrl+S — отправить); лента — как в окнах: разделитель «дальше новое», `s` — все / только посты / новое, лентой / беседами, что показывать; карточка говорит словами окон (кто продвинул, изменён, старый, на что ответ, «ты ответил», цитата, реакции); поиск по ленте Ctrl+F (ещё раз — к следующему, `N` — к предыдущему, `D` — глубже, по всему сохранённому, `E` — во всех лентах, Esc — закрыть); `J` — к новому, `j` за последним постом — старее с сервера; опрос — `u`: голосовать (Пробел, Enter), `r` — результаты, обновить; тред — сколько ответов, `c` — все предупреждения разом, `s` — следить, «приходит, потому что…»; разделы ленты сворачиваются (Enter на заголовке, состояние общее с окнами); редактор — счётчик, «цепочка из N постов», подсказка #CamelCase, Ctrl+R — предпросмотр, Ctrl+O — «Другой язык…», «Выкинуть» (с вопросом), напоминание об описании картинок; просмотр картинок — `s` сохраняет оригинал в `ui.save_dir`; уведомления — notify-send, а без рабочего стола кодом терминала (kitty, Ghostty, WezTerm, foot, iTerm2); ≡ → «Отладка» — уголок, проверка уведомления, перепись, отдать память, трассировка, снимок, конфиг и папка данных, «все аккаунты в одном окне» (и «⇄ @аккаунт» на карточке). Места — те же, что в вебе (`common/places.py`). Поведение сверяется с окнами общим сценарием (`tools/behaviour.py`). Чего ещё нет — `tools/parity.py`."
details.en = "Since 0.19: a post's menu `.` (⋯) — the windows' items, doing the same (links through the shared `common/links.py`, “sure?” asked); the `g` menu (≡) — every place: search (`/`), lists, tags, silence, held-back notifications, scheduled, follow requests, activity, trends, suggestions, the directory, the server, editing my profile, the help (Markdown, links between its pages), what's new, about, the federation status, a bug report, testing the sound; a profile — the windows' buttons under `1`…`9`; the post editor `w` (the warning, who sees it, the language, drafts — as in the windows; Ctrl+O — attachments with descriptions, “sensitive”, a poll, later; Ctrl+S — send); a lane as in the windows: the “new below” divider, `s` — all / posts only / new, feed / conversations, what to show; a card in the windows' words (who boosted, edited, old, what it answers, “you replied”, the quote, reactions); find in the lane Ctrl+F (again — the next one, `N` — the one before, `D` — deeper, through everything stored, `E` — in every lane, Esc — closed); `J` — to the new, `j` past the last post — older ones from the server; a poll — `u`: vote (Space, Enter), `r` — the results, refresh; a thread — how many answers, `c` — every warning at once, `s` — follow it, “comes because…”; the lane list's sections fold (Enter on a heading, one state with the windows); the editor — the count, “a chain of N posts”, the #CamelCase hint, Ctrl+R — preview, Ctrl+O — “Another language…”, “Discard” (asked first), the alt-text reminder; the picture viewer — `s` saves the original into `ui.save_dir`; notifications — notify-send, and without a desktop the terminal's own code (kitty, Ghostty, WezTerm, foot, iTerm2); ≡ → “Debugging” — the corner, a test notification, the census, giving memory back, tracing, a snapshot, the config and the data folder, “every account in one window” (and “⇄ @account” on a card). The places are the web's (`common/places.py`). The behaviour is held against the windows by one scenario (`tools/behaviour.py`). What's still missing — `tools/parity.py`."

[[feature]]
id = "web-full"
status = "partly"
android = "na"
android_note.ru = "на телефоне не нужно"
android_note.en = "not a phone thing"
since = "0.19.0"
name.ru = "Веб — всё, что в окнах"
name.en = "The web — everything the windows have"
config = "`ui.frontend = \"web\"`"
size.ru = "крупный (0.19, продолжается)"
size.en = "large (0.19, going on)"
details.ru = "С 0.19 в меню ≡ — все места (с 0.20 меню — окно поверх страницы с группами, как подменю окон, и места открываются окном поверх страницы): поиск (`/`), списки (новый, переименовать, эксклюзивный, состав, удалить), теги, тишина (фильтры по словам, заглушённые, заблокированные, серверы), отфильтрованные уведомления, запланированные, заявки, активность, тренды, рекомендации, каталог, о сервере, правка профиля, справка прямо на странице, «что нового», о программе, состояние федерации; «Активность» и «Заявки» — с группами и кнопками окон; в меню ⋯ — «Добавить в список», «Читать целиком», «Перевести»; в профиле — все кнопки окон (списки, кого читает, читатели, правка своего); поиск по ленте Ctrl+F; над лентой — «все / только посты / новое», «лентой / беседами», «что показывать», «к новому», разделитель «дальше новое»; карточка словами окон (кто продвинул и когда, изменён → версии, старый, на что ответ, «ты ответил», цитата, реакции); редактор — картинки и файлы с описанием (и вставкой), «чувствительное», опрос, отложенная отправка, языки, счётчик по лимиту сервера; уведомления браузера (≡ → «Уведомления в браузере» — разрешить) теми же словами, что у окон (`notify.privacy`); звуки темы. Места — те же, что в терминале (`common/places.py`). Поведение сверяется с окнами общим сценарием (`tools/behaviour.py`). Чего ещё нет — `tools/parity.py`."
details.en = "Since 0.19 the ≡ menu has every place (since 0.20 the menu is a window over the page, in groups as the windows' submenus, and the places open in a window over the page): search (`/`), lists (new, rename, exclusive, members, delete), tags, silence (word filters, muted, blocked, servers), held-back notifications, scheduled, follow requests, activity, trends, suggestions, the directory, the server, editing my profile, the help right on the page, what's new, about, the federation status; “Activity” and “Follow requests” have the windows' groups and buttons; the ⋯ menu has “Add to list”, “Read it whole”, “Translate”; a profile has all the windows' buttons (lists, whom they follow, followers, editing my own); find in the lane Ctrl+F; over the lane — “all / posts only / new”, “feed / conversations”, “show”, “to new”, the “new below” divider; a card in the windows' words (who boosted and when, edited → versions, old, what it answers, “you replied”, the quote, reactions); the editor — pictures and files with descriptions (pasted too), “sensitive”, a poll, sending later, the languages, the count against the server's limit; the browser's notifications (≡ → “Notifications in the browser” — allow) in the windows' words (`notify.privacy`); the theme's sounds. The places are the terminal's (`common/places.py`). The behaviour is held against the windows by one scenario (`tools/behaviour.py`). What's still missing — `tools/parity.py`."

[[feature]]
id = "gtk"
status = "has"
android = "na"
android_note.ru = "на телефоне не нужно"
android_note.en = "not a phone thing"
since = "0.17.0"
name = "GTK4 + libadwaita"
config = "`ui.frontend = \"gtk\"`, `ui.adwaita`"
others = "Tuba"
clients = ["Tuba"]
details.ru = "Чтобы выглядело родным в GNOME и прочих GTK-столах. Есть: вход, ленты по группам с числом непрочитанного, посты карточками (лицо, контекст ответа, предупреждение под катом, картинки, результаты опроса, цитата, карточка ссылки, «ты ответил»), кнопки и меню поста — те же, что в Qt, с вопросом перед рискованным, «увиденное — прочитано», «Всё прочитано», «раньше», треды во вкладках, написать / ответить / процитировать / позвать / исправить с черновиками, видимостью, предупреждением, картинками с подписями, опросом и автодополнением по Tab, командная строка Point (Ctrl+L), профили во вкладках, «Активность», заявки, уведомления, темы fedtail. С 0.18 ещё: поиск по ленте (Ctrl+F), раскладка split, просмотрщик картинок, справка панелью, голосование в опросах, перевод поста, «читать целиком», история правок, жалоба, кто лайкнул и бустнул, цитаты моего поста, «прочитано до сюда», профиль со всеми кнопками Qt и правкой своего, цитаты с объяснением, почему не показаны. Ещё с 0.18: шапка треда (подписка, «открыть все CW», почему видны ответы), профиль листается назад и дальше — с сервера автора, закреплённые и избранное в профиле, списки (добавить, состав, переименовать, удалить, эксклюзивный), группы тегов, подписка и «на мой профиль» у тега, объявления сервера, «шторка» по Esc, видеоплеер поверх окна (нужен `libgtk-4-media-gstreamer`), трей (StatusNotifierItem по D-Bus), выделение текста с «Процитировать в ответ», карточка контакта при наведении в split, фокус и подпись картинки, отметка аккаунта в общем окне, картинки и файлы в пост перетаскиванием и из буфера (Ctrl+V, скриншоты тоже; брошенные на окно — новый пост с ними). В deb-пакете GTK — в «Рекомендует», окно GTK — пункт «FedTail (GTK)» по правому клику на значке в меню. Что есть в Qt и нет в GTK — `tools/parity.py` (кроме подсказок к пунктам меню — у GTK их нет). Нужны `python3-gi gir1.2-gtk-4.0`, libadwaita (`gir1.2-adw-1`) — по желанию."
details.en = "To look native in GNOME and other GTK desktops. It has: login, lanes in groups with their unread counts, posts as cards (the face, what a reply answers, the content warning, pictures, a poll's results, the quoted post, the link's card, “you replied”), the post's buttons and menu — the same as Qt's, asking before the risky ones, seen means read, “All read”, “earlier”, threads in tabs, writing / replying / quoting / calling in / correcting with drafts, who sees it, the warning, pictures with descriptions, a poll and Tab completion, the Point command line (Ctrl+L), profiles in tabs, Activity, follow requests, notifications, fedtail's themes. Since 0.18 also: find in the lane (Ctrl+F), the split layout, the picture viewer, help as a panel, voting in polls, translating a post, “read it whole”, an edit's history, reporting, who liked and boosted, quotes of my post, “read up to here”, a profile with all of Qt's buttons and editing my own, quotes saying why one can't be shown. Also since 0.18: a thread's header (subscribe, “open every CW”, why its replies show), a profile paging back and on — from the author's server, pinned posts and featured on a profile, lists (add, members, rename, delete, exclusive), groups of tags, a tag's follow and “feature on my profile”, the server's announcements, the curtain on Esc, a video player over the window (needs `libgtk-4-media-gstreamer`), the tray (StatusNotifierItem over D-Bus), selecting text with “Quote in reply”, a contact card on hover in split, a picture's focus point and description, the account mark in the merged window, pictures and files into a post by dragging and from the clipboard (Ctrl+V, screenshots too; dropped on the window — a new post with them). In the deb package GTK is in Recommends, and the GTK window is “FedTail (GTK)” on a right click on the menu entry. What Qt has and GTK doesn't — `tools/parity.py` (but menu items' tooltips: GTK menus have none). Needs `python3-gi gir1.2-gtk-4.0`; libadwaita (`gir1.2-adw-1`) is optional."

