[[feature]]
id = "gtk"
status = "has"
since = "0.17.0"
name = "GTK4 + libadwaita"
config = "`ui.frontend = \"gtk\"`, `ui.adwaita`"
others = "Tuba"
clients = ["Tuba"]
details.ru = "Чтобы выглядело родным в GNOME и прочих GTK-столах. Есть: вход, ленты по группам с числом непрочитанного, посты карточками (лицо, контекст ответа, предупреждение под катом, картинки, результаты опроса, цитата, карточка ссылки, «ты ответил»), кнопки и меню поста — те же, что в Qt, с вопросом перед рискованным, «увиденное — прочитано», «Всё прочитано», «раньше», треды во вкладках, написать / ответить / процитировать / позвать / исправить с черновиками, видимостью, предупреждением, картинками с подписями, опросом и автодополнением по Tab, командная строка Point (Ctrl+L), профили во вкладках, «Активность», заявки, уведомления, темы fedtail. С 0.18 ещё: поиск по ленте (Ctrl+F), раскладка split, просмотрщик картинок, справка панелью, голосование в опросах, перевод поста, «читать целиком», история правок, жалоба, кто лайкнул и бустнул, цитаты моего поста, «прочитано до сюда», профиль со всеми кнопками Qt и правкой своего, цитаты с объяснением, почему не показаны. Ещё с 0.18: шапка треда (подписка, «открыть все CW», почему видны ответы), профиль листается назад и дальше — с сервера автора, закреплённые и избранное в профиле, списки (добавить, состав, переименовать, удалить, эксклюзивный), группы тегов, подписка и «на мой профиль» у тега, объявления сервера, «шторка» по Esc, видеоплеер поверх окна (нужен `libgtk-4-media-gstreamer`), трей (StatusNotifierItem по D-Bus), выделение текста с «Процитировать в ответ», карточка контакта при наведении в split, фокус и подпись картинки, отметка аккаунта в общем окне, картинки и файлы в пост перетаскиванием и из буфера (Ctrl+V, скриншоты тоже; брошенные на окно — новый пост с ними). В deb-пакете GTK — в «Рекомендует», окно GTK — пункт «fedtail (GTK)» по правому клику на значке в меню. Что есть в Qt и нет в GTK — `tools/parity.py` (кроме подсказок к пунктам меню — у GTK их нет). Нужны `python3-gi gir1.2-gtk-4.0`, libadwaita (`gir1.2-adw-1`) — по желанию."
details.en = "To look native in GNOME and other GTK desktops. It has: login, lanes in groups with their unread counts, posts as cards (the face, what a reply answers, the content warning, pictures, a poll's results, the quoted post, the link's card, “you replied”), the post's buttons and menu — the same as Qt's, asking before the risky ones, seen means read, “All read”, “earlier”, threads in tabs, writing / replying / quoting / calling in / correcting with drafts, who sees it, the warning, pictures with descriptions, a poll and Tab completion, the Point command line (Ctrl+L), profiles in tabs, Activity, follow requests, notifications, fedtail's themes. Since 0.18 also: find in the lane (Ctrl+F), the split layout, the picture viewer, help as a panel, voting in polls, translating a post, “read it whole”, an edit's history, reporting, who liked and boosted, quotes of my post, “read up to here”, a profile with all of Qt's buttons and editing my own, quotes saying why one can't be shown. Also since 0.18: a thread's header (subscribe, “open every CW”, why its replies show), a profile paging back and on — from the author's server, pinned posts and featured on a profile, lists (add, members, rename, delete, exclusive), groups of tags, a tag's follow and “feature on my profile”, the server's announcements, the curtain on Esc, a video player over the window (needs `libgtk-4-media-gstreamer`), the tray (StatusNotifierItem over D-Bus), selecting text with “Quote in reply”, a contact card on hover in split, a picture's focus point and description, the account mark in the merged window, pictures and files into a post by dragging and from the clipboard (Ctrl+V, screenshots too; dropped on the window — a new post with them). In the deb package GTK is in Recommends, and the GTK window is “fedtail (GTK)” on a right click on the menu entry. What Qt has and GTK doesn't — `tools/parity.py` (but menu items' tooltips: GTK menus have none). Needs `python3-gi gir1.2-gtk-4.0`; libadwaita (`gir1.2-adw-1`) is optional."

