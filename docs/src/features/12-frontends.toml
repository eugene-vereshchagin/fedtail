# Interfaces — a chapter of docs/{ru,en}/features.md; built by tools/docs_build.py

id = "frontends"
title.ru = "Интерфейсы"
title.en = "Interfaces"
intro.ru = """
Ядро не знает про GUI; интерфейсы — плагины. Какой запускать — `ui.frontend` или `--ui` на
один раз."""
intro.en = "The core knows nothing about a GUI; interfaces are plugins. Which one to start — `ui.frontend`, or `--ui` for one run."

[[feature]]
id = "qt"
status = "has"
since = "0.1.0"
name.ru = "Окно на Qt"
name.en = "A Qt window"
config = "`ui.frontend = \"qt\"`"
others.ru = "основной"
others.en = "the main one"

[[feature]]
id = "cli"
status = "has"
since = "0.9.0"
name.ru = "Команды в терминале"
name.en = "Commands in a terminal"
config = "`[cli]`: `enabled`, `color`, `max_lines`, `tail_lanes`"
others = "tut (TUI), toot (CLI)"
clients = ["tut"]
details.ru = "`fedtail lanes`, `fedtail show comments -n 20`, `fedtail tail` (новое по мере прихода), `fedtail post \"текст\"`, `fedtail post --reply a3f \"текст\"`, `fedtail read comments`. Тот же профиль, база и прочитанное, что у окна; работает без Qt."
details.en = "`fedtail lanes`, `fedtail show replies -n 20`, `fedtail tail` (the new as it comes), `fedtail post \"text\"`, `fedtail post --reply a3f \"text\"`, `fedtail read replies`. The same profile, database and read marks as the window; works without Qt."

[[feature]]
id = "tui"
status = "has"
since = "0.10.0"
name.ru = "Терминальный интерфейс (Textual)"
name.en = "A terminal interface (Textual)"
config = "`ui.frontend = \"tui\"`, `[tui]`: `theme`, `lanes_width`, `show_context`, `pictures`, `picture_rows`"
others = "tut"
clients = ["tut"]
details.ru = "Слева ленты, справа посты, внизу командная строка. Те же клавиши, `x` — лента прочитана, `:` — командная строка. Ленты — `[` / `]`, цифры `1`…`9`, `h` — в список лент (там `j` / `k`), `l` — обратно в посты, Tab — туда-сюда. «Активность» и «Заявки» — свои строки (в заявках `a` — пустить, `d` — отказать). Картинки рисуются полублоками: первая — маленькой прямо в ленте (`tui.pictures`, `tui.picture_rows`), `v` — все во весь экран, ← / → между ними, `o` — оригинал в браузере; нужен Pillow (`python3-pil`) и терминал с truecolor. Работает по ssh. Нужен `python3-textual`."
details.en = "Lanes on the left, posts on the right, the command line at the bottom. The same keys, `x` — the lane is read, `:` — the command line. Lanes — `[` / `]`, digits `1`…`9`, `h` — into the lane list (`j` / `k` there), `l` — back to the posts, Tab — to and fro. “Activity” and “Follow requests” have rows of their own (in requests `a` — accept, `d` — reject). Pictures are drawn with half blocks: the first one small right in the lane (`tui.pictures`, `tui.picture_rows`), `v` — all of them full screen, ← / → between them, `o` — the original in the browser; needs Pillow (`python3-pil`) and a true colour terminal. Works over ssh. Needs `python3-textual`."

[[feature]]
id = "web"
status = "has"
since = "0.10.0"
name.ru = "Веб на localhost"
name.en = "Web on localhost"
config = "`ui.frontend = \"web\"`, `[web]`: `host`, `port`, `open_browser`"
others.ru = "Phanpy, Elk — веб-клиенты"
others.en = "Phanpy, Elk — web clients"
clients = ["Phanpy", "Elk"]
details.ru = "fedtail во вкладке браузера: ленты, треды деревом, профили, кнопка «Написать» (предупреждение, кому видно, язык, черновики), картинки сеткой с просмотром, видео и звук, опросы с голосованием, карточки ссылок, цитаты, свои эмодзи, «Ещё» в конце ленты, командная строка Point; на телефоне ленты выезжают сбоку, светлая и тёмная тема — как в системе. При запуске печатается одноразовая ссылка (15 минут); браузер получает ключ из папки профиля в cookie (`web.key`; удалишь — выйдут все браузеры и старые ссылки с ключом). `host = \"0.0.0.0\"` — и с телефона в домашней сети; без шифрования, только для своей сети. Меню ≡ (написать, мой профиль, обновить, всё прочитано, справка, клавиши, о программе) и меню ⋯ у поста (ответить с цитатой, подписаться / отписаться / заглушить тред, скопировать ссылку, удалить свой пост). В ответе виден весь пост: выделил кусок — «❝ Процитировать в ответ» ставит его туда, где курсор. Картинки поста листаются в просмотре стрелками ← / →."
details.en = "fedtail in a browser tab: lanes, threads as trees, profiles, a “Write” button (content warning, who sees it, language, drafts), pictures in a grid with a viewer, video and audio, polls with voting, link cards, quotes, custom emoji, “More” at a lane's end, the Point command line; on a phone the lanes slide in from the side, light and dark follow the system. At start a one-time link (15 minutes) is printed; the browser gets a key from the profile's folder in a cookie (`web.key`; delete it and every browser and every old link with the key is out). `host = \"0.0.0.0\"` — from the phone on the home network too; no encryption, for your own network only. The ≡ menu (write, my profile, refresh, all read, help, keys, about) and a post's ⋯ menu (reply with quote, subscribe / leave / mute the thread, copy the link, delete my post). A reply shows the whole post: select a piece and “❝ Quote in reply” puts it where the cursor is. The viewer goes through a post's pictures with ← / →."

[[feature]]
id = "gtk"
status = "partly"
since = "0.17.0"
name = "GTK4 + libadwaita"
status_note.ru = "каркас"
status_note.en = "a frame"
config = "`ui.frontend = \"gtk\"`, `ui.adwaita`"
others = "Tuba"
clients = ["Tuba"]
details.ru = "Чтобы выглядело родным в GNOME и прочих GTK-столах. Пока каркас: вход, ленты по группам с числом непрочитанного, посты карточками (контекст ответа, предупреждение под катом, вложения строкой), «увиденное — прочитано», «Всё прочитано», «раньше», треды во вкладках, ★ и ♻, темы fedtail. Писать, картинки, меню поста и остальное — по этапам [GTK.md](/docs/GTK.md); полное окно пока — Qt. Нужны `python3-gi gir1.2-gtk-4.0`, libadwaita (`gir1.2-adw-1`) — по желанию."
details.en = "To look native in GNOME and other GTK desktops. A frame so far: login, lanes in groups with their unread counts, posts as cards (what a reply answers, the content warning, attachments as a line), seen means read, “All read”, “earlier”, threads in tabs, ★ and ♻, fedtail's themes. Writing, pictures, the post menu and the rest come stage by stage ([GTK.md](/docs/GTK.md), in Russian); the full window is Qt for now. Needs `python3-gi gir1.2-gtk-4.0`; libadwaita (`gir1.2-adw-1`) is optional."

