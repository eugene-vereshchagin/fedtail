others.en = "everyone"
clients = ["all"]
details.ru = "Подписаться, отписаться, принять или отклонить заявку в подписчики (лента «Заявки»)."
details.en = "Follow, unfollow, accept or reject a follow request (the “Follow requests” lane)."

[[feature]]
id = "per-person-follow"
status = "has"
android = "has"
since = "0.14.0"
name.ru = "Скрыть бусты человека; языки подписки"
name.en = "Hide a person's boosts; the languages of a follow"
config = "`feed.per_person_follow`"
api.ru = "`follow` с `reblogs=false`, `languages[]`"
api.en = "`follow` with `reblogs=false`, `languages[]`"
others = "Mastodon web, Tusky, tut"
clients = ["Mastodon web", "Tusky", "tut"]
details.ru = "В профиле того, на кого подписан: «♻ без его бустов» и «🌐 языки» — только его посты на этих языках. Хранит сервер, так что действует во всех клиентах."
details.en = "On the profile of someone you follow: “♻ without their boosts” and “🌐 languages” — only their posts in these languages. The server keeps it, so it works in every client."

[[feature]]
id = "mute-block-filters"
status = "has"
android = "has"
since = "0.3.0"
name.ru = "Скрыть, заблокировать, фильтры слов"
name.en = "Mute, block, word filters"
config = "—"
api = "`mutes`, `blocks`, `/api/v2/filters`"
others.ru = "у всех"
others.en = "everyone"
clients = ["all"]
details.ru = "Фильтры слов — серверные, v2: где действуют, на сколько, прятать или сворачивать. Всё это — в меню ≡ → «Для нежных и ранимых»: фильтры по словам, заглушённые, заблокированные, заблокированные серверы и отфильтрованные уведомления; при `ui.arts_mode` сверху строка о том, что фильтры сервера там не действуют."
details.en = "Word filters are the server's, v2: where they apply, for how long, hide or fold. All this — in the ≡ menu → “For the tender and sensitive”: word filters, muted, blocked, blocked servers and filtered notifications; with `ui.arts_mode`, a line on top says the server's filters don't apply there."

[[feature]]
id = "mute-timed"
status = "has"
android = "has"
since = "0.20.0"
name.ru = "Заглушить на время; только посты"
name.en = "Mute for a while; posts only"
config = "—"
api = "`accounts/:id/mute` `duration`, `notifications`"
others = "Mastodon web, Ivory, Fedilab"
clients = ["Mastodon web", "Ivory", "Fedilab"]
details.ru = "«Заглушить» спрашивает, насколько: навсегда, на час, на сутки, на неделю, на месяц — потом сервер снимет заглушку сам. Галочка «Только посты» оставляет его уведомления. Фильтры слов тоже ставятся на срок."
details.en = "“Mute” asks for how long: for good, an hour, a day, a week, a month — then the server lifts it by itself. The “Posts only” tick keeps their notifications coming. Word filters get a term too."

[[feature]]
id = "hide-post"
status = "has"
android = "has"
since = "0.20.0"
name.ru = "Скрыть один пост"
name.en = "Hide a single post"
config = "—"
api = "`/api/v2/filters/:id/statuses`"
others = "Mastodon web"
clients = ["Mastodon web"]
details.ru = "«Скрыть этот пост» в меню ⋯: пост уходит сразу и везде — в серверный фильтр «fedtail: hidden posts», так что его не видно и в других клиентах. Вернуть — в «Для нежных и ранимых» убрать фильтр. Если сервер так не умеет (Mastodon до 4.0), пункта нет."
details.en = "“Hide this post” in the ⋯ menu: the post goes at once and everywhere — into the server's filter “fedtail: hidden posts”, so other clients don't show it either. To bring it back, remove the filter in “For the tender and sensitive”. A server that can't (Mastodon before 4.0) gets no such item."

[[feature]]
id = "filter-edit"
status = "has"
android = "has"
since = "0.20.0"
name.ru = "Правка фильтра"
name.en = "Editing a filter"
config = "—"
api = "`PUT /api/v2/filters/:id`"
others = "Mastodon web, Ivory, Fedilab"
clients = ["Mastodon web", "Ivory", "Fedilab"]
details.ru = "У каждого фильтра в «Для нежных и ранимых» — «Изменить…»: название, слова, прятать или сворачивать, где действует и сколько ещё. Убранные слова сервер стирает, новые добавляет."
details.en = "Each filter in “For the tender and sensitive” has “Edit…”: title, words, hide or fold, where it works and for how long more. Words taken out the server drops, new ones it adds."

