[[feature]]
id = "boost-carousel"
status = "wont"
name.ru = "Карусель бустов"
name.en = "Boost carousel"
api.ru = "своё"
api.en = "own"
others = "Phanpy"
clients = ["Phanpy"]
why.ru = "Вбок неудобно читать, плохо стыкуется с «ничего не прыгает» и прочитанным. Бусты прячутся фильтром, по человеку или списком."
why.en = "Sideways is awkward to read, and it fits badly with “nothing jumps” and read marks. Boosts are hidden with the filter, per person or with a list."
details.ru = "Бусты подряд — одной полосой, которую листают вбок (как в Phanpy). Не будем: вбок неудобно читать, и с «ничего не прыгает» и прочитанным она стыкуется плохо. Ту же задачу решают галка «Бусты» в фильтре, «без его бустов» в профиле и ретрансляторы в своём списке."
details.en = "Boosts in a row — as one strip scrolled sideways (as in Phanpy). Won't do: sideways is awkward to read, and it fits badly with “nothing jumps” and read marks. The same job is done by the “Boosts” tick in the filter, “without their boosts” on a profile and relays in a list of their own."

