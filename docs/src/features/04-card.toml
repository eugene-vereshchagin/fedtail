# The post card — a chapter of docs/{ru,en}/features.md; built by tools/docs_build.py

id = "card"
title.ru = "Карточка поста"
title.en = "The post card"

[[feature]]
id = "arts-mode"
status = "has"
android = "has"
since = "0.11.0"
name.ru = "Режим arts"
name.en = "Arts mode"
config.ru = "`ui.arts_mode` (по умолчанию включён, рекомендуется)"
config.en = "`ui.arts_mode` (on by default, recommended)"
others.ru = "одним переключателем ни у кого"
others.en = "nobody has it as one switch"
clients = []
details.ru = """
Всё как автор выложил, без опеки. Включает разом: предупреждения (CW) развёрнуты, «чувствительные» картинки без плашки, фильтры сервера не прячут и не сворачивают посты, пункта «Пожаловаться» нет. Свои мьюты и блоки работают как обычно; то, что режет сам сервер (блоки доменов), до клиента не доходит вовсе — это не обойти. `false` — всё как у всех, и тогда каждая из этих вещей настраивается отдельно (`ui.expand_cw`, `feed.sensitive_media`).
Назван в честь @arts — основателя Point.im и автора его правил. Принцип оттуда же: на взрослой площадке взрослые разбираются сами. Послать можно любого, хоть админа, — и админ может послать в ответ."""
details.en = """
Everything as the author posted it, no nannying. Turns on at once: content warnings (CW) open, “sensitive” pictures without a cover, server filters neither hide nor fold posts, no “Report” item. Your own mutes and blocks work as usual; what the server itself cuts off (domain blocks) never reaches a client — that can't be got round. `false` — everything as everyone has it, and then each of these is set on its own (`ui.expand_cw`, `feed.sensitive_media`).
Named after @arts — the founder of Point.im and the author of its rules. The principle comes from there too: on a grown-up site grown-ups sort things out themselves. Anyone can be told where to go, an admin too — and the admin can say the same back."""

