[[feature]]
id = "honest-counters"
status = "has"
android = "has"
since = "0.2.0"
name.ru = "Честные счётчики"
name.en = "Honest counters"
config.ru = "`feed.honest_counters` (выключен), `feed.counters_via_accounts`"
config.en = "`feed.honest_counters` (off), `feed.counters_via_accounts`"
api.ru = "API сервера автора без токена"
api.en = "the author's server's API without a token"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
activitypub = true
details.ru = "Твой сервер знает только те лайки и бусты, что до него дошли, поэтому цифры у чужих постов занижены. С `honest_counters = true` при открытии треда fedtail спрашивает настоящие числа у сервера автора — без токена, но с твоим IP. Если тот не отдаёт числа без входа, а у тебя есть ещё аккаунты (профили), — `counters_via_accounts` разрешает спросить от их имени: у сервера автора, если ты там есть, или у сервера, где пост уже лежит. Токен каждого аккаунта уходит только на его собственный сервер."
details.en = "Your server knows only the likes and boosts that reached it, so the numbers on other people's posts are low. With `honest_counters = true`, when a thread opens fedtail asks the author's server for the real numbers — without a token, but with your IP. If that server won't give numbers without a login and you have other accounts (profiles), `counters_via_accounts` lets it ask as them: the author's server, if you have an account there, or a server that already has the post. Each account's token goes only to its own server."

