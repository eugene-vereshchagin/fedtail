[[feature]]
id = "debug-log"
status = "has"
android = "partly"
android_note.ru = "лог — в отчёте самопроверки"
android_note.en = "the log comes in the self-check's report"
since = "0.2.0"
name.ru = "Подробный журнал для отчётов об ошибках"
name.en = "A detailed log for bug reports"
config.ru = "`[debug]`, ключи запуска `--debug`, `--bug-report`"
config.en = "`[debug]`, the launch keys `--debug`, `--bug-report`"
api.ru = "своё"
api.en = "own"
others = "—"
details.ru = "В режиме отладки (`mode = \"auto\"` — включён в версиях для разработки, выключен в релизах): журнал запросов, опросов, действий (без текстов постов), ошибки с трассировкой, статистика памяти и потоков раз в `stats_minutes`, сторож зависаний (`watchdog_seconds`, `stall_ms`), медленные запросы, рост памяти. `crash.log` — стеки при падении, `kill -USR1` — стеки по запросу. Логи прошлой версии новая удаляет сама. `--bug-report` собирает архив за двое суток без токена и базы. Подробно — [debugging.md](/docs/ru/dev/debugging.md)."
details.en = "In the debugging mode (`mode = \"auto\"` — on in development versions, off in releases): a log of requests, polls, actions (without the posts' texts), errors with tracebacks, memory and thread stats every `stats_minutes`, a freeze watchdog (`watchdog_seconds`, `stall_ms`), slow requests, memory growth. `crash.log` — the stacks on a crash, `kill -USR1` — the stacks on demand. The new version deletes the old version's logs itself. `--bug-report` packs two days of it, without the token and the database. In detail — [debugging.md](/docs/en/dev/debugging.md)."


[[feature]]
id = "report-repo"
status = "has"
android = "no"
android_note.ru = "отчёт — «Поделиться», не в репозиторий"
android_note.en = "the report is shared, not sent to a repository"
since = "0.19.0"
name.ru = "Отчёт сразу в свой закрытый репозиторий"
name.en = "A bug report straight into your private repository"
config = "`debug.report_repo`, `tools/selfcheck.py --send`"
others = "—"
details.ru = "Задан `debug.report_repo` (`\"user/repo\"` на GitHub или любой git-адрес) — отчёт из меню «Отладка», `--bug-report` и архив ночного selfcheck сами уходят туда по ssh твоими ключами: отдельный коммит в `reports/ГГГГ-ММ/` (`selfcheck/…`). Старые отчёты при этом не скачиваются; ssh ничего не спрашивает — нет ключа или доступа, так и скажет. Репозиторий должен быть закрытым: в отчёте логи и конфиг (токена и базы нет)."
details.en = "With `debug.report_repo` set (`\"user/repo\"` on GitHub or any git address), the report from the Debugging menu, `--bug-report` and the nightly selfcheck's archive go there by themselves over ssh with your own keys: a commit of its own in `reports/YYYY-MM/` (`selfcheck/…`). The older reports aren't downloaded; ssh asks nothing — no key or no access, it says so. The repository must be private: a report holds the logs and the config (never the token or the database)."

[[feature]]
id = "report-issue"
status = "has"
android = "partly"
android_note.ru = "«Поделиться отчётом» из самопроверки"
android_note.en = "“Share the report” from the self-check"
since = "0.19.0"
name.ru = "Сообщить об ошибке на GitHub — с проверкой"
name.en = "Report a bug on GitHub — checked first"
config = "`debug.issue_repo`"
others.ru = "Fedilab, Tusky (письмо разработчику)"
others.en = "Fedilab, Tusky (a mail to the developer)"
details.ru = "≡ → «Сообщить об ошибке на GitHub…» во всех четырёх интерфейсах: черновик issue — что случилось, как повторить, версия, система, последние ошибки журнала. Адреса серверов, ники, IP, токены и пути в нём уже заменены заглушками, и всё это видно до отправки: текст можно поправить. Дальше открывается GitHub со всем вписанным, отправляешь сам. Трекер — самого fedtail или `debug.issue_repo`."
details.en = "≡ → “Report a bug on GitHub…” in all four interfaces: a draft issue — what happened, how to repeat it, the version, the system, the latest errors of the log. Server addresses, nicknames, IPs, tokens and paths are already replaced by placeholders, and all of it is shown before anything leaves: the text can be edited. Then GitHub opens with it all filled in, and you send it yourself. The tracker — fedtail's own, or `debug.issue_repo`."
[[feature]]
id = "federation-status"
status = "has"
android = "no"
android_note.ru = "пока нет"
android_note.en = "not yet"
since = "0.16.0"
name.ru = "Состояние федерации: как живёт моя нода и что не получается"
name.en = "Federation status: how my server is doing and what fails"
config.ru = "≡ → «Отладка» → «Состояние федерации»"
config.en = "≡ → “Debugging” → “Federation status”"
api.ru = "своё (из того, что видел запуск)"
api.en = "own (from what this run saw)"
others = "—"
details.ru = "≡ → «Отладка» → «Состояние федерации»: проблемы, которые от клиента не зависят. Моя нода — что на ней работает, сколько ответов и сколько с ошибкой, как быстро отвечает (обычно и медленные), опрос (когда последний удачный, сколько раз не удался и почему), живой поток (открыт с каких пор, сколько рвался). Чего сервер не умеет (спросил и получил «нет»). Кто ждёт, чтобы попасть в список: имя со ссылкой на профиль (открывается вкладкой, там «Подписаться») и почему ждёт — заявка без ответа, подписки нет (отклонили или отозвали), или уже подписан и добавится сам. Что не получается у моей ноды и у других серверов — сгруппировано по запросу (id свёрнуты: `/api/v1/lists/:id/accounts`), сколько раз, когда последний, и что это скорее всего значит («удалено на том сервере», «не отдаёт чужим без подписи», «в список берут только тех, на кого подписан»…). Другие серверы — кто сколько ответил и с ошибками. Окно обновляется само, пока открыто; «Копировать» — текстом для issue, «Начать счёт заново» — обнулить. Ради окна спрашивается только свой сервер — кто те, кто ждёт в списках; остальное — то, что видел этот запуск. Адреса без параметров, токенов нет."
details.en = "≡ → “Debugging” → “Federation status”: problems that don't depend on the client. My server — what it runs, how many answers and how many with errors, how fast it answers (typical and slow ones), polling (the last good one, how many times it failed and why), the live stream (open since when, how many times it dropped). What the server can't do (asked and got “no”). Who waits to go into a list: the name linked to the profile (opens in a tab, with “Follow”) and why they wait — a request unanswered, no follow (refused or withdrawn), or followed and going in by itself. What fails on my server and on other servers — grouped by request (ids folded: `/api/v1/lists/:id/accounts`), how many times, when last, and what it most likely means (“deleted on that server”, “won't give strangers anything without a signature”, “lists take only people you follow”…). Other servers — who answered how much and with what errors. The window updates by itself while open; “Copy” — as text for an issue, “Count anew” — start from zero. For the window only your own server is asked — who those waiting in lists are; the rest is what this run saw. Addresses without parameters, no tokens."

[[feature]]
id = "leak-hunt"
status = "has"
android = "na"
android_note.ru = "инструмент для компьютера"
android_note.en = "a desktop tool"
since = "0.14.0"
name.ru = "Поиск утечек: тренды, перепись объектов, снимки памяти"
name.en = "Leak hunting: trends, an object census, memory snapshots"
config.ru = "`debug.leak_samples`, `debug.object_census`, `debug.tracemalloc`; ≡ → «Отладка»"
config.en = "`debug.leak_samples`, `debug.object_census`, `debug.tracemalloc`; ≡ → “Debugging”"
api.ru = "своё (gc, tracemalloc)"
api.en = "own (gc, tracemalloc)"
others = "—"
details.ru = "Для запусков на сутки. С каждой строкой статистики — строка `trend`: память, объекты Python, виджеты, карточки, картинки, потоки, файлы — сколько при запуске, сколько сейчас, сколько в час. Что-то росло на каждой из последних `leak_samples` проверок (12 — это час) и не на крохи — предупреждение `possible leak` с цифрами; первые полчаса не считаются. В режиме отладки — перепись: какие объекты Python и виджеты Qt прибавились с прошлой проверки и с запуска (`object_census`). `tracemalloc = true` — трассировка памяти с запуска; снимок — ≡ → «Отладка» → «Снимок памяти»: файл с тем, кто держит больше всего и что выросло, по строкам кода. Там же: «Что растёт: статистика и перепись сейчас», «Отдать свободную память системе», трассировка вкл/выкл. Последняя строка сессии — `session summary`: часы, память, пик, фризы, опросы. Как оставить на ночь — [debugging.md](/docs/ru/dev/debugging.md#ночной-прогон-поиск-утечек)."
details.en = "For days-long runs. With every stats line — a `trend` line: memory, Python objects, widgets, cards, pictures, threads, files — how many at start, how many now, how many an hour. Something that grew on each of the last `leak_samples` checks (12 — an hour) and by more than crumbs — a `possible leak` warning with the numbers; the first half hour doesn't count. In the debugging mode — a census: which Python objects and Qt widgets were added since the last check and since the start (`object_census`). `tracemalloc = true` — memory tracing from the start; a snapshot — ≡ → “Debugging” → “Memory snapshot”: a file with who holds the most and what grew, by line of code. There too: “What grows: stats and census now”, “Give free memory back to the system”, tracing on/off. The session's last line — `session summary`: hours, memory, peak, freezes, polls. How to leave it overnight — [debugging.md](/docs/en/dev/debugging.md)."

[[feature]]
id = "db-cleanup"
status = "has"
android = "has"
since = "0.17.0"
name.ru = "База не растёт без конца: чистка и бюджет места"
name.en = "The database doesn't grow for ever: cleanup and a size budget"
config = "`[storage]`: `max_mb`, `keep_per_lane`, `keep_activity`, `gc_hours`, `grace_hours`"
api = "SQLite, incremental vacuum"
others = "—"
details.ru = "Раз в `gc_hours` (и в первый опрос после запуска) забываются посты, на которые ничто не ссылается: ни лента, ни подписанный тред, ни «Активность», ни черновик ответа. Остаются мои посты, а у оставшихся — пост внутри буста, цитата и родители вверх по всему треду, так что видимые ответы не качаются заново. Сохранённое недавно (открытый тред, профиль) живёт ещё `grace_hours`. «Активность» держит последние `keep_activity` записей. Файл реально худеет (incremental vacuum). Если база всё равно больше `max_mb` (по умолчанию 1 ГБ), ленты становятся на 30 % короче, пока не влезут (не короче 300), а когда места снова много — отрастают до `keep_per_lane`. Короткие id (`#a3f`) не забываются никогда. Что забыто и сколько весит база — строка `storage gc` в журнале."
details.en = "Every `gc_hours` (and at the first poll after start) posts nothing points at are forgotten: no lane, followed thread, “Activity” entry or reply draft. My own posts stay, and so do the boosted post, the quoted one and the parents up the whole thread of every post that stays, so visible replies aren't fetched again. Whatever was stored recently (an open thread, a profile) lives `grace_hours` more. “Activity” keeps the latest `keep_activity` entries. The file really shrinks (incremental vacuum). If the database is still over `max_mb` (1 GB by default), lanes get 30 % shorter until it fits (never below 300) and grow back to `keep_per_lane` once there is room. Short ids (`#a3f`) are never forgotten. What was forgotten and how big the database is — the `storage gc` line in the log."

