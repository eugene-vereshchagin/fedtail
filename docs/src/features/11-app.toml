details.ru = "Панель в главном окне, как у панели поста: оглавление слева, поиск по всей справке, «Назад» и «Вперёд». Коротко, по разделам, и в конце каждого — «Подробно →» в полный список возможностей и справочник настроек: они лежат тут же и работают без сети. Горячей клавиши нет нарочно — F1 рядом с Esc."
