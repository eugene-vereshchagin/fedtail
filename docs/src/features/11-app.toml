# The application — a chapter of docs/{ru,en}/features.md; built by tools/docs_build.py

id = "app"
title.ru = "Приложение"
title.en = "The application"

[[feature]]
id = "themes"
status = "has"
android = "partly"
android_note.ru = "одна тема («спокойная»), светлая и тёмная по телефону"
android_note.en = "one theme (“calm”), light and dark as the phone is"
since = "0.1.0"
name.ru = "Темы файлами"
name.en = "Themes as files"
config = "`ui.theme`, `ui.font_size`, `ui.fonts`, `ui.font`, `ui.mono_font`, `ui.max_width`, `ui.sidebar_width`, `ui.actions`"
api.ru = "свой формат TOML"
api.en = "a TOML format of its own"
others.ru = "у других — светлая и тёмная, у Ice Cubes и Megalodon — свои цвета"
others.en = "others — light and dark, Ice Cubes and Megalodon — colours of your own"
clients = ["Ice Cubes", "Megalodon"]
details.ru = "Встроенные: `system` (как в KDE), `terminal`, `juick`, `juick-classic`, `bnw`, `point`, `night`, `contrast` (для слабого зрения), `pink`, `nord`, `solarized`, `paper`, `qip-retro`, `qip-modern`, `mra`, `mra-blue`, `mra-green`, `mra-violet`, `psi` (в духе мессенджеров: «Ник (время)» над постом, `card_header = \"chat\"`; при `ui.layout = \"split\"` тема задаёт и раскладку: лица — `shape.faces`, пункты ростера — `roster_rows`, вкладки в несколько рядов — `tab_rows`), `debug` (для отладки: каждое состояние поста — непрочитан, курсор j/k, найден, «увиден не целиком, ещё не прочитан», фокус клавиатуры — своей кричащей рамкой; `shape.debug = true` включает то же в любой своей теме). Свои — файлом в `~/.config/fedtail/themes/`. Тема задаёт и раскладку карточки: форму аватарки (`avatar_shape`), шапку в строку или имя над датой (`card_header = \"stacked\"`), где стоит #id (`short_id`: у имени или под постом с числом ответов), с какой стороны кнопки (`actions_align`), линия между постами (`rule`: сплошная или пунктир), штрихованная полоса под заголовками ленты и окна поста (`header_stripes`) и тёмная полоска над ней (`header_bar`), цвет главных кнопок, полоски заголовка ленты и имён. Тема задаёт весь вид приложения, а не только цвета; поэтому отдельные шаблоны карточек не нужны (см. [Не будем](#не-будем)). Шрифты — `ui.fonts`: темы (у встроенных свои, идут с fedtail: PT Serif, PT Sans, IBM Plex, Source Sans, Open Sans, Arimo, Comfortaa, Nunito, Fira Mono — все с кириллицей), системные или свои (`ui.font`, `ui.mono_font`); своя тема может принести шрифты (`[font] files`), а файлы .ttf/.otf в `~/.config/fedtail/fonts/` подхватываются без установки в систему. Ширина колонки постов — `max_width` (`0` — во всю ширину; кнопка ↔ вверху слева переключает на время и помнит выбор до следующего запуска), подписи у кнопок — `actions`."
details.en = "Built in: `system` (as in KDE), `terminal`, `juick`, `juick-classic`, `bnw`, `point`, `night`, `contrast` (for weak eyes), `pink`, `nord`, `solarized`, `paper`, `qip-retro`, `qip-modern`, `mra`, `mra-blue`, `mra-green`, `mra-violet`, `psi` (in the spirit of messengers: “Name (time)” over a post, `card_header = \"chat\"`; with `ui.layout = \"split\"` the theme sets the layout too: the faces — `shape.faces`, the roster's items — `roster_rows`, tabs in more rows — `tab_rows`), `debug` (for debugging: each state of a post — unread, the j/k cursor, found, “not seen whole yet, not read yet”, the keyboard focus — in a loud frame of its own; `shape.debug = true` turns the same on in any theme of your own). Your own — a file in `~/.config/fedtail/themes/`. A theme sets the card's layout too: the avatar's shape (`avatar_shape`), the header in a line or the name over the date (`card_header = \"stacked\"`), where the #id stands (`short_id`: by the name or under the post with the reply count), which side the buttons are on (`actions_align`), the line between posts (`rule`: solid or dashed), a hatched band under the titles of the lane and the post window (`header_stripes`) and a dark strip over it (`header_bar`), the colour of the main buttons, of the lane's title strip and of names. A theme sets the look of the whole app, not only colours; that's why separate card templates aren't needed (see Won't do). Fonts — `ui.fonts`: the theme’s (the built-in ones bring their own with fedtail: PT Serif, PT Sans, IBM Plex, Source Sans, Open Sans, Arimo, Comfortaa, Nunito, Fira Mono — all with Cyrillic), the system’s, or your own (`ui.font`, `ui.mono_font`); a theme of yours can bring fonts (`[font] files`), and .ttf/.otf files in `~/.config/fedtail/fonts/` are picked up without installing them system-wide. The width of the posts column — `max_width` (`0` — the full width; the ↔ button at the top left switches it for now and remembers the choice until the next start), labels on buttons — `actions`."

