clients = ["Mastodon web", "Phanpy", "Elk", "Tokodon", "Ice Cubes", "Whalebird"]
details.ru = "Опрос раз в `interval_seconds` (не меньше 30). Живой поток (`\"auto\"`, если сервер его даёт) будит опрос сразу, но не чаще раза в `stream_gap_seconds`. Поток только будит, поэтому если он рвётся (сон ноутбука, прокси), ничего не теряется."
details.en = "A poll every `interval_seconds` (at least 30). The live stream (`\"auto\"`, if the server offers it) wakes the poll at once, but not more often than every `stream_gap_seconds`. The stream only wakes, so if it drops (a laptop asleep, a proxy) nothing is lost."

