[[feature]]
id = "video-player"
status = "has"
android = "has"
since = "0.11.0"
name.ru = "Видео, аудио, гифки внутри окна"
name.en = "Video, audio, gifs inside the window"
config = "`ui.video_player`, `ui.gifv`"
api = "`media_attachments`"
others.ru = "у всех"
others.en = "everyone"
clients = ["all"]
details.ru = "Видео играет поверх окна (пробел — пауза, ← → — перемотка, M — звук, O — в браузер, Esc — закрыть), аудио — плеером в карточке. Нужен QtMultimedia (Debian: `python3-pyside6.qtmultimedia python3-pyside6.qtmultimediawidgets`); без него — стоп-кадр с ▶ и браузер. Гифки Мастодона (короткие беззвучные видео): `\"play\"` — крутятся в карточке, пока она на экране (не больше трёх разом), `\"click\"` — стоп-кадр, клик — поверх окна."
details.en = "A video plays over the window (Space — pause, ← → — seek, M — sound, O — to the browser, Esc — close), audio — with a player in the card. Needs QtMultimedia (Debian: `python3-pyside6.qtmultimedia python3-pyside6.qtmultimediawidgets`); without it — a still frame with ▶ and the browser. Mastodon's gifs (short silent videos): `\"play\"` — loop in the card while it's on screen (at most three at once), `\"click\"` — a still frame, a click plays it over the window."

