[[feature]]
id = "prefetch"
status = "has"
android = "partly"
android_note.ru = "кэш картинок свой (Coil), заранее не качает"
android_note.en = "pictures cached by the app's loader (Coil), nothing ahead of time"
since = "0.13.0"
name.ru = "Картинки и видео заранее, кэш на диске"
name.en = "Pictures and video ahead of time, a disk cache"
config = "`feed.prefetch`, `ui.image_disk_mb`, `ui.video_disk_mb`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Как только опрос принёс новые посты, их картинки скачиваются на диск своими фоновыми потоками — открываешь ленту, а всё уже есть. `\"previews\"` (по умолчанию) — превью (и у видео), аватарки и картинки ссылок; `\"all\"` — ещё оригиналы, сами видео и гифки (видео по одному, до 300 МБ каждое); `\"off\"` — только когда пост на экране. Кэш картинок держится в `image_disk_mb` (1 ГБ), видео — в своей папке, `video_disk_mb` (10 ГБ); сверх лимита уходит то, что дольше всего не открывали. Видео, открытое раз, в следующий раз играет с диска."
details.en = "As soon as a poll brings new posts, their pictures are fetched to disk by background workers of their own — open a lane and everything is there. `\"previews\"` (the default) — previews (of videos too), avatars and link pictures; `\"all\"` — also originals, the videos themselves and gifs (videos one at a time, up to 300 MB each); `\"off\"` — only when a post is on screen. The picture cache keeps within `image_disk_mb` (1 GB), videos — in their own folder, `video_disk_mb` (10 GB); over the limit go the ones not opened the longest. A video opened once plays from disk the next time."

[[feature]]
id = "image-memory"
status = "has"
android = "na"
android_note.ru = "памятью картинок ведает загрузчик Coil"
android_note.en = "the Coil loader looks after pictures' memory"
since = "0.2.0"
name.ru = "Память под картинки"
name.en = "Memory for pictures"
config = "`ui.image_cache_mb`, `ui.image_decode`"
api.ru = "своё"
api.en = "own"
others = "—"
details.ru = "Разжатые картинки держатся в памяти до `image_cache_mb` МБ, самые давние выбрасываются первыми (с диска перечитываются мгновенно). `image_decode = \"box\"` — разжимать под размер рамки с учётом плотности экрана: в разы меньше памяти; `\"full\"` — до 1200 точек по большей стороне, резче при растягивании окна."
details.en = "Decoded pictures are held in memory up to `image_cache_mb` MB, the oldest thrown out first (reread from disk at once). `image_decode = \"box\"` — decode to the size of the frame, minding the screen's density: several times less memory; `\"full\"` — up to 1200 pixels on the longer side, sharper when the window is stretched."
