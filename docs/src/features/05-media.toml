# Pictures and video — a chapter of docs/{ru,en}/features.md; built by tools/docs_build.py

id = "media"
title.ru = "Картинки и видео"
title.en = "Pictures and video"

[[feature]]
id = "image-viewer"
status = "has"
android = "has"
since = "0.1.0"
name.ru = "Просмотрщик картинок"
name.en = "Picture viewer"
config = "`ui.image_viewer`, `ui.image_upscale`, `ui.image_height`"
others.ru = "у всех"
others.en = "everyone"
clients = ["all"]
details.ru = "Клик по картинке — свой просмотрщик (`\"internal\"`: ← → листать, Esc закрыть) или браузер (`\"browser\"`). Маленькие картинки увеличиваются до размеров окна не больше чем в `image_upscale` раз. Высота одиночной картинки в ленте — `image_height`."
details.en = "A click on a picture — its own viewer (`\"internal\"`: ← → to flip, Esc to close) or the browser (`\"browser\"`). Small pictures are enlarged to the window at most `image_upscale` times. The height of a single picture in a lane — `image_height`."

[[feature]]
id = "media-grid"
status = "has"
android = "has"
since = "0.9.0"
name.ru = "Сетка картинок"
name.en = "Picture grid"
config = "`ui.media_grid`"
api = "`meta.focus`"
others = "Mastodon web, Tusky, Phanpy, Elk"
clients = ["Mastodon web", "Tusky", "Phanpy", "Elk"]
details.ru = "Несколько картинок в посте: `\"natural\"` — каждая целиком, своей формы; `\"square\"` — ровной сеткой квадратов, обрезанных вокруг точки фокуса автора. Одна картинка не обрезается никогда."
details.en = "Several pictures in a post: `\"natural\"` — each whole, its own shape; `\"square\"` — an even grid of squares cut around the author's focus point. A single picture is never cut."

