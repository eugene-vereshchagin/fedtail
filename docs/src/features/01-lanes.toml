details.ru = "Подборки аккаунтов, которыми делятся (Mastodon 4.6): свои — завести, назвать, описать, показывать ли в профиле, удалить; человека — в подборку из его профиля (если он разрешает попадать в подборки) и обратно; чужие подборки — из профиля; те, где есть ты, — выйти из них. Сервер без подборок (GoToSocial) — пункта нет."
details.en = "Shared sets of accounts (Mastodon 4.6): yours — made, named, described, shown on the profile or not, deleted; someone into one from their profile (if they allow being in collections) and out again; other people's from their profile; the ones you're in — leave them. A server without collections (GoToSocial) — no item."

[[feature]]
