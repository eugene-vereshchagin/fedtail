[[feature]]
id = "repeat-boosts"
status = "has"
android = "has"
since = "0.15.0"
name.ru = "Повторные бусты не поднимают старый пост"
name.en = "Repeated boosts don't bring an old post up again"
config = "`feed.repeat_boosts`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail (сервер Mastodon гасит повтор лишь среди свежих)"
others.en = "only in fedtail (a Mastodon server drops a repeat only among the freshest posts)"
clients = []
details.ru = "Пост приходит в ленту один раз — сам или первым бустом. Буст поста, который в этой ленте уже был или уже прочитан (в треде, в другой ленте), не показывается и не считается в непрочитанном; пост стоит там, где пришёл впервые. `repeat_boosts = true` — каждый буст снова, как у всех. Сервер (Mastodon) сам гасит повтор, только если оригинал был среди последних ~40 постов ленты, — поэтому старые посты и всплывали раз за разом."
details.en = "A post comes into a lane once — as itself or with its first boost. A boost of a post this lane has had already, or one already read (in a thread, in another lane), is not shown and not counted as unread; the post stays where it first came. `repeat_boosts = true` — every boost again, as everyone does. The server (Mastodon) drops a repeat only if the original was among the last ~40 posts of the feed — that's why old posts kept surfacing again and again."

[[feature]]
id = "all-posts-new"
status = "has"
android = "has"
since = "0.3.0"
name.ru = "Всё / Только посты / Новое; Лентой / Беседами"
name.en = "All / Posts only / New; Feed / Conversations"
config = "`lanes.posts_only`, `feed.remember_choices`"
api.ru = "своё"
api.en = "own"
others.ru = "Phanpy — похоже на «Беседы»"
others.en = "Phanpy — similar to “Conversations”"
clients = ["Phanpy"]
details.ru = "Над лентой два переключателя. «Всё / Только посты / Новое»: со всеми комментами, только корневые посты или только непрочитанное. «Лентой / Беседами»: «Беседами» собирает тред в одну карточку, как разговоры на Point. В каких лентах «только посты» включено с запуска — `lanes.posts_only`. Помнить выбор между запусками — `feed.remember_choices = true`; по умолчанию каждый запуск с чистого листа."
details.en = "Over a lane, two switches. “All / Posts only / New”: with all the comments, only top-level posts, or only what's unread. “Feed / Conversations”: “Conversations” gathers a thread into one card, like conversations on Point. In which lanes “posts only” is on from the start — `lanes.posts_only`. Remember the choice between runs — `feed.remember_choices = true`; by default every run starts afresh."

