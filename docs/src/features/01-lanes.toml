config = "—"
api = "`lists/:id/accounts`"
others.ru = "Mastodon web, Ivory (кто в списке); порядок — только в fedtail"
others.en = "Mastodon web, Ivory (who is in a list); the order — only in fedtail"
clients = ["Mastodon web", "Ivory"]
details.ru = "Правый клик по списку слева: «Кто в списке…» — вкладка с его людьми (и с теми, кто ждёт подтверждения подписки), у каждого «Убрать из списка»; «Выше» и «Ниже» — свой порядок списков. У серверов порядка списков нет, его помнит fedtail; новые встают в конец."
details.en = "Right click on a list on the left: “Who is in it…” — a tab with its people (and those waiting for a follow to be confirmed), each with “Take out of the list”; “Move up” and “Move down” — your own order of lists. Servers keep no order of lists; fedtail remembers it, new ones go to the end."

[[feature]]
id = "list-author-or-booster"
status = "has"
since = "0.13.0"
name.ru = "В список — автора или бустнувшего; только тех, на кого подписан"
name.en = "Into a list — the author or the booster; only people you follow"
config = "—"
api = "`lists/:id/accounts`"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "У буста в меню ⋯ два пункта: «Автора в список (@…)» и «Бустнувшего в список (@…)» — бот- ретранслятор тоже человек для списка. Сервер берёт в списки только тех, на кого ты подписан: для остальных списки в подменю мёртвые (не нажимаются вовсе), с подписью «сперва подпишись» и пунктом «Подписаться». Правый клик по строке «♻ boosted by …» — профиль бустнувшего или «В список»; имя в этой строке — ссылка на профиль."
details.en = "A boost's ⋯ menu has two items: “Author to a list (@…)” and “Booster to a list (@…)” — a relay bot is a person too, as far as a list goes. The server takes into lists only people you follow: for the rest the lists in the submenu are dead (they don't click at all), signed “follow first”, with a “Follow” item. Right click on the “♻ boosted by …” line — the booster's profile or “To a list”; the name on that line links to the profile."

