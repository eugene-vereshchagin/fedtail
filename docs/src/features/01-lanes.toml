[[feature]]
id = "free-lanes"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Свободные ленты: собери ленту сам"
name.en = "Free lanes: a lane you assemble yourself"
config = "`[[lanes.custom]]`, `lanes.unsorted`"
api.ru = "своё"
api.en = "own"
others = "—"
clients = []
details.ru = "Лента из правил, первая версия: откуда пост (домашняя, локальная, федерация, упоминания, мои, закладки, лайки, подписки на треды, списки, теги), кто (я, подписки, моя нода, боты, `@ник@сервер`, домен), что это (пост, ответ, ответ себе, буст, самобуст, цитата), ко мне ли (ответ на мой пост или коммент, упоминание, личное), что в нём (картинки, видео, CW, ссылки, теги, язык, слова), что бустнули (моё, чужое, уже виденное), возраст, лайки. Лента встаёт в «Личные» (или `group = \"standard\"` — в «Стандартные»), на своё место в `lanes.enabled` (`\"custom:имя\"`) или в конец, и наполняется из того, что уже лежит в базе; при смене правила — заново. Быстрые фильтры: условие с `switch` — выбор в шапке ленты, с `shown = false` — скрыто (и из счётчиков), пока его не выбрали; «Раньше» — по странице из каждого источника через правило; «Неразобранное» (`lanes.unsorted`) — что пришло, а ни одна лента не взяла. События (лайки, бусты, подписки, опросы) — условием с `event`: строкой среди постов, по времени, не непрочитанные; заявки в подписчики остаются в Активности. План — `docs/ru/dev/feeds.md`."
details.en = "A lane made of rules, first version: where a post came from (home, local, federated, mentions, mine, bookmarks, likes, followed threads, lists, tags), who (me, the followed, my server, bots, `@nick@server`, a domain), what it is (a post, a reply, a reply to oneself, a boost, a self-boost, a quote), whether it's to me (a reply to my post or comment, a mention, private), what is in it (pictures, video, a CW, links, tags, the language, words), what a boost is of (mine, someone's, seen already), its age, its likes. A lane stands in “Personal” (or `group = \"standard\"` — in “Timelines”), in its place in `lanes.enabled` (`\"custom:name\"`) or at the end, and fills from what is stored already; anew when the rule changes. Quick filters: a condition with `switch` is a choice in the lane's header, one with `shown = false` is hidden (from the counts too) until chosen; “Older” — a page from each source through the rule; “Unsorted” (`lanes.unsorted`) — what came and no lane took. Events (likes, boosts, follows, polls) — a condition with `event`: a line among the posts, by time, never unread; follow requests stay in Activity. The plan — `docs/en/dev/feeds.md`."

[[feature]]
id = "wider-lanes"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Федерация и теги шире своего сервера"
name.en = "Federated and tags wider than your server"
config = "`lanes.federated_extra`, `lanes.tags_extra`, `lanes.extra_minutes`"
api.ru = "публичные ленты чужих серверов без токена; `search?resolve=true` на своём"
api.en = "other servers' public lanes without a token; `search?resolve=true` on yours"
others = "—"
clients = []
details.ru = "Серверы из `lanes.federated_extra` — их публичная лента идёт в Федерацию, пока она открыта; из `lanes.tags_extra` — их ленты тегов идут в твои ленты тегов (лента #linux берёт #linux и у них). Каждый новый пост подтягивается на твой сервер по адресу, так что на него отвечают и ставят лайк, как на любой; дальше его знает и сам сервер (его Федерация, поиск по тегу). Бережно: сервер — раз в `extra_minutes`, до 20 постов; закрытые для чужих ленты (GoToSocial всегда, многие Мастодоны) — оставляются в покое на несколько часов. Твой сервер и сам может брать с релея посты с тегом: matcher `#linux` в подписке на релей."
details.en = "Servers in `lanes.federated_extra` — their public lane comes into Federated while it's open; in `lanes.tags_extra` — their tag lanes come into your lanes of tags (a lane of #linux takes #linux from them too). Each new post is fetched into your server by its address, so it is answered and liked as any other, and your server knows it from then on (its Federated, a tag search). Gently: a server every `extra_minutes`, up to 20 posts; lanes closed to strangers (GoToSocial always, many Mastodons) are left alone for a few hours. Your server can take a tag's posts from a relay itself, too: a matcher `#linux` on the relay subscription."

[[feature]]
id = "lane-editor"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Редактор лент"
name.en = "The lane editor"
config.ru = "`lanes.enabled`, `[[lanes.custom]]` (пишет их)"
config.en = "`lanes.enabled`, `[[lanes.custom]]` (writes them)"
api.ru = "своё"
api.en = "own"
others = "—"
clients = []
details.ru = "Меню ≡ → «Ленты…» (и правый клик по ленте → «Изменить ленту…»; на телефоне — ⋮ → «Ленты…» и ⚙ на ленте): сверху — набор, «как в» fedtail (по умолчанию), Мастодоне, Tusky, Phanpy, Fedilab, — «Взять» и «Убрать всё своё» (набор как есть); дальше все ленты по порядку — выше, ниже, скрыть, показать, новая лента, удалить свою, «Как в наборе» для изменённой. «Изменить…» — лента формой: название, картинка, раздел, откуда, как читать, порядок; над формой — её условия словами («Автор: я подписан · Вид: ответ»), «Берёт» и «Не берёт». Условие собирается из частей без всякого синтаксиса: «Спросить» у нужного ключа (автор, вид, есть в посте, событие, язык, слова…) — и отметить значения, что не из списка (@ник@сервер, tag:x, «>10») — дописать; у каждого «Берёт» — свой быстрый фильтр и «скрыто, пока не выбрано»; всё условие можно написать и строкой («author: me, followed; kind: post», «*» — все посты). Что не понялось — сказано, и ничего не пишется. Всё сразу ложится в config.toml (лента набора, изменённая здесь, становится своей с тем же именем) и сразу видно; в окнах, терминале, вебе и на телефоне одно и то же."
details.en = "The ≡ menu → “Lanes…” (and a right click on a lane → “Edit the lane…”; on the phone ⋮ → “Lanes…” and ⚙ on a lane): on top the set — “as in” fedtail (the default), Mastodon, Tusky, Phanpy, Fedilab — “Take” and “Take all of yours away” (the set as it is); then every lane in its order — up, down, hide, show, a new lane, delete one's own, “As in the set” for a changed one. “Edit…” — the lane as a form: title, picture, section, sources, how it's read, the order; over the form its conditions in words (“The author: I follow · Kind: a reply”), “Takes” and “Keeps out”. A condition is put together from parts with no syntax at all: “Ask” at the key wanted (the author, the kind, what the post has, the event, the language, words…) and tick the values, typing what the list hasn't (@nick@host, tag:x, “>10”); every “Takes” has its quick filter and “hidden till chosen”; a whole condition can be typed as a line too (“author: me, followed; kind: post”, “*” — every post). What doesn't read is said, and nothing is written. Everything goes into config.toml at once (a set's lane changed here becomes one of your own, of its name) and shows at once; the same in the windows, the terminal, the web page and on the phone."

[[feature]]
id = "unsorted-lane"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "«Неразобранное»: ни один пост не теряется"
name.en = "“Unsorted”: no post gets lost"
config = "`lanes.unsorted`"
api.ru = "своё"
api.en = "own"
others = "—"
clients = []
details.ru = "Страховка для правил: что пришло из источников, читаемых подряд (домашняя, упоминания, мои, списки…), а ни одна лента не взяла, ложится сюда. Не идёт: то, что держит другая лента; посты тех, кто в списке (их читают в ленте списка); источники для просмотра (федерация, локальная, пока ленивая) — утопят. Пост, который потом взяла лента, отсюда уходит. Лента видна, только когда в ней что-то есть; `lanes.unsorted = false` прячет её насовсем и перестаёт собирать — если сознательно не нужна."
details.en = "A safety net for the rules: whatever came from a read-through source (home, mentions, mine, lists…) and no lane took lands here. Not here: what another lane holds; posts of people put in a list (read in the list's lane); browse sources (federated, local while lazy) — they'd drown it. A post a lane takes later leaves. The lane is shown only while something is in it; `lanes.unsorted = false` hides it for good and stops collecting — when you deliberately don't want it."

[[feature]]
id = "poll-state"
status = "has"
android = "has"
since = "0.20.1"
name.ru = "Свежесть лент в строке состояния"
name.en = "How fresh the lanes are, in the status line"
config.ru = "—"
config.en = "—"
