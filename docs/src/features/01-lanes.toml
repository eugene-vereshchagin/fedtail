config.en = "`window.open_columns`, `window.columns`, `window.column_width`; the ❯ button at the top left"
api.ru = "своё"
api.en = "own"
others.ru = "Sengi, Phanpy, tut, Whalebird, Mastodon web (продвинутый режим)"
others.en = "Sengi, Phanpy, tut, Whalebird, Mastodon web (advanced mode)"
clients = ["Mastodon web", "Phanpy", "Sengi", "tut", "Whalebird"]
details.ru = "Несколько лент на экране одновременно, колонками. По умолчанию — одна лента за раз; кнопка ❯ вверху слева (рядом с ≡ и ↔) включает колонки на время, а при запуске окно такое, как `window.open_columns`. Клик по ленте слева добавляет колонку (или прокручивает к ней), ✕ убирает, ‹ › двигают; набор запоминается. Это те же ленты, что и в одиночном виде: позиция, фильтры и прочитанное у каждой свои, лента «Федерация» и прочие обзорные обновляются, пока стоят колонкой. В вебе (с 0.20) — так же, кнопкой ❯ на панели ленты: лента в фокусе — со своей панелью, клавишами и Ctrl+F, клик по соседней колонке переводит фокус на неё; включены ли колонки, помнит браузер, а при первом открытии — как `window.open_columns`; на ширине телефона — одна лента."
details.en = "Several lanes on screen at once, in columns. By default — one lane at a time; the ❯ button at the top left (next to ≡ and ↔) turns columns on for now, and the window starts as `window.open_columns` says. A click on a lane on the left adds a column (or scrolls to it), ✕ takes it away, ‹ › move it; the set is remembered. These are the same lanes as in the single view: place, filters and read marks are each their own, and Federated and the other browse lanes keep updating while they stand in a column. On the web page (since 0.20) the same, by ❯ on the lane's bar: the lane in focus has its bar, keys and Ctrl+F, a click on a column beside brings it into focus; whether columns are on the browser remembers, at first as `window.open_columns` says; at a phone's width, one lane."

[[feature]]
id = "roster"
status = "has"
android = "na"
android_note.ru = "на телефоне не нужно"
android_note.en = "not a phone thing"
since = "0.17.0"
name.ru = "Раскладка как в аське: ростер и окно сообщений"
name.en = "A messenger's layout: a roster and a messages window"
config.ru = "`window.layout = \"split\"` или на один запуск `fedtail --layout split`; `window.roster_on_top`, `window.roster_threads`, `appearance.faces`, `window.dock_commands`, `window.split_tabs`, `appearance.icons`"
config.en = "`window.layout = \"split\"` or for one run `fedtail --layout split`; `window.roster_on_top`, `window.roster_threads`, `appearance.faces`, `window.dock_commands`, `window.split_tabs`, `appearance.icons`"
api.ru = "своё"
api.en = "own"
others = "—"
details.ru = "fedtail как мессенджер нулевых — QIP, Mail.ru Агент, Psi. **Ростер** — узкое окно, с него fedtail и начинается: сверху я и «N новых в активности», поиск, сворачиваемые группы — ленты, подписанные треды и личные беседы («Треды», «Беседы», самые свежие `window.roster_threads`) и «Люди» — те, на кого я подписан и кто подписан на меня (спрашивается раз в сутки). Группа пишет «(15)» или «(2/15)», если новое есть в двух пунктах; у пункта число нового, строка последнего поста и лицо. Двойной щелчок или Enter открывает, наведение на человека — его карточка, как в QIP. Внизу меню, аккаунты и ⚙ — вид ростера: компактно, без шапки, поиска или кнопок, только новое, без групп, поверх окон (`window.roster_on_top`). Закрыть ростер — закрыть fedtail (в трей с `window.close_to_tray`); значок в трее прячет и возвращает оба окна. **Окно сообщений** — главное окно без боковой панели: каждая открытая лента, тред, профиль и беседа — своя вкладка, в несколько рядов, если не влезают; ×, средняя кнопка или Esc закрывают, с последней уходит и окно (`window.split_tabs` — хранить ли вкладки до следующего раза). Человек открывается беседой, где только наши личные сообщения. **Строка ввода** всегда под перепиской, между ними перетаскиваемая черта: в треде отвечает в тред (личная беседа остаётся личной), в беседе пишет этому человеку лично, в ленте — новый пост; «Ответить» на карточке тоже ведёт сюда. Кто увидит, предупреждение, картинки, язык; понимает и команды командной строки (`window.dock_commands`: «#a3f текст», «! #a3f», «?» — Enter). **Лица** (`appearance.faces`): над лентой в одну строку — автор поста под мышкой (или под курсором, или самого свежего целиком на экране): имя, адрес, взаимно ли, «Подписаться», «В список», лично, профиль; у строки ввода — кому пишу. В темах Агента — колонка справа: собеседник у переписки, я у строки ввода. Пока лица нет — серый силуэт. **Картинки на кнопках** — мессенджерные, из набора темы (`appearance.icons`): у строки ввода, полосы автора, ростера (их — только в split, или везде с `\"additional\"`), а у «Ответить», «В избранное», «Продвинуть», «Тред», «Закладка», видимости поста, меню и лент — в любой раскладке; у человека цветок в темах QIP, «@» в темах Агента, звезда в Psi; тема `psi` приносит картинки самого Psi+ (наборы Crystal и Stellar, GPL). Как всё это выглядит, решает тема: лица — `shape.faces`, пункты ростера — `roster_rows`, вкладки — `tab_rows`, картинки — `shape.icons` и папка `icons/` темы (docs/ru/dev/layouts.md)."
details.en = "fedtail as a messenger of the 2000s — QIP, the Mail.ru Agent, Psi. The **roster** is a narrow window, and fedtail starts with it: me and “N new in Activity” on top, a search line, folding groups — the lanes, followed threads and private talks (“Threads”, “Talks”, the freshest `window.roster_threads`) and “People” — whom I follow who follows me back (asked once a day). A group says “(15)”, or “(2/15)” when two of its items have something new; an item has its count, a line of its newest post and a face. A double click or Enter opens it, hovering a person shows their card, as in QIP. At the bottom the menu, the accounts and ⚙ — how the roster looks: compact, without the header, the search or the buttons, only what's new, without groups, above other windows (`window.roster_on_top`). Closing the roster closes fedtail (to the tray with `window.close_to_tray`); the tray icon hides and brings back both windows. The **messages window** is the main window without the sidebar: every lane, thread, profile and talk opened is a tab of its own, in more rows when they don't fit; ×, the middle button or Esc close one, and with the last the window goes (`window.split_tabs` — whether to keep the tabs for next time). A person opens as a talk with only our private messages. The **input line** is always under the posts, a bar that drags between them: in a thread it answers the thread (a private talk stays private), in a talk it writes to that person privately, in a lane — a new post; Reply on a card leads here too. Who sees it, a content warning, pictures, the language; it also takes the command line's commands (`window.dock_commands`: “#a3f text”, “! #a3f”, “?” — Enter). **Faces** (`appearance.faces`): over a lane, in one line, the author of the post under the pointer (or the cursor, or the newest whole on screen): name, address, whether we follow each other, Follow, Add to list, a private message, the profile; by the input line — whom I write to. The Agent's themes have a column on the right instead: theirs by the posts, mine by the input line. A grey silhouette while there's no face. **Pictures on buttons** — the messengers', from the theme's set (`appearance.icons`): on the input line, the author's bar, the roster (only in the split layout, or anywhere with `\"additional\"`), and on Reply, Favourite, Boost, Thread, Bookmark, who sees a post, the menu and the lanes in any layout; a flower for a person in the QIP themes, an “@” in the Agent's, a star in Psi's; the `psi` theme brings Psi+'s own pictures (the Crystal and Stellar iconsets, GPL). The theme decides how it all looks: the faces — `shape.faces`, the roster's items — `roster_rows`, the tabs — `tab_rows`, the pictures — `shape.icons` and the theme's `icons/` folder (docs/en/dev/layouts.md)."

