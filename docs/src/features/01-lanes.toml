details.ru = "Каждая лента — правило, наборы — готовые наборы правил: fedtail (в духе Point), как у Mastodon (веб), Tusky, Phanpy; выбор — `lanes.preset`, на странице настроек. Правила наборов — в `fedtail/data/presets.toml`; своя `[[lanes.custom]]` с тем же именем заменяет ленту набора, `fedtail --lanes-to-config` выписывает набор в `config.toml` целиком. Одни «Уведомления» других клиентов здесь пока — две ленты, Упоминания и Активность."
details.en = "Every lane is a rule, and the sets are sets of rules ready to use: fedtail's (Point-style), as in Mastodon (web), Tusky, Phanpy; chosen with `lanes.preset`, on the settings page too. The sets' rules are in `fedtail/data/presets.toml`; a `[[lanes.custom]]` of the same name takes a set's lane's place, `fedtail --lanes-to-config` writes the whole set into `config.toml`. Other clients' one “Notifications” is two lanes here for now, Mentions and Activity."

