name.ru = "Боты отдельной лентой"
name.en = "Bots in a lane of their own"
config = "`lanes.enabled` (`\"bots\"`), `lanes.extra_bots`"
api.ru = "поле `account.bot`"
api.en = "the `account.bot` field"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Посты аккаунтов с галкой «бот» уходят из «Ленты» в свою ленту «Боты». Кто бот, но галку не поставил, — допиши в `lanes.extra_bots`: свой сервер — `\"ник\"`, чужой — `\"ник@сервер\"`."
details.en = "Posts of accounts with the “bot” tick leave Home for a lane of their own, “Bots”. A bot without the tick goes into `lanes.extra_bots`: on your server — `\"nick\"`, on another — `\"nick@server\"`."

[[feature]]
id = "personal-lanes"
status = "has"
since = "0.1.0"
name.ru = "Личные ленты"
name.en = "Personal lanes"
config = "`lanes.enabled`, `lanes.mentions_all`, `lanes.direct_apart`"
api = "notifications, `visibility=direct`"
others.ru = "у всех, но разложено иначе"
others.en = "everyone, but laid out differently"
clients = ["all"]
details.ru = """
- «Мои записи» (`my_posts`) — мои посты и комменты.
- «Личные» (`direct`) — сообщения с видимостью «только упомянутым». При `lanes.direct_apart = true` (по умолчанию) они живут только здесь и не дублируются в «Ответах мне» и «Упоминаниях».
- «Ответы мне» (`replies`) — ответы на мои посты и комменты, даже если в них есть @я.
- «Упоминания» (`mentions`) — где меня тегнули в чужом разговоре. `lanes.mentions_all = true` — показывать здесь вообще всё, где меня упомянули, ответы тоже (они окажутся в обеих лентах).
- «Подписки» (`subs`) — новое в тредах, на которые я подписан (см. Подписки на треды).
- «Закладки» (`bookmarks`), «Мои лайки» (`my_likes`, по умолчанию выключена), «Активность» (`activity`), «Заявки» (`requests`) — ниже, каждая в своём разделе.
Разделение «ответы мне» и «упоминания» — то, чего нет у других: обычно всё валится в одну ленту уведомлений."""
details.en = """
- “My posts” (`my_posts`) — my posts and comments.
- “Direct” (`direct`) — messages visible to the mentioned only. With `lanes.direct_apart = true` (the default) they live only here and don't double up in “Replies to me” and “Mentions”.
- “Replies to me” (`replies`) — replies to my posts and comments, even if they @ me.
- “Mentions” (`mentions`) — where I was tagged in someone else's conversation. `lanes.mentions_all = true` — show everything that mentions me here, replies too (they'll be in both lanes).
- “Subscriptions” (`subs`) — what's new in threads I'm subscribed to (see Thread subscriptions).
- “Bookmarks” (`bookmarks`), “My likes” (`my_likes`, off by default), “Activity” (`activity`), “Follow requests” (`requests`) — below, each in its own section.

Splitting “replies to me” from “mentions” is what other clients don't do: usually it all lands in one notifications lane."""

[[feature]]
id = "lists-as-lanes"
status = "has"
since = "0.2.0"
name.ru = "Списки как ленты"
name.en = "Lists as lanes"
config = "`[lists]`: `enabled`, `refresh_minutes`"
api = "`lists`, `timelines/list/:id`"
others = "Mastodon web, Tusky, Ivory, Phanpy, Elk, Tokodon, Ice Cubes, Megalodon"
clients = ["Mastodon web", "Tusky", "Ivory", "Phanpy", "Elk", "Tokodon", "Ice Cubes", "Megalodon"]
details.ru = "Списки с сервера — отдельные ленты в группе «Списки». Завести, переименовать, удалить, сделать исключающим — из меню; добавить человека — правым кликом по его посту. Сами списки и кто в них fedtail перечитывает раз в `lists.refresh_minutes` минут."
details.en = "The server's lists are lanes of their own in the “Lists” group. Create, rename, delete, make exclusive — from the menu; add a person — with a right click on their post. fedtail rereads the lists and who is in them every `lists.refresh_minutes` minutes."

[[feature]]
id = "list-members-leave"
status = "has"
since = "0.3.0"
name.ru = "Кто в списке — уходит из общих лент"
name.en = "Who is in a list leaves the general lanes"
config = "`lists.hide_members`, `lists.hide_in`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Добавил человека или бота в список — его посты, его бусты и чужие бусты его постов читаются в ленте списка и пропадают из общих лент, чтобы не мусорили. `hide_members`: `\"all\"` — так с любым списком; `\"exclusive\"` — только с исключающими (сервер и сам убирает таких из домашней ленты, fedtail доводит это до остальных лент); `\"off\"` — не убирать. Из каких лент убирать — `lists.hide_in` (по умолчанию Лента, Боты, Федерация, Локальная)."
details.en = "Put a person or a bot in a list — their posts, their boosts and others' boosts of their posts are read in the list's lane and disappear from the general lanes, so they don't clutter them. `hide_members`: `\"all\"` — so with any list; `\"exclusive\"` — only with exclusive ones (the server itself takes such people out of Home, fedtail carries that to the other lanes); `\"off\"` — don't take out. Which lanes — `lists.hide_in` (by default Home, Bots, Federated, Local)."

[[feature]]
id = "list-members-order"
