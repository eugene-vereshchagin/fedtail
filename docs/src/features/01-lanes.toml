api.en = "own"
others = "—"
details.ru = "«⟳ обновляю ленты…», пока идёт опрос сервера, «обновлено в 14:32», когда он прошёл, «⚠ сервер не отвечает с 14:20», когда опросы срываются, — чтобы лента без нового читалась как «нового нет», а не «сеть отвалилась». В окнах — справа в строке состояния, в терминале — в заголовке, в вебе — на панели ленты, на телефоне — под названием ленты и в обзоре; с медленным режимом — рядом с его временем."
details.en = "“⟳ updating the lanes…” while a round asks the server, “updated at 14:32” once it came through, “⚠ no answer from the server since 14:20” when rounds fail — so a lane with nothing new reads as nothing new, not as a dead network. In the windows — at the right of the status bar, in the terminal — in the header, on the web page — on the lane's bar, on the phone — under the lane's title and on the overview; with slow mode — beside its time."

