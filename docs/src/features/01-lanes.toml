details.ru = "Галочка «Во всех лентах» в строке `Ctrl+F`: вспомнил фразу, а где видел — не помнишь. Ищет во всём сохранённом по всем лентам сразу (в порядке боковой панели, в каждой от новых к старым, один пост — один раз), счётчик пишет, в какой ленте совпадение; следующее совпадение само открывает свою ленту и подгружает её вниз до него. Галочка запоминается."
details.en = "The “In every lane” tick in the `Ctrl+F` bar: you remember a phrase but not where you saw it. It searches everything stored in every lane at once (in the sidebar's order, newest to oldest in each, a post once), the counter says which lane the match is in; the next match opens its lane by itself and loads it down to the post. The tick is remembered."

