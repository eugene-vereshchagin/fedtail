[[feature]]
id = "personal-lanes"
status = "has"
android = "has"
since = "0.1.0"
name.ru = "Личные ленты"
name.en = "Personal lanes"
config = "`lanes.preset`, `lanes.enabled`"
api = "notifications, `visibility=direct`"
others.ru = "у всех, но разложено иначе"
others.en = "everyone, but laid out differently"
clients = ["all"]
details.ru = """
- «Мои записи» (`my_posts`) — мои посты и комменты.
- «Личные» (`direct`) — сообщения с видимостью «только упомянутым», диалогом: и входящие, и твои исходящие (отправленные отсюда, из другого клиента, встреченные в треде), по времени поста. Твои сразу прочитаны и счётчик не раздувают (с 0.20). Пока лента включена, входящие живут только здесь и не дублируются в других (в правилах наборов это `apart = "direct"`); твои туда не попадают никогда.
- «Ответы мне» (`replies`) — ответы на мои посты и комменты, даже если в них есть @я.
- «Упоминания» (`mentions`) — где меня тегнули в чужом разговоре. Обе ленты — не в наборах по умолчанию (там «Ко мне»), их включает `lanes.enabled`.
- «Подписки» (`subs`) — новое в тредах, на которые я подписан (см. Подписки на треды).
- «Закладки» (`bookmarks`), «Мои лайки» (`my_likes`, по умолчанию выключена), «Активность» (`activity`), «Заявки» (`requests`) — ниже, каждая в своём разделе.
Разделение «ответы мне» и «упоминания» — то, чего нет у других: обычно всё валится в одну ленту уведомлений."""
details.en = """
- “My posts” (`my_posts`) — my posts and comments.
- “Direct” (`direct`) — messages visible to the mentioned only, as a dialogue: incoming and your own outgoing ones (sent from here, from another client, met in a thread), by the post's time. Yours are read at once and don't swell the count (since 0.20). While the lane is on, the incoming ones live only here and don't double up in the others (in the sets' rules that's `apart = "direct"`); yours never go there.
- “Replies to me” (`replies`) — replies to my posts and comments, even if they @ me.
- “Mentions” (`mentions`) — where I was tagged in someone else's conversation. Both lanes are in no set by default (there it's “To me”); `lanes.enabled` turns them on.
- “Subscriptions” (`subs`) — what's new in threads I'm subscribed to (see Thread subscriptions).
- “Bookmarks” (`bookmarks`), “My likes” (`my_likes`, off by default), “Activity” (`activity`), “Follow requests” (`requests`) — below, each in its own section.

Splitting “replies to me” from “mentions” is what other clients don't do: usually it all lands in one notifications lane."""

