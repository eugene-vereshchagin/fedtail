details.ru = "`Ctrl+F` ищет в открытой ленте по тексту, нику, номеру `#id` и подписям к картинкам. Ищет по своей базе, сервер не спрашивает, так что работает и без сети. `Enter`, `↓`, `F3` или `Ctrl+F` ещё раз — к следующему совпадению, `Shift+Enter` — к предыдущему."
details.en = "`Ctrl+F` finds in the open lane by text, nick, `#id` and picture captions. It searches its own database and doesn't ask the server, so it works offline too. `Enter`, `↓`, `F3` or `Ctrl+F` again — to the next match, `Shift+Enter` — to the previous one."

