[[feature]]
id = "tag-groups"
status = "has"
android = "has"
since = "0.14.0"
name.ru = "Лента из нескольких тегов"
name.en = "A lane of several tags"
config.ru = "`[[lanes.tag_groups]]`; из поиска — «＋ в ленты»"
config.en = "`[[lanes.tag_groups]]`; from the search — “＋ to lanes”"
api.ru = "`timelines/tag/:name` по каждому тегу, склейка у себя"
api.en = "`timelines/tag/:name` for each tag, put together here"
others.ru = "Phanpy, Ice Cubes («группы тегов»), tut (`:tag a b`)"
others.en = "Phanpy, Ice Cubes (“tag groups”), tut (`:tag a b`)"
clients = ["Phanpy", "Ice Cubes", "tut"]
details.ru = "Набери в поиске `#грузия #georgia -#политика`: откроется одна лента по всем этим тегам — любой из них, `+#тег` обязательно есть, `-#тег` — кроме. Кнопка «＋ в ленты» держит её слева, в группе «Теги»; подгружается, пока открыта, как Федерация. Те же ленты можно описать в конфиге, `[[lanes.tag_groups]]` (name, any, all, none). Серверу нужен запрос на каждый тег (GoToSocial понимает только один тег за раз), fedtail склеивает их сам, без повторов."
details.en = "Type `#грузия #georgia -#politics` in the search: one lane of all these tags opens — any of them, `+#tag` must be there, `-#tag` — without. The “＋ to lanes” button keeps it on the left, in the “Tags” group; it is fetched while open, like Federated. The same lanes can be described in the config, `[[lanes.tag_groups]]` (name, any, all, none). The server needs a request per tag (GoToSocial reads only one tag at a time), fedtail puts them together itself, without repeats."

[[feature]]
id = "columns"
status = "has"
android = "has"
since = "0.14.0"
