details.ru = "У буста в меню ⋯ два пункта: «Автора в список (@…)» и «Бустнувшего в список (@…)» — бот- ретранслятор тоже человек для списка. Сервер берёт в списки только тех, на кого ты подписан: для остальных списки в подменю мёртвые (не нажимаются вовсе), с подписью «сперва подпишись» и пунктом «Подписаться». Правый клик по строке «♻ boosted by …» — профиль бустнувшего или «В список»; имя в этой строке — ссылка на профиль."
details.en = "A boost's ⋯ menu has two items: “Author to a list (@…)” and “Booster to a list (@…)” — a relay bot is a person too, as far as a list goes. The server takes into lists only people you follow: for the rest the lists in the submenu are dead (they don't click at all), signed “follow first”, with a “Follow” item. Right click on the “♻ boosted by …” line — the booster's profile or “To a list”; the name on that line links to the profile."

