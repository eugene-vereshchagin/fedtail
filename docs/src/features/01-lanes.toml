name.en = "Columns side by side"
config.ru = "`ui.layout`, `ui.columns`, `ui.column_width`; кнопка ❯ вверху слева"
config.en = "`ui.layout`, `ui.columns`, `ui.column_width`; the ❯ button at the top left"
api.ru = "своё"
api.en = "own"
others.ru = "Sengi, Phanpy, tut, Whalebird, Mastodon web (продвинутый режим)"
others.en = "Sengi, Phanpy, tut, Whalebird, Mastodon web (advanced mode)"
clients = ["Mastodon web", "Phanpy", "Sengi", "tut", "Whalebird"]
details.ru = "Несколько лент на экране одновременно, колонками. По умолчанию — одна лента за раз; кнопка ❯ вверху слева (рядом с ≡ и ↔) включает колонки на время, а при запуске окно такое, как `ui.layout`. Клик по ленте слева добавляет колонку (или прокручивает к ней), ✕ убирает, ‹ › двигают; набор запоминается. Это те же ленты, что и в одиночном виде: позиция, фильтры и прочитанное у каждой свои, лента «Федерация» и прочие обзорные обновляются, пока стоят колонкой."
details.en = "Several lanes on screen at once, in columns. By default — one lane at a time; the ❯ button at the top left (next to ≡ and ↔) turns columns on for now, and the window starts as `ui.layout` says. A click on a lane on the left adds a column (or scrolls to it), ✕ takes it away, ‹ › move it; the set is remembered. These are the same lanes as in the single view: place, filters and read marks are each their own, and Federated and the other browse lanes keep updating while they stand in a column."

[[feature]]
id = "roster"
status = "has"
android = "na"
android_note.ru = "на телефоне не нужно"
android_note.en = "not a phone thing"
since = "0.17.0"
name.ru = "Раскладка как в аське: ростер и окно сообщений"
name.en = "A messenger's layout: a roster and a messages window"
config.ru = "`ui.layout = \"split\"` или на один запуск `fedtail --layout split`; `ui.roster_on_top`, `ui.roster_threads`, `ui.faces`, `ui.dock_commands`, `ui.split_tabs`, `ui.icons`"
config.en = "`ui.layout = \"split\"` or for one run `fedtail --layout split`; `ui.roster_on_top`, `ui.roster_threads`, `ui.faces`, `ui.dock_commands`, `ui.split_tabs`, `ui.icons`"
api.ru = "своё"
api.en = "own"
others = "—"
details.ru = "fedtail как мессенджер нулевых — QIP, Mail.ru Агент, Psi. **Ростер** — узкое окно, с него fedtail и начинается: сверху я и «N новых в активности», поиск, сворачиваемые группы — ленты, подписанные треды и личные беседы («Треды», «Беседы», самые свежие `ui.roster_threads`) и «Люди» — те, на кого я подписан и кто подписан на меня (спрашивается раз в сутки). Группа пишет «(15)» или «(2/15)», если новое есть в двух пунктах; у пункта число нового, строка последнего поста и лицо. Двойной щелчок или Enter открывает, наведение на человека — его карточка, как в QIP. Внизу меню, аккаунты и ⚙ — вид ростера: компактно, без шапки, поиска или кнопок, только новое, без групп, поверх окон (`ui.roster_on_top`). Закрыть ростер — закрыть fedtail (в трей с `ui.close_to_tray`); значок в трее прячет и возвращает оба окна. **Окно сообщений** — главное окно без боковой панели: каждая открытая лента, тред, профиль и беседа — своя вкладка, в несколько рядов, если не влезают; ×, средняя кнопка или Esc закрывают, с последней уходит и окно (`ui.split_tabs` — хранить ли вкладки до следующего раза). Человек открывается беседой, где только наши личные сообщения. **Строка ввода** всегда под перепиской, между ними перетаскиваемая черта: в треде отвечает в тред (личная беседа остаётся личной), в беседе пишет этому человеку лично, в ленте — новый пост; «Ответить» на карточке тоже ведёт сюда. Кто увидит, предупреждение, картинки, язык; понимает и команды командной строки (`ui.dock_commands`: «#a3f текст», «! #a3f», «?» — Enter). **Лица** (`ui.faces`): над лентой в одну строку — автор поста под мышкой (или под курсором, или самого свежего целиком на экране): имя, адрес, взаимно ли, «Подписаться», «В список», лично, профиль; у строки ввода — кому пишу. В темах Агента — колонка справа: собеседник у переписки, я у строки ввода. Пока лица нет — серый силуэт. **Картинки на кнопках** — мессенджерные, из набора темы (`ui.icons`): у строки ввода, полосы автора, ростера (их — только в split, или везде с `\"additional\"`), а у «Ответить», «В избранное», «Продвинуть», «Тред», «Закладка», видимости поста, меню и лент — в любой раскладке; у человека цветок в темах QIP, «@» в темах Агента, звезда в Psi; тема `psi` приносит картинки самого Psi+ (наборы Crystal и Stellar, GPL). Как всё это выглядит, решает тема: лица — `shape.faces`, пункты ростера — `roster_rows`, вкладки — `tab_rows`, картинки — `shape.icons` и папка `icons/` темы (docs/ru/dev/layouts.md)."
details.en = "fedtail as a messenger of the 2000s — QIP, the Mail.ru Agent, Psi. The **roster** is a narrow window, and fedtail starts with it: me and “N new in Activity” on top, a search line, folding groups — the lanes, followed threads and private talks (“Threads”, “Talks”, the freshest `ui.roster_threads`) and “People” — whom I follow who follows me back (asked once a day). A group says “(15)”, or “(2/15)” when two of its items have something new; an item has its count, a line of its newest post and a face. A double click or Enter opens it, hovering a person shows their card, as in QIP. At the bottom the menu, the accounts and ⚙ — how the roster looks: compact, without the header, the search or the buttons, only what's new, without groups, above other windows (`ui.roster_on_top`). Closing the roster closes fedtail (to the tray with `ui.close_to_tray`); the tray icon hides and brings back both windows. The **messages window** is the main window without the sidebar: every lane, thread, profile and talk opened is a tab of its own, in more rows when they don't fit; ×, the middle button or Esc close one, and with the last the window goes (`ui.split_tabs` — whether to keep the tabs for next time). A person opens as a talk with only our private messages. The **input line** is always under the posts, a bar that drags between them: in a thread it answers the thread (a private talk stays private), in a talk it writes to that person privately, in a lane — a new post; Reply on a card leads here too. Who sees it, a content warning, pictures, the language; it also takes the command line's commands (`ui.dock_commands`: “#a3f text”, “! #a3f”, “?” — Enter). **Faces** (`ui.faces`): over a lane, in one line, the author of the post under the pointer (or the cursor, or the newest whole on screen): name, address, whether we follow each other, Follow, Add to list, a private message, the profile; by the input line — whom I write to. The Agent's themes have a column on the right instead: theirs by the posts, mine by the input line. A grey silhouette while there's no face. **Pictures on buttons** — the messengers', from the theme's set (`ui.icons`): on the input line, the author's bar, the roster (only in the split layout, or anywhere with `\"additional\"`), and on Reply, Favourite, Boost, Thread, Bookmark, who sees a post, the menu and the lanes in any layout; a flower for a person in the QIP themes, an “@” in the Agent's, a star in Psi's; the `psi` theme brings Psi+'s own pictures (the Crystal and Stellar iconsets, GPL). The theme decides how it all looks: the faces — `shape.faces`, the roster's items — `roster_rows`, the tabs — `tab_rows`, the pictures — `shape.icons` and the theme's `icons/` folder (docs/en/dev/layouts.md)."

[[feature]]
id = "collections"
status = "has"
android = "has"
since = "0.20.0"
name.ru = "Подборки людей (Mastodon 4.6)"
name.en = "Collections of people (Mastodon 4.6)"
config.ru = "≡ → «Мои подборки»; в профиле — «В подборку…», «Подборки»"
config.en = "≡ → “My collections”; on a profile — “Add to collection…”, “Collections”"
api = "`/api/v1/collections`, `/api/v1/accounts/:id/collections`, `…/in_collections`"
others = "Mastodon 4.6, Fedilab"
clients = ["Mastodon web", "Fedilab"]
details.ru = "Подборки аккаунтов, которыми делятся (Mastodon 4.6): свои — завести, назвать, описать, показывать ли в профиле, удалить; человека — в подборку из его профиля (если он разрешает попадать в подборки) и обратно; чужие подборки — из профиля; те, где есть ты, — выйти из них. Сервер без подборок (GoToSocial) — пункта нет."
details.en = "Shared sets of accounts (Mastodon 4.6): yours — made, named, described, shown on the profile or not, deleted; someone into one from their profile (if they allow being in collections) and out again; other people's from their profile; the ones you're in — leave them. A server without collections (GoToSocial) — no item."

[[feature]]
id = "remote-public-timeline"
status = "has"
android = "has"
since = "0.20.0"
name.ru = "Публичная лента чужого сервера"
name.en = "Another server's public timeline"
config = "—"
api.ru = "`timelines/public?local=true` того сервера без токена, `search?resolve=true` своего"
api.en = "that server's `timelines/public?local=true` without a token, `search?resolve=true` on yours"
others = "Ice Cubes"
clients = ["Ice Cubes"]
details.ru = "≡ → «Лента другого сервера…»: имя сервера — и его Локальная, как её видит любой без входа, страницами. Посты подтягиваются через твой сервер, так что лайкать, отвечать и открывать треды можно как обычно. Многие серверы закрывают ленту для анонимов (GoToSocial — всегда) — fedtail так и скажет. Тот сервер видит твой адрес, как при открытии в браузере."
details.en = "≡ → “Another server's lane…”: a server's name — and its Local, as anyone sees it without logging in, page by page. The posts come through your server, so liking, replying and opening threads work as usual. Many servers close their lane to strangers (GoToSocial always) — fedtail says so. That server sees your address, as a browser opening it would."

[[feature]]
id = "link-timeline"
status = "has"
android = "has"
since = "0.20.0"
name.ru = "Лента по ссылке (Mastodon 4.3+)"
name.en = "A link's timeline (Mastodon 4.3+)"
config = "—"
api = "`/api/v1/timelines/link`"
others = "Mastodon web"
clients = ["Mastodon web"]
details.ru = "«Кто ещё делился этой ссылкой» в меню поста — см. одноимённую строку в «Профилях». GoToSocial не умеет."
details.en = "“Who else shared this link” in a post's menu — see the line of that name under “Profiles”. GoToSocial can't do it."
