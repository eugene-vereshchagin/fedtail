# Lanes — a chapter of docs/{ru,en}/features.md; built by tools/docs_build.py

id = "lanes"
title.ru = "Ленты"
title.en = "Lanes"
intro.ru = """
Слева — список лент по группам: «Стандартные» (от самой широкой к своей), «Личные»,
«Списки». Какие ленты показывать и в каком порядке — `lanes.enabled`. Группировка с
заголовками выключается `ui.sidebar_groups = false`. Ширина колонки — `ui.sidebar_width`;
её край тянется мышью, и эта ширина помнится, пока число в конфиге не поменяешь."""
intro.en = "On the left, the lanes in groups: “Timelines” (from the widest down to your own), “Personal”, “Lists”. Which lanes to show and in what order — `lanes.enabled`. Group headings go with `ui.sidebar_groups = false`. The column's width — `ui.sidebar_width`; its edge drags with the mouse, and the dragged width is kept until the number in the config changes."

[[feature]]
id = "timelines"
status = "has"
since = "0.2.0"
name.ru = "Федерация, Лента, Локальная"
name.en = "Federated, Home, Local"
config = "`lanes.enabled` (`\"federated\"`, `\"home\"`, `\"local\"`)"
api = "`timelines/home`, `timelines/public`"
others.ru = "у всех"
others.en = "everyone"
clients = ["all"]
details.ru = "«Лента» (`home`) — те, кого ты читаешь, без ботов; открывается по умолчанию. «Локальная» — вся твоя нода. «Федерация» — всё, что нода знает со всех серверов. Федерация и Локальная подгружаются, только пока открыты, и идут без счётчиков непрочитанного: их листают, а не дочитывают. Между свежей страницей и тем, что было раньше, в них допустим разрыв — в отличие от «Ленты», которая догоняется без дыр (см. Догонять без дыр)."
details.en = "“Home” (`home`) — the people you follow, without bots; it opens by default. “Local” — your whole server. “Federated” — everything your server knows from all servers. Federated and Local are fetched only while open and have no unread counts: they are for browsing, not for reading to the end. A gap between a fresh page and what was there before is allowed in them — unlike Home, which catches up with no holes (see Catching up with no holes)."

