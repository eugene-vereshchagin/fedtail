details.en = "Search on the server: people, tags, posts (as far as the server indexes them), and a link to a post or a profile — the server finds it and fetches it."

[[feature]]
id = "tag-groups"
status = "has"
since = "0.14.0"
name.ru = "Лента из нескольких тегов"
name.en = "A lane of several tags"
config.ru = "`[[lanes.tag_groups]]`; из поиска — «＋ в ленты»"
config.en = "`[[lanes.tag_groups]]`; from the search — “＋ to lanes”"
api.ru = "`timelines/tag/:name` по каждому тегу, склейка у себя"
api.en = "`timelines/tag/:name` for each tag, put together here"
others.ru = "Phanpy, Ice Cubes («группы тегов»), tut (`:tag a b`)"
others.en = "Phanpy, Ice Cubes (“tag groups”), tut (`:tag a b`)"
clients = ["Phanpy", "Ice Cubes", "tut"]
details.ru = "Набери в поиске `#грузия #georgia -#политика`: откроется одна лента по всем этим тегам — любой из них, `+#тег` обязательно есть, `-#тег` — кроме. Кнопка «＋ в ленты» держит её слева, в группе «Теги»; подгружается, пока открыта, как Федерация. Те же ленты можно описать в конфиге, `[[lanes.tag_groups]]` (name, any, all, none). Серверу нужен запрос на каждый тег (GoToSocial понимает только один тег за раз), fedtail склеивает их сам, без повторов."
details.en = "Type `#грузия #georgia -#politics` in the search: one lane of all these tags opens — any of them, `+#tag` must be there, `-#tag` — without. The “＋ to lanes” button keeps it on the left, in the “Tags” group; it is fetched while open, like Federated. The same lanes can be described in the config, `[[lanes.tag_groups]]` (name, any, all, none). The server needs a request per tag (GoToSocial reads only one tag at a time), fedtail puts them together itself, without repeats."

[[feature]]
id = "columns"
status = "has"
since = "0.14.0"
name.ru = "Колонки рядом"
name.en = "Columns side by side"
config.ru = "`ui.layout`, `ui.columns`, `ui.column_width`; кнопка ❯ вверху слева"
config.en = "`ui.layout`, `ui.columns`, `ui.column_width`; the ❯ button at the top left"
api.ru = "своё"
api.en = "own"
others.ru = "Sengi, Phanpy, tut, Whalebird, Mastodon web (продвинутый режим)"
others.en = "Sengi, Phanpy, tut, Whalebird, Mastodon web (advanced mode)"
clients = ["Mastodon web", "Phanpy", "Sengi", "tut", "Whalebird"]
details.ru = "Несколько лент на экране одновременно, колонками. По умолчанию — одна лента за раз; кнопка ❯ вверху слева (рядом с ≡ и ↔) включает колонки на время, а при запуске окно такое, как `ui.layout`. Клик по ленте слева добавляет колонку (или прокручивает к ней), ✕ убирает, ‹ › двигают; набор запоминается. Это те же ленты, что и в одиночном виде: позиция, фильтры и прочитанное у каждой свои, лента «Федерация» и прочие обзорные обновляются, пока стоят колонкой."
details.en = "Several lanes on screen at once, in columns. By default — one lane at a time; the ❯ button at the top left (next to ≡ and ↔) turns columns on for now, and the window starts as `ui.layout` says. A click on a lane on the left adds a column (or scrolls to it), ✕ takes it away, ‹ › move it; the set is remembered. These are the same lanes as in the single view: place, filters and read marks are each their own, and Federated and the other browse lanes keep updating while they stand in a column."

[[feature]]
id = "roster"
status = "partly"
since = "0.17.0"
name.ru = "Ростер, как в аське"
name.en = "A roster, as in ICQ clients"
config.ru = "`ui.layout = \"qip\"` или на один запуск `fedtail --layout split`, `ui.roster_on_top`, `ui.roster_threads`"
config.en = "`ui.layout = \"qip\"` or for one run `fedtail --layout split`, `ui.roster_on_top`, `ui.roster_threads`"
api.ru = "своё"
api.en = "own"
others = "—"
details.ru = "Ленты — в узком окне-ростере, как в QIP, Psi или Mail.ru Агенте: сверху я и «N новых в активности», поиск, группы «▾ Личное (2/9)» (с новым / всего), сворачиваются; у каждой ленты число нового, строка последнего поста курсивом и лицо его автора. Клик открывает ленту в главном окне, которое здесь — окно сообщений, без боковой панели. Закрыть ростер — закрыть fedtail (в трей, если `ui.close_to_tray`), окно сообщений — только его. Дальше: треды и беседы пунктами ростера, окно сообщений репликами, темы в духе QIP, Psi и Агента (docs/LAYOUTS.md)."
details.en = "The lanes in a narrow roster window, as in QIP, Psi or the Mail.ru Agent: me and “N new in Activity” on top, a search line, groups “▾ Personal (2/9)” (with something new / all) that fold; each lane with its count, a line of its newest post in italics and its author's face. A click opens the lane in the main window, which here is the messages window, without the sidebar. Closing the roster closes fedtail (to the tray with `ui.close_to_tray`), the messages window — only itself. Next: threads and conversations as roster items, the messages window as a chat, themes in the spirit of QIP, Psi and the Agent (docs/LAYOUTS.md)."

