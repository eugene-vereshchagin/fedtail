# Read marks and place — a chapter of docs/{ru,en}/features.md; built by tools/docs_build.py

id = "reading"
title.ru = "Прочитанное и позиция"
title.en = "Read marks and place"

[[feature]]
id = "oldest-first"
status = "has"
android = "has"
since = "0.1.0"
name.ru = "Порядок «старое сверху», ничего не прыгает"
name.en = "Oldest on top, nothing jumps"
config = "`reading.order`, `reading.start_at`, `reading.on_new`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "`reading.order = \"oldest_first\"` — старое сверху, читаешь вниз, как RSS или Point (`\"newest_first\"` — как у всех). `reading.start_at = \"first_unread\"` — открыл ленту и стоишь на первом непрочитанном (`\"newest\"` — на самом свежем). `reading.on_new = \"keep_position\"` — пришло новое, а позиция не меняется, растёт только счётчик (`\"jump_to_newest\"` — прыгнуть к новому)."
details.en = "`reading.order = \"oldest_first\"` — oldest on top, you read downwards, like RSS or Point (`\"newest_first\"` — as everyone does). `reading.start_at = \"first_unread\"` — open a lane and you stand at the first unread (`\"newest\"` — at the freshest). `reading.on_new = \"keep_position\"` — new posts come and the place doesn't move, only the counter grows (`\"jump_to_newest\"` — jump to the new)."

[[feature]]
id = "catch-up"
status = "has"
android = "has"
since = "0.1.0"
name.ru = "Догонять ленту без дыр"
name.en = "Catching up with no holes"
config = "`reading.page_size`, `reading.catch_up_limit`"
api = "`min_id`"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Ленты, которые дочитывают, догоняются вперёд от последнего известного поста, страница за страницей (`page_size` постов за запрос, до `catch_up_limit` за опрос — остальное на следующем). Поэтому в локальной копии нет дыр и читать можно строго по хронологии. Кнопки «загрузить пропущенное», которую чинят другие клиенты (Fedilab в 2026-м — полдюжины исправлений про дыры и прыжки, часть на GoToSocial), здесь не нужно."
details.en = "Lanes meant to be read to the end catch up forward from the last known post, page by page (`page_size` posts a request, up to `catch_up_limit` a poll — the rest on the next one). So the local copy has no holes and you can read strictly in order. The “load what's missing” button other clients keep fixing (Fedilab in 2026 — half a dozen fixes about holes and jumps, some on GoToSocial) isn't needed here."

[[feature]]
id = "mark-read"
status = "has"
android = "has"
since = "0.1.0"
name.ru = "Когда пост считается прочитанным"
name.en = "When a post counts as read"
config = "`reading.mark_read`, `reading.read_button`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail (ручной режим)"
others.en = "only in fedtail (the manual mode)"
clients = []
details.ru = "`\"on_scroll\"` — когда прокрутил пост целиком; `\"on_open\"` — вся лента, как только открыл; `\"manual\"` — только руками: «Всё прочитано» над лентой, «Прочитано» и «Прочитано до сюда» (этот и всё старше) в меню ⋯. С ручным режимом лента всегда ждёт ровно там, где ты остановился, хоть читай по одному посту. `reading.read_button = true` — кнопка ✓ под каждым непрочитанным. Пункты меню работают при любом режиме."
details.en = "`\"on_scroll\"` — when you've scrolled past the whole post; `\"on_open\"` — the whole lane as soon as you open it; `\"manual\"` — by hand only: “All read” over the lane, “Mark read” and “Read up to here” (this one and everything older) in the ⋯ menu. In the manual mode a lane always waits exactly where you stopped, even reading one post at a time. `reading.read_button = true` — a ✓ button under each unread post. The menu items work in any mode."

