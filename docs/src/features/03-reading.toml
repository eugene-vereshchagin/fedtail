# Read marks and place — a chapter of docs/{ru,en}/features.md; built by tools/docs_build.py

id = "reading"
title.ru = "Прочитанное и позиция"
title.en = "Read marks and place"

[[feature]]
id = "oldest-first"
status = "has"
android = "has"
since = "0.1.0"
name.ru = "Порядок «старое сверху», ничего не прыгает"
name.en = "Oldest on top, nothing jumps"
config = "`reading.order`, `reading.start_at`, `reading.on_new`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "`reading.order = \"oldest_first\"` — старое сверху, читаешь вниз, как RSS или Point (`\"newest_first\"` — как у всех). `reading.start_at = \"first_unread\"` — открыл ленту и стоишь там, где стоял в ней в последний раз, в любом интерфейсе (прочитал в окне — терминал, веб и телефон откроют там же); дочитал дальше на другом устройстве (синхронизация приносит прочитанное) — на первом непрочитанном после прочитанного; а если негде — на первом непрочитанном (`\"newest\"` — на самом свежем). `reading.on_new = \"keep_position\"` — пришло новое, а позиция не меняется, растёт только счётчик (`\"jump_to_newest\"` — прыгнуть к новому)."
details.en = "`reading.order = \"oldest_first\"` — oldest on top, you read downwards, like RSS or Point (`\"newest_first\"` — as everyone does). `reading.start_at = \"first_unread\"` — open a lane and you stand where you stood in it last, in any interface (read in the window — the terminal, the web page and the phone open there too); read on further on another device (sync brings the read marks) — at the first unread after them; else at the first unread (`\"newest\"` — at the freshest). `reading.on_new = \"keep_position\"` — new posts come and the place doesn't move, only the counter grows (`\"jump_to_newest\"` — jump to the new)."

[[feature]]
id = "catch-up"
status = "has"
android = "has"
since = "0.1.0"
name.ru = "Догонять ленту без дыр"
name.en = "Catching up with no holes"
config = "`reading.page_size`, `reading.catch_up_limit`, `reading.late_hours`, `reading.late_minutes`"
api = "`min_id`, `max_id`"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Ленты, которые дочитывают, догоняются вперёд от последнего известного поста, страница за страницей (`page_size` постов за запрос, до `catch_up_limit` за опрос — остальное на следующем). Сервер нумерует пост по времени, когда его написали, поэтому пост, доставленный с опозданием, встаёт назад, среди уже забранного, и «новее последнего» его не приносит: раз в `late_minutes` минут лента просматривается на `late_hours` часов назад, и опоздавшие подбираются (без этого устройство, которое спрашивает часто, их теряло, а то, что спрашивает редко, — получало, и счётчики на телефоне и десктопе расходились). Поэтому в локальной копии нет дыр и читать можно строго по хронологии. Кнопки «загрузить пропущенное», которую чинят другие клиенты (Fedilab в 2026-м — полдюжины исправлений про дыры и прыжки, часть на GoToSocial), здесь не нужно."
details.en = "Lanes meant to be read to the end catch up forward from the last known post, page by page (`page_size` posts a request, up to `catch_up_limit` a poll — the rest on the next one). A server numbers a post by when it was written, so one delivered late stands back among what was fetched already, and \"newer than the newest\" never brings it: every `late_minutes` the lane is looked `late_hours` back and the late ones are picked up (without it a device asking often lost them, one asking seldom had them, and the phone's counts and the desktop's differed). So the local copy has no holes and you can read strictly in order. The “load what's missing” button other clients keep fixing (Fedilab in 2026 — half a dozen fixes about holes and jumps, some on GoToSocial) isn't needed here."

[[feature]]
id = "mark-read"
status = "has"
android = "has"
since = "0.1.0"
name.ru = "Когда пост считается прочитанным"
name.en = "When a post counts as read"
config = "`reading.mark_read`, `reading.read_button`, `reading.dwell_ms`, `reading.unfocused_seconds`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail (ручной режим)"
others.en = "only in fedtail (the manual mode)"
clients = []
details.ru = "`\"on_scroll\"` — когда прокрутил пост целиком и лента постояла `reading.dwell_ms`, или экран прошёл по нему целиком, пока ты листал рукой (быстро пролистанные картинки тоже); окно без фокуса — только пока его крутят рукой и `reading.unfocused_seconds` после (одно правило во всех интерфейсах, с 0.22.0); `\"on_open\"` — вся лента, как только открыл; `\"manual\"` — только руками: «Всё прочитано» над лентой, «Прочитано» и «Прочитано до сюда» (этот и всё старше) в меню ⋯. С ручным режимом лента всегда ждёт ровно там, где ты остановился, хоть читай по одному посту. `reading.read_button = true` — кнопка ✓ под каждым непрочитанным. Пункты меню работают при любом режиме."
details.en = "`\"on_scroll\"` — when you've scrolled past the whole post and the feed stood `reading.dwell_ms`, or the screen went over all of it while you scrolled by hand (pictures flipped through quickly too); a window without focus — only while scrolled by hand and `reading.unfocused_seconds` after (one rule in every interface, since 0.22.0); `\"on_open\"` — the whole lane as soon as you open it; `\"manual\"` — by hand only: “All read” over the lane, “Mark read” and “Read up to here” (this one and everything older) in the ⋯ menu. In the manual mode a lane always waits exactly where you stopped, even reading one post at a time. `reading.read_button = true` — a ✓ button under each unread post. The menu items work in any mode."

