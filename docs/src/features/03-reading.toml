[[feature]]
id = "markers"
status = "has"
android = "has"
since = "0.8.0"
name.ru = "Позиция чтения общая с другими клиентами"
name.en = "The reading place is shared with other clients"
config = "`sync.sync_markers`"
api = "`/api/v1/markers`"
others = "Mastodon web, Tusky, Ivory, Phanpy, Ice Cubes"
clients = ["Mastodon web", "Tusky", "Ivory", "Phanpy", "Ice Cubes"]
details.ru = "Дочитал «Ленту» или упоминания на телефоне — здесь это тоже прочитано, и наоборот. Работает с Mastodon, GoToSocial, Akkoma — если тот клиент сообщает место серверу: веб Mastodon, Ivory, Phanpy сообщают, Tusky держит место в «Ленте» у себя и делится только уведомлениями. `false` — прочитанное живёт только в fedtail."
details.en = "Read Home or mentions to the end on the phone — here it's read too, and the other way round. Works with Mastodon, GoToSocial, Akkoma — if that client tells the server its place: Mastodon's web, Ivory, Phanpy do; Tusky keeps its place in Home to itself and shares only notifications. `false` — read marks live in fedtail only."

[[feature]]
id = "device-sync"
status = "has"
android = "has"
since = "0.18.0"
name.ru = "Прочитанное, подписки на треды и порядок лент — общие на всех твоих устройствах"
name.en = "Read marks, thread subscriptions and lane order shared by all your devices"
config = "`sync.url` or `sync.folder` (none — no sync), `sync.read`, `sync.threads`, `sync.lanes`, `sync.drafts`, `sync.activity`, `sync.tiles`, `sync.lane_rules`, `sync.interval_seconds`; `fedtail sync status|key|join|login|now`"
api.ru = "своё: сервер fedtail-sync (один файл, `fedtail_sync.py`, fedtail-syncserver), общая папка или WebDAV; на сервере журнал принадлежит ключу и заводится по коду приглашения — без входа"
api.en = "own: a fedtail-sync server (one file, `fedtail_sync.py`, fedtail-syncserver), a shared folder or WebDAV; on a server the journal is the key's, made with an invite code — no login"
others.ru = "только в fedtail (markers — лишь место в «Ленте» и уведомлениях)"
others.en = "only in fedtail (markers are just the place in Home and notifications)"
clients = []
details.ru = "Прочитал пост на ноутбуке — на десктопе он прочитан; подписался на тред, вышел из него или заглушил, передвинул список или сохранил ленту тегов — так и на других устройствах. Синхронизация — отдельный сервис: работает, только если в конфиге указан `sync.url` (или `sync.folder`); без него её нет, и это видно справа в строке статуса («⇅ нет», «⇅ 21:40», «⇅ !») и в «О программе». Отметки, которые fedtail ставит сам (всё прочитано при первом запуске, старая история, свои посты), не уходят: новое устройство не прочитает за тебя десктоп. Каждое устройство пишет журнал своих действий, журналы встречаются на сервере fedtail-sync или в папке, которую видят все устройства (шара NAS, WebDAV, Syncthing). Журналы зашифрованы ключом, который есть только у твоих устройств: хранилище не видит, что ты читал. Первое устройство делает ключ само; `fedtail sync key` показывает его, `fedtail sync join` переносит на другое. Серверу синхронизации fedtail даёт не свой токен, а отдельный, которым можно только узнать «кто я» (`fedtail sync login`). Как поднять свой сервер — docs/ru/sync.md."
details.en = "Read a post on the laptop — it's read on the desktop; follow a thread, leave it or mute it, move a list or save a tag lane — so it is on the other devices. Sync is a service of its own: it works only when the config has `sync.url` (or `sync.folder`); without it there is none, and the right of the status bar says so (“⇅ off”, “⇅ 21:40”, “⇅ !”), as does About. Marks fedtail makes by itself (everything read on the first run, older history, your own posts) stay home: a new device won't read the desktop for you. Each device writes a journal of what it did; the journals meet on a fedtail-sync server or in a folder all the devices see (a NAS share, WebDAV, Syncthing). The journals are sealed with a key only your devices have: the store doesn't see what you read. The first device makes the key; `fedtail sync key` shows it, `fedtail sync join` carries it to another. To the sync server fedtail gives not its own token but a separate one that can only tell “who am I” (`fedtail sync login`). Setting up a server of your own — docs/en/sync.md."

[[feature]]
id = "build-around"
status = "has"
android = "has"
since = "0.11.0"
name.ru = "В памяти — только карточки у экрана"
name.en = "Only the cards near the screen are in memory"
config = "`reading.render_limit`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Лента любой длины держит виджеты только для карточек на экране и экрана выше и ниже (с 0.22: раньше — от 40 до 120 карточек со всеми картинками, около 18 МБ на ленту); остальные посты — только место по высоте. Прокрутка строит подходящие карточки и отпускает ушедшие далеко, помня, что в них сделано (открытое предупреждение, показанный перевод). То, что ты читаешь, не сдвигается: держит карточка вверху экрана. На экране держится не больше `render_limit` последних постов, старые — по кнопке «раньше». Тред и профиль строятся целиком."
details.en = "A lane of any length keeps widgets only for the cards on screen and a screen above and below (since 0.22: before, 40 to 120 cards with all their pictures, some 18 MB a lane); the other posts are only a place of their height. Scrolling builds the cards coming near and lets go of those gone far, remembering what was done to them (a warning opened, a translation shown). What you read doesn't move: the card on top of the screen holds it. At most `render_limit` latest posts are kept, older ones with the “older” button. A thread and a profile are built whole."

[[feature]]
id = "esc-curtain"
status = "has"
android = "na"
android_note.ru = "на телефоне нет Esc"
android_note.en = "a phone has no Esc"
since = "0.3.0"
name.ru = "Esc — шторка, а не закрытие окна"
name.en = "Esc draws a curtain instead of closing the window"
config = "`window.esc`, `window.start_lane`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Esc закрывает то, что сверху (картинку, поиск), а последний Esc при `window.esc = \"curtain\"` задёргивает все ленты шторкой: окно на месте, слева счётчики, справа пусто, и ничего не отмечается прочитанным — утром откроешь, а новое накопилось. `\"tray\"` — убрать в трей, `\"off\"` — ничего. С чего начинать при запуске — `window.start_lane`: `\"none\"` (шторка, Enter откроет прошлую), `\"last\"` или имя ленты."
details.en = "Esc closes what's on top (a picture, the search), and the last Esc with `window.esc = \"curtain\"` draws a curtain over all lanes: the window stays, the counts on the left, nothing on the right, and nothing is marked read — open it in the morning and the new has piled up. `\"tray\"` — off to the tray, `\"off\"` — nothing. What to start with — `window.start_lane`: `\"none\"` (the curtain, Enter opens the last one), `\"last\"` or a lane's name."

[[feature]]
id = "sync-draft-pictures"
status = "has"
android = "has"
since = "0.22.0"
name.ru = "Картинки черновика едут вместе с ним"
name.en = "A draft's pictures travel with it"
config = "`sync.drafts`; the server: `max_media_kb`, `media_quota_mb`, `media_keep_days`, `media_per_minute`"
api.ru = "своё: `PUT/GET/DELETE /v1/media/<имя>` у fedtail-sync, `media/` в папке"
api.en = "own: `PUT/GET/DELETE /v1/media/<name>` of fedtail-sync, `media/` in a folder"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Начатый с картинкой черновик дописывается на другом устройстве с той же картинкой, описанием и точкой фокуса. Каждая картинка запечатана ключом аккаунта и названа его хешем: уходит один раз, сколько бы черновик ни сохранялся; отправил или стёр черновик — его картинки уходят и из хранилища. Слишком большая для хранилища или им выброшенная — остаётся на своём устройстве, остальное едет. Сервер синхронизации держит картинки отдельной квотой: сверх неё уходят давно не нужные, так что черновики в цикле перемалывают только свои картинки, а не журнал и не диск."
details.en = "A draft begun with a picture is finished on another device with the same picture, its description and focus point. Each picture is sealed with the account's key and named by its hash: it goes once however often the draft is saved; a sent or emptied draft takes its pictures off the store too. One too big for the store, or dropped by it, stays on its own device; the rest travels. The sync server keeps pictures under a quota of their own where the least used go first, so drafts made in a loop churn only their own pictures, not the journal or the disk."

[[feature]]
id = "sync-rest"
status = "has"
since = "0.22.0"
android = "has"
name.ru = "Синхронизация: WebDAV напрямую, журнал упаковывается"
name.en = "Sync: WebDAV spoken directly, the journal packed"
config = "`sync.webdav`, `sync.webdav_user`"
others = "—"
size.ru = "средний"
size.en = "medium"
details.ru = "Папка WebDAV (Nextcloud, ownCloud, NAS) без монтирования: пароль спрашивается один раз и хранится в папке данных профиля, не в конфиге. Каждое устройство время от времени упаковывает свой журнал в снимок и удаляет свои старые файлы или блобы (сервер fedtail-sync 0.22+: `DELETE /v1/devices/<id>`), так что журнал не растёт до квоты."
details.en = "A WebDAV folder (Nextcloud, ownCloud, a NAS) without mounting: the password is asked once and kept in the profile's data folder, not in the config. Every device now and then packs its own journal into a snapshot and drops its older files or blobs (a fedtail-sync server 0.22+: `DELETE /v1/devices/<id>`), so the journal doesn't grow to the quota."

[[feature]]
id = "hold-new"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Новое ждёт «Обновить»"
name.en = "New posts wait for Refresh"
config = "`reading.on_new = \"hold\"`"
api.ru = "своё"
api.en = "own"
others = "Elk"
clients = ["Elk"]
details.ru = "Пришедшее после того, как лента нарисована, в неё не вставляется: в заголовке ленты «новых: N — «Обновить» покажет», а ⟳ / F5 впускает их. Более старое (листание вниз) приходит сразу."
details.en = "What comes after the lane is drawn doesn't go into it: the lane's header says \"N new — Refresh shows them\", and ⟳ / F5 lets them in. Older posts (paging down) come at once."

[[feature]]
id = "sync-wizard"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Синхронизация настраивается в окне по шагам, новое устройство — одним паролем"
name.en = "Sync set up in the window step by step, a new device by a password alone"
config.ru = "≡ → Синхронизация (или щелчок по «⇅»); `fedtail sync keep` / `unlock`"
config.en = "≡ → Sync (or a click on \"⇅\"); `fedtail sync keep` / `unlock`"
api.ru = "своё: ключ в журнале, запечатанный паролем (scrypt + AES-GCM)"
api.en = "own: the key in the journal, sealed by a password (scrypt + AES-GCM)"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Три шага с отметками ✓ / ▶ / ·: где встречаются устройства (адрес сервера или папка — сразу в config.toml, без перезапуска), вход на сервер синхронизации, и развилка — «это первое устройство» (ключ делается здесь) или «добавляю к настроенным» (ключ с другого устройства — там «Показать ключ» даёт QR-код, телефон его сканирует, и текст, чтобы вставить; или достать ключ из журнала паролем для новых устройств). Пароль — по желанию: его придумываешь ты, это не пароль аккаунта. Так же в терминале, на веб-странице и на телефоне."
details.en = "Three steps marked ✓ / ▶ / ·: where the devices meet (a server's address or a folder — into config.toml at once, no restart), the login to the sync server, and the fork — \"this is my first device\" (the key made here) or \"adding to those set up\" (the key from another device — there \"Show the key\" gives a QR code the phone scans, and the text to paste; or the key taken out of the journal with the password for new devices). The password is optional: one you make up, not the account's. The same in the terminal, on the web page and on the phone."

[[feature]]
id = "older-ahead"
status = "has"
android = "has"
since = "0.21.0"
name.ru = "Лента без шва: старые посты подгружаются сами"
name.en = "A lane without a seam: older posts come by themselves"
config = "`reading.older_ahead`"
api.ru = "своё"
api.en = "own"
others = "Mastodon web, Tusky, Phanpy, Ivory"
clients = ["Mastodon web", "Tusky", "Phanpy", "Ivory"]
details.ru = "Дочитал почти до конца того, что лента показывает, — fedtail сам берёт с сервера страницу более старых, как кнопка «раньше». По одной странице за раз; пришла пустая — больше сам не спрашивает (кнопка остаётся). Старое не считается новым."
details.en = "Read nearly to the end of what a lane shows — fedtail fetches a page of older posts itself, as the \"older\" button does. One page at a time; an empty one — it asks no more by itself (the button stays). The old isn't counted as new."
