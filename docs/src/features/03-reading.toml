[[feature]]
id = "markers"
status = "has"
android = "has"
since = "0.8.0"
name.ru = "Позиция чтения общая с другими клиентами"
name.en = "The reading place is shared with other clients"
config = "`sync.sync_markers`"
api = "`/api/v1/markers`"
others = "Mastodon web, Tusky, Ivory, Phanpy, Ice Cubes"
clients = ["Mastodon web", "Tusky", "Ivory", "Phanpy", "Ice Cubes"]
details.ru = "Дочитал «Ленту» или упоминания на телефоне — здесь это тоже прочитано, и наоборот. Работает с Mastodon, GoToSocial, Akkoma — если тот клиент сообщает место серверу: веб Mastodon, Ivory, Phanpy сообщают, Tusky держит место в «Ленте» у себя и делится только уведомлениями. `false` — прочитанное живёт только в fedtail."
details.en = "Read Home or mentions to the end on the phone — here it's read too, and the other way round. Works with Mastodon, GoToSocial, Akkoma — if that client tells the server its place: Mastodon's web, Ivory, Phanpy do; Tusky keeps its place in Home to itself and shares only notifications. `false` — read marks live in fedtail only."

[[feature]]
id = "device-sync"
status = "has"
android = "has"
since = "0.18.0"
name.ru = "Прочитанное, подписки на треды и порядок лент — общие на всех твоих устройствах"
name.en = "Read marks, thread subscriptions and lane order shared by all your devices"
config = "`sync.url` or `sync.folder` (none — no sync), `sync.read`, `sync.threads`, `sync.lanes`, `sync.drafts`, `sync.activity`, `sync.tiles`, `sync.lane_rules`, `sync.interval_seconds`; `fedtail sync status|key|join|login|now`"
api.ru = "своё: сервер fedtail-sync (один файл, `syncserver/fedtail_sync.py`) или общая папка; вход по токену только `read:accounts`"
api.en = "own: a fedtail-sync server (one file, `syncserver/fedtail_sync.py`) or a shared folder; it is entered with a `read:accounts`-only token"
others.ru = "только в fedtail (markers — лишь место в «Ленте» и уведомлениях)"
others.en = "only in fedtail (markers are just the place in Home and notifications)"
clients = []
details.ru = "Прочитал пост на ноутбуке — на десктопе он прочитан; подписался на тред, вышел из него или заглушил, передвинул список или сохранил ленту тегов — так и на других устройствах. Синхронизация — отдельный сервис: работает, только если в конфиге указан `sync.url` (или `sync.folder`); без него её нет, и это видно справа в строке статуса («⇅ нет», «⇅ 21:40», «⇅ !») и в «О программе». Отметки, которые fedtail ставит сам (всё прочитано при первом запуске, старая история, свои посты), не уходят: новое устройство не прочитает за тебя десктоп. Каждое устройство пишет журнал своих действий, журналы встречаются на сервере fedtail-sync или в папке, которую видят все устройства (шара NAS, WebDAV, Syncthing). Журналы зашифрованы ключом, который есть только у твоих устройств: хранилище не видит, что ты читал. Первое устройство делает ключ само; `fedtail sync key` показывает его, `fedtail sync join` переносит на другое. Серверу синхронизации fedtail даёт не свой токен, а отдельный, которым можно только узнать «кто я» (`fedtail sync login`). Как поднять свой сервер — docs/ru/sync.md."
details.en = "Read a post on the laptop — it's read on the desktop; follow a thread, leave it or mute it, move a list or save a tag lane — so it is on the other devices. Sync is a service of its own: it works only when the config has `sync.url` (or `sync.folder`); without it there is none, and the right of the status bar says so (“⇅ off”, “⇅ 21:40”, “⇅ !”), as does About. Marks fedtail makes by itself (everything read on the first run, older history, your own posts) stay home: a new device won't read the desktop for you. Each device writes a journal of what it did; the journals meet on a fedtail-sync server or in a folder all the devices see (a NAS share, WebDAV, Syncthing). The journals are sealed with a key only your devices have: the store doesn't see what you read. The first device makes the key; `fedtail sync key` shows it, `fedtail sync join` carries it to another. To the sync server fedtail gives not its own token but a separate one that can only tell “who am I” (`fedtail sync login`). Setting up a server of your own — docs/en/sync.md."

[[feature]]
id = "build-around"
status = "has"
android = "has"
since = "0.11.0"
name.ru = "Карточки строятся вокруг места чтения"
name.en = "Cards are built around the reading place"
config = "`reading.build_at_once`, `reading.render_limit`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "При открытии ленты строится `build_at_once` карточек вокруг места, где ты читаешь; остальные — когда подкручиваешь к краю, а далеко позади отпускаются (больше трёх `build_at_once` — обратно до одного позади и двух впереди). То, что ты читаешь, не сдвигается; фильтр и «только непрочитанное» тоже строят только вокруг места чтения. На экране держится не больше `render_limit` последних постов, старые — по кнопке «раньше». `0` в `build_at_once` — строить всё сразу (на сотнях постов это секунды)."
details.en = "When a lane opens, `build_at_once` cards are built around where you read; the rest — as you scroll near an edge, and far behind they are let go (more than three `build_at_once` — back to one behind and two ahead). What you read doesn't move; a filter and “unread only” also build only around the reading place. At most `render_limit` latest posts are kept on screen, older ones with the “older” button. `0` in `build_at_once` — build everything at once (on hundreds of posts that takes seconds)."

[[feature]]
id = "esc-curtain"
status = "has"
android = "na"
android_note.ru = "на телефоне нет Esc"
android_note.en = "a phone has no Esc"
since = "0.3.0"
name.ru = "Esc — шторка, а не закрытие окна"
name.en = "Esc draws a curtain instead of closing the window"
config = "`window.esc`, `window.start_lane`"
api.ru = "своё"
api.en = "own"
others.ru = "только в fedtail"
others.en = "only in fedtail"
clients = []
details.ru = "Esc закрывает то, что сверху (картинку, поиск), а последний Esc при `window.esc = \"curtain\"` задёргивает все ленты шторкой: окно на месте, слева счётчики, справа пусто, и ничего не отмечается прочитанным — утром откроешь, а новое накопилось. `\"tray\"` — убрать в трей, `\"off\"` — ничего. С чего начинать при запуске — `window.start_lane`: `\"none\"` (шторка, Enter откроет прошлую), `\"last\"` или имя ленты."
details.en = "Esc closes what's on top (a picture, the search), and the last Esc with `window.esc = \"curtain\"` draws a curtain over all lanes: the window stays, the counts on the left, nothing on the right, and nothing is marked read — open it in the morning and the new has piled up. `\"tray\"` — off to the tray, `\"off\"` — nothing. What to start with — `window.start_lane`: `\"none\"` (the curtain, Enter opens the last one), `\"last\"` or a lane's name."

