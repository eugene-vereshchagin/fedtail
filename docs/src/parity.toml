# ---- the same, in other words ------------------------------------------------------------

[[wording]]
in = ["tui", "web"]
why.ru = "Общие слова окна (кнопки диалогов, строки состояния): терминал и веб говорят их своими словами (`tui_*`, `web_*`)."
why.en = "The window's common words (dialog buttons, status lines): the terminal and the web page say them in their own (`tui_*`, `web_*`)."
keys = ["close", "close_tab", "copy", "show", "open_action", "open_profile", "error",
        "and_more", "new_n", "connected", "connecting", "first_poll", "sending",
        "send_maybe", "rate_limited", "server_down", "searching", "search_found",
        "search_side", "search_side_tip", "long_form_wait", "menu_people", "new_options",
        "cmd_placeholder", "cmd_tip", "text_placeholder", "text_placeholder_md",
        "schedule_ok", "show_original", "sensitive_click", "cw_hide", "cw_show",
        "a11y_no_alt", "tender_menu", "list_added"]

[[wording]]
in = ["web"]
why.ru = "Редактор и меню веба говорят своими словами и значками (📎 📊 🕒 ⚠🖼), а места — заголовками мест."
why.en = "The web page's editor and menu speak in words and icons of their own (📎 📊 🕒 ⚠🖼), and the places by the places' titles."
keys = ["alt_title", "cancel", "compose_edit", "compose_invite", "compose_new",
        "compose_quote", "compose_reply", "draft_saved", "edit_hint", "edited_msg",
        "handle_copied", "link_refused", "load_failed", "loading", "media_audio",
        "media_click", "media_files", "media_gifv", "media_image", "media_tip",
        "media_unknown", "media_video", "menu", "poll_add", "quit", "resolve_browser",
        "resolving", "save_failed", "schedule", "send_failed_text", "sensitive_mark",
        "debug_federation", "issue_menu", "all_read"]

[[wording]]
in = ["tui"]
why.ru = "Редактор терминала: предупреждение, опрос и «позже» — в меню Ctrl+O, своими словами."
why.en = "The terminal's editor: the warning, a poll and “later” are in its Ctrl+O menu, in its own words."
keys = ["cw_add", "lang_default", "lang_tip", "poll_add_tip", "schedule_tip",
        "scheduled_msg", "sensitive_mark_tip", "sensitive_media"]

[[wording]]
in = ["tui", "web"]
why.ru = "Окна показывают справку по командам отдельным окном и называют вкладку колонок «Колонки»; терминал и веб — справку местом «Справка», колонок у них нет."
why.en = "The windows show the commands' help in a window of its own and call the columns' tab “Columns”; the terminal and the web page show the help as the Help place and have no columns."
keys = ["cmd_help_title", "columns"]

[[wording]]
in = ["gtk", "tui", "web"]
why.ru = "То же самое, сделанное иначе: заявку в подписчики GTK открывает профилем здесь же (Qt — ссылкой в браузер), ошибку отправки пишет под полем (Qt — окном), серверы в «Тишине» зовёт «Заблокированные серверы», дату объявления пишет по теме."
why.en = "The same, done otherwise: GTK opens a follow request's profile right here (Qt — a link to the browser), says a failed send under the field (Qt — a window), calls the servers in Silence “Blocked servers”, writes an announcement's date by the theme."
keys = ["profile", "send_failed", "silence_domains", "months"]

[[wording]]
in = ["gtk", "tui", "web"]
why.ru = "Подпись к картинке в редакторе: Qt пишет у значка «есть подпись / без подписи», GTK даёт поле подписи прямо в строке картинки, терминал и веб — в своём диалоге подписи."
why.en = "A picture's description in the editor: Qt marks the icon “described / no description”, GTK puts the description field right in the picture's row, the terminal and the web page — in their own description dialog."
keys = ["alt_set"]

[[wording]]
in = ["gtk", "web"]
why.ru = "То же у GTK и веба: подпись правится прямо в строке картинки или в своём диалоге."
why.en = "The same for GTK and the web page: the description is edited right in the picture's row or in a dialog of its own."
keys = ["no_alt"]

[[wording]]
in = ["gtk", "tui", "web"]
why.ru = "Что уведомлениям некуда идти, кроме трея, — забота окна Qt; GTK говорит это своими словами, у терминала и веба трея нет."
why.en = "That notifications have nowhere to go but the tray is the Qt window's concern; GTK says it in its own words, the terminal and the web page have no tray."
keys = ["notify_no_send"]

[[wording]]
in = ["qt", "gtk"]
why.ru = "«Всё прочитано» терминала; окно говорит «Отметить всё прочитанным» кнопкой."
why.en = "The terminal's “all read”; the window says “Mark all read” on a button."
keys = ["all_read"]

[[wording]]
in = ["qt", "gtk", "tui"]
why.ru = "Слова терминальных команд (`fedtail lanes`, `show`…) и веба для тех, кто не вошёл."
why.en = "The words of the terminal commands (`fedtail lanes`, `show`…) and the web page for those not logged in."
keys = ["cli_login_first"]

[[wording]]
in = ["qt", "gtk", "web"]
why.ru = "Слова терминала: «да/нет» в его вопросах, вложения строкой."
why.en = "The terminal's words: “yes/no” in its questions, attachments as a line."
keys = ["cli_media", "no_short", "yes_short", "post_maybe_sent"]

[[wording]]
in = ["qt", "gtk"]
why.ru = "Подпись поля языка в формах терминала и веба; окно показывает список языков."
why.en = "The language field's label in the terminal's and the web page's forms; the window shows a list of languages."
keys = ["lang_label"]

[[wording]]
in = ["qt", "tui", "web"]
why.ru = "GTK проверяет время «позже» сам; Qt и веб не дают выбрать раньше чем через пять минут."
why.en = "GTK checks the “later” time itself; Qt and the web page don't let you pick less than five minutes ahead."
keys = ["schedule_too_soon"]
