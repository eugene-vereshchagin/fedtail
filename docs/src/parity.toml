android_note.ru = "наводить мышь нечем"
android_note.en = "nothing to hover with"
name.ru = "Подсказки при наведении и «Что это?»"
name.en = "Tooltips and “What's this?”"
tui = "na"
web = "partly"
note.ru = "В терминале наводить нечем — подсказки там в строке клавиш внизу. В вебе подсказки у кнопок, лент и пунктов меню; режима «Что это?» нет (браузер и так показывает подсказку при наведении), и нет подсказок у того, чего у веба нет (ширина колонки, размер редактора, трассировка)."
note.en = "A terminal has no pointer to hover — its hints are in the key line at the bottom. The web page has tooltips on buttons, lanes and menu items; no “What's this?” mode (the browser shows a tooltip on hover anyway), and none for what the page doesn't have (column width, editor size, tracing)."
keys = ["whats_this", "whats_this_on", "whats_this_tip", "tip_activity", "tip_bookmarks",
        "tip_bots", "tip_direct", "tip_federated", "tip_home", "tip_local", "tip_mentions",
        "tip_my_likes", "tip_my_posts", "tip_replies", "tip_requests", "tip_subs",
