area = "writing"
android = "partly"
android_note.ru = "проверяет клавиатура телефона"
android_note.en = "the phone's keyboard checks"
name.ru = "Проверка орфографии в окне поста"
name.en = "Spell checking in the post window"
tui = "partly"
web = "partly"
note.ru = "Окна подчёркивают ошибки и правят их правым кликом; терминал — списком по F7 (подчеркнуть в поле ввода нечем); веб — встроенной проверкой браузера на языке поста."
note.en = "The windows underline mistakes and fix them with a right click; the terminal — as a list on F7 (its input has no underline); the web page — the browser's own checker in the post's language."
keys = ["spell_add", "spell_none", "spell_unavailable"]

[[wording]]
in = ["qt", "gtk", "web"]
why.ru = "Список подозрительных слов — способ терминала; окна и браузер подчёркивают их прямо в тексте."
why.en = "The list of suspicious words is the terminal's way; the windows and the browser underline them right in the text."
keys = ["spell_check", "spell_wrong_n", "spell_all_ok"]

[[wording]]
in = ["qt", "gtk"]
why.ru = "Окна открывают занятый профиль поднятием его окна — сказать «профиль занят» им не нужно."
why.en = "The windows open a busy profile by raising its window — they never need to say “the profile is busy”."
keys = ["profile_busy"]
