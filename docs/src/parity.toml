# What is not the same in the five interfaces (Qt, GTK, the terminal, the web page, Android) —
# and why. tests/test_parity.py holds it against the code: every word of the interface
# (an i18n key) one interface shows and another doesn't must be explained here, and an
# interface marked "has" must show every word of its capability. tools/docs_build.py
# turns it into the "Interfaces" chapter of docs/{ru,en}/features.md (and the site).
#
# [[capability]]: a function some interface lacks or has in part.
#   status per interface: qt, gtk, tui, web = "has" (default) | "partly" | "no" | "na"
#   ("na": doesn't belong there — a tray in a browser tab); note: what and why.
#   android: the phone (android/), said for every capability — it has its own screens
#   and words, so the check by i18n keys doesn't reach it; android_note.ru/en: why, when
#   it isn't "has" (tests/test_parity.py checks both are there).
#   keys: the words that show it; an interface marked "has" must show all of them.
# [[wording]]: words an interface doesn't use although it has the function — it says
#   it otherwise (its own tui_*/web_* words, an icon), or they aren't a function at all.

