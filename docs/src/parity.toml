android_note.en = "the windows' themes' colours, fonts and pictures, “try” in the menu; no themes folder"
name.ru = "Темы: попробовать, папка тем"
name.en = "Themes: try one, the themes folder"
tui = "partly"
web = "partly"
note.ru = "У терминала свои темы (`tui.theme`). Веб берёт из тем окон цвета и шрифт и пробует их из меню ≡, но папку тем не открывает: страница — гость в браузере."
note.en = "The terminal has themes of its own (`tui.theme`). The web page takes the windows' themes' colours and font and tries them from the ≡ menu, but doesn't open the themes folder: the page is a guest in the browser."
keys = ["try_theme", "theme_in_config", "theme_tried", "open_themes"]

